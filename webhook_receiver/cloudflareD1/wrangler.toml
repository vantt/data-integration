name = "webhook-receiver"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# CRITICAL: keep the workers.dev URL ENABLED — the Sapo webhook ingestion +
# local /poll consumer target webhook-receiver.admin-1d2.workers.dev. Adding a
# custom-domain route disables workers.dev by default, which would break ingestion.
workers_dev = true

# Hug touchpoint runs on the SAME Worker via a custom domain — QR scans hit /h/{token}.
# Webhook ingestion keeps its default workers.dev URL (one Worker, two domains).
# Requires the fjp.vn zone to be on this Cloudflare account. Takes effect on `wrangler deploy`.
routes = [
  { pattern = "hug.fjp.vn", custom_domain = true }
]

# Non-secret config. HUG_ADMIN_SECRET stays a wrangler secret (do NOT put it here).
[vars]
HUG_FALLBACK_URL = "https://finejapanvietnam.com"
# Zalo OA follow link shown on the opt-in landing page (/optin/:token).
# Override per environment: `wrangler secret put HUG_ZALO_OA_URL` for prod,
# or set below for a non-secret public value. Replace with the real OA URL before going live.
HUG_ZALO_OA_URL = "https://zalo.me/YOUR_OA_ID"

[[d1_databases]]
binding = "DB"
database_name = "fgcare-webhook-db"
database_id = "082ef7e3-649d-4b85-8234-ff32fa1453d5"
