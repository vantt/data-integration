description: Known boundary violations, generated from the dbt manifest and the orchestration imports (check_boundaries.py --write-allowlist). Each needs a reason and a planned exit; check_boundaries.py
  fails on anything not listed here and on entries that no longer occur.
allow:
- rule: dbt-ref
  subject: fact_order_costs
  target: stg_shopee_order_revenue [pack:finance -> connector:shopee]
  reason: Finance cost ledger mixes in Shopee marketplace fees read straight from the shopee connector (shopee is not in finance's pack_connectors, kept strict on purpose). Exit - move fee legs to pack
    marketplace and read them from there.
- rule: dbt-ref
  subject: fact_order_costs
  target: stg_shopee_order_service_fees [pack:finance -> connector:shopee]
  reason: Finance cost ledger mixes in Shopee marketplace fees read straight from the shopee connector (shopee is not in finance's pack_connectors, kept strict on purpose). Exit - move fee legs to pack
    marketplace and read them from there.
- rule: dbt-ref
  subject: fact_order_economics
  target: int_shopee_order_fees [pack:finance -> pack:marketplace]
  reason: 'Pack -> pack (finance -> marketplace), declared: order economics takes Shopee fees from int_shopee_order_fees. Kept as ref(): pack -> pack edges are outside the pack switch (plan 261014-2225);
    turning the target pack off while this pack is on fails dbt parse (fail closed, docs/architecture/modules.md §8.1). Exit - move fee legs to pack marketplace and declare the pack dependency.'
- rule: dbt-ref
  subject: mart_customer_action_queue
  target: int_crm_party_tag_flags [pack:sales_playbook -> pack:crm]
  reason: 'Pack -> pack (sales_playbook -> crm), declared: the action queue reads CRM contact state and tag flags. Kept as ref(): pack -> pack edges are outside the pack switch (plan 261014-2225); turning
    the target pack off while this pack is on fails dbt parse (fail closed, docs/architecture/modules.md §8.1). Exit - a declared pack dependency list (sales_playbook needs crm).'
- rule: dbt-ref
  subject: mart_customer_action_queue
  target: stg_crm__last_contact [pack:sales_playbook -> pack:crm]
  reason: 'Pack -> pack (sales_playbook -> crm), declared: the action queue reads CRM contact state and tag flags. Kept as ref(): pack -> pack edges are outside the pack switch (plan 261014-2225); turning
    the target pack off while this pack is on fails dbt parse (fail closed, docs/architecture/modules.md §8.1). Exit - a declared pack dependency list (sales_playbook needs crm).'
