description: Known boundary violations, generated from the dbt manifest and the orchestration imports (check_boundaries.py --write-allowlist). Each needs a reason and a planned exit; check_boundaries.py
  fails on anything not listed here and on entries that no longer occur.
allow:
- rule: dbt-ref
  subject: fact_order_costs
  target: stg_shopee_order_revenue [pack:finance -> connector:shopee]
  reason: Finance cost ledger mixes in Shopee marketplace fees read straight from the shopee connector (shopee is not in finance's pack_connectors, kept strict on purpose). Exit - move fee legs to pack
    marketplace and read them from there.
- rule: dbt-ref
  subject: fact_order_costs
  target: stg_shopee_order_service_fees [pack:finance -> connector:shopee]
  reason: Finance cost ledger mixes in Shopee marketplace fees read straight from the shopee connector (shopee is not in finance's pack_connectors, kept strict on purpose). Exit - move fee legs to pack
    marketplace and read them from there.
- rule: dbt-ref
  subject: fact_order_economics
  target: int_shopee_order_fees [pack:finance -> pack:marketplace]
  reason: 'Pack -> pack (finance -> marketplace), declared: order economics takes Shopee fees from int_shopee_order_fees. Exit - move fee legs to pack marketplace; finance reads them via pack_ref(''marketplace'',
    ...) after Đợt 1.'
- rule: dbt-ref
  subject: mart_customer_action_queue
  target: int_crm_party_tag_flags [pack:sales_playbook -> pack:crm]
  reason: 'Pack -> pack (sales_playbook -> crm), declared: the action queue reads CRM contact state and tag flags. Exit - declare sales_playbook as depending on crm and read via pack_ref(''crm'', ...) after
    Đợt 1.'
