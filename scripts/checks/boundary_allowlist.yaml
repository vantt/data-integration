- rule: dbt-ref
  subject: mart_data_quality
  target: fact_us_shipment_economics [core -> tenant:fine_japan]
  reason: 'Tenant hook (core -> tenant fine_japan): mart_data_quality counts US shipment economics rows (us_share_pct). Not covered by tenant_ref (it reads a tenant model, not a seed). Exit - move the US
    share metric into tenants/fine_japan (changes a public table: S gate).'
- rule: dbt-ref
  subject: mart_hug_attribution
  target: fact_order_economics [pack:hug -> pack:finance]
  reason: 'Pack -> pack (hug -> finance), declared: HUG attribution reports the margin of attributed orders from fact_order_economics. Kept as ref(): pack -> pack edges are outside the pack switch (plan
    261014-2225); turning the target pack off while this pack is on fails dbt parse (fail closed, docs/architecture/modules.md §8.1). Exit - a declared pack dependency list (hug needs finance).'
