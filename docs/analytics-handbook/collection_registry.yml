# =============================================================================
# LOOKUP TABLE — Quick reference for agents
# =============================================================================
# | Audience                          | Collection Path                |
# |-----------------------------------|--------------------------------|
# | All (onboarding)                  | 📍 Start Here                  |
# | CEO / Board / Founders            | Executive                      |
# | CFO / Accounting / FP&A           | Finance                        |
# | Marketing Manager / CMO           | Marketing & Customers          |
# | Customer Success                  | Marketing & Customers          |
# | Store Manager                     | Operations > Daily Monitoring  |
# | Sales Ops Lead                    | Operations > Periodic Reviews  |
# | B2B Account Manager               | Operations > B2B Operations    |
# | Logistics Manager                 | Operations > Logistics         |
# | Data Engineering                  | Operations > Data Platform     |
# | Analyst (cross-segment research)  | Analytics                      |
# | US Operations / CrossBorder Ops   | Operations > US CrossBorder    |
#
# DECISION GUIDE — which collection?
#   "Strategic overview for leadership?"        → Executive
#   "Financial / cost / profitability?"         → Finance
#   "Channel/customer/marketing?"               → Marketing & Customers
#   "Daily action items? (retail)"              → Operations > Daily Monitoring
#   "Weekly/monthly retail ops review?"         → Operations > Periodic Reviews
#   "B2B / wholesale tracking?"                 → Operations > B2B Operations
#   "US CrossBorder / export arrangements?"     → Operations > US CrossBorder
#   "Logistics / shipping?"                     → Operations > Logistics
#   "Data pipeline health?"                     → Operations > Data Platform
#   "Cross-segment comparison / research?"      → Analytics
#   "Onboarding / user guide?"                  → 📍 Start Here
#
# If audience doesn't match → STOP, escalate to Data Team. Do NOT create ad-hoc collections.
#
# ARCHIVE POLICY (NEW 2026-05-27):
# When renaming a dashboard, declare aliases in blueprint frontmatter:
#   ---
#   title: New Name [All]
#   aliases:
#     - Old Name
#   ---
# Deploy script will auto-archive the old name on next deploy.
# See guides/archive_policy.md (TBD per phase-07).
# =============================================================================
