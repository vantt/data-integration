[runtime]
log_level = "INFO"

[destination.filesystem]
loader_file_format = "parquet"
layout = "{table_name}/ingest_method={ingest_method}/year={year}/month={month}/{file_id}.{ext}"
extra_placeholders = { "ingest_method" = "batch_sync", "year" = "_default", "month" = "_default" }
# bucket_url = "file:///d:/_1.FWG_PARA/1.Projects/dev/dataware_house/data-integration2/app_data/data_lake"

[sources.sapo]
domain = "fwg.mysapogo.com" # Default domain, override with Env Var if needed
request_delay = 2.0 # Wait 1 second between requests
headless = true
login_url = "https://accounts.sapo.vn/login?domain=fwg" # cấu hình nếu muốn Overview

[sources.sapo.login_selectors]
# Sapo redesigned accounts.sapo.vn/login (2026-07) — old #pos-login-form wrapper is gone.
# Current markup: <input id="phoneNumber">, <input id="password">, <button type="submit"> (no id/stable class).
username = "#phoneNumber"
password = "#password"
submit = "button[type='submit']"

[sources.sapo_webhook_source]
worker_url = "https://webhook-receiver.admin-1d2.workers.dev/"

# Sheet URLs are NOT read from here — each gsheet_*.py reader resolves its URL from
# SOURCES__SPREADSHEET_URL__<NAME> env var (see .env.docker/.env.local), with a hardcoded
# fallback default in the script itself. This section previously tracked real sheet IDs
# in git; removed as part of plans/260707-1201-google-sheets-service-account phase-02.

[sources.facebook_ads]
access_token = "REPLACE_ME_OR_SET_ENV_VAR" # Required if not in environment
account_id = "REPLACE_ME" # Used if running single account mode

[sources.facebook_messenger]
page_access_token = "REPLACE_ME_OR_SET_ENV_VAR" # Required if not in environment

[sources.shopee]
input_dir = "app_data/input_source/shopee"
file_pattern = "Income.*.xlsx"

[sources.misa_amis]
input_dir = "app_data/input_source/misa-amis"
file_pattern = "So_chi_tiet_ban_hang_*.xlsx"
