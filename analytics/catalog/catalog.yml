# Catalog report chuẩn. Mỗi report: ô chức năng × nhịp (cell), engine, khu vực quyền (area), spec.
# `metrics` phải bằng hợp metric_ref của spec và `cost_sensitive` phải khớp chỉ tiêu (validator kiểm).
catalog_version: 1
reports:
  - id: ceo_weekly_pulse
    title: CEO Weekly Pulse
    cell: [EXE-W]
    primary_cell: EXE-W
    engine: evidence
    area: dieu-hanh
    question: Doanh thu tuần này đang đi nhanh hay chậm so với tuần trước và mục tiêu tháng; kênh, khách hàng và lợi nhuận có tín hiệu gì cần xử lý?
    metrics: [active_orders_count, aov, cancelled_orders, channel_net_profit, discount_rate, gmv_month_end_forecast,
              gmv_pace_index, gmv_required_daily_run_rate, gross_margin_pct, gross_revenue, net_sales, new_customer_orders,
              new_customers, orders_count, return_count, returning_customer_orders, returning_customers,
              returning_revenue_share]
    kpi_tiles: [net_sales_wow, gmv_pace_index, aov_wow, new_customers_wow, channel_net_profit_wow, gross_margin_wow]
    spec: specs/ceo_weekly_pulse.yml
