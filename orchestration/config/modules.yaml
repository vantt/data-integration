# Modules loaded by orchestration/definitions.py (loaders: orchestration/module_registry.py).
# Restart the Dagster code server after changing this file.
#
# connectors: one package per data source under orchestration/connectors/<id>/, in this
# order (the order is the row order of the morning digest). Remove an id to drop that
# connector's assets, jobs, schedules, sensors, asset checks and digest rows; nothing else
# needs editing.
# facebook_ads / facebook_messenger: ingestion scripts exist but there is no Dagster
# asset yet (dormant) — add a package under orchestration/connectors/ and list it here
# once there is one.
connectors:
  - sapo_v2
  - shopee
  - misa_amis
  - sheets
  - hug

# packs: reusable product logic under orchestration/packs/<id>/ (dbt side:
# transformation/models/packs/<id>/). Packs without Dagster code (hug, finance, marketplace,
# facebook_*) export empty lists. This list must equal `vars.enabled_packs` and the default list
# of every `+enabled` under `models: sapo_warehouse: packs:` in transformation/dbt_project.yml
# (check_boundaries.py rule `module-config` fails and prints the block to paste). A pack missing
# here is not built by dbt and its Dagster package is not loaded: core reads packs only through
# pack_ref, and connector jobs run the packs' AFTER_SERVING_ASSETS (crm: crm_cache_refresh)
# through job_support.after_serving_selection() (docs/architecture/modules.md §4, §8.1). A pack
# that another enabled pack depends on (sales_playbook -> crm, hug -> finance,
# finance -> marketplace) must stay enabled with it.
packs:
  - crm
  - hug
  - finance
  - sales_playbook
  - marketplace
  - facebook_ads
  - facebook_messenger

# tenants: the business this deployment runs for. Its configuration
# (orchestration/tenants/<id>/config.py) is read through orchestration.tenants.setting().
tenants:
  - fine_japan
