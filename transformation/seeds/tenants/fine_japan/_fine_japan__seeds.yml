version: 2

seeds:
  - name: seed_action_scenario_registry
    description: >
      Enable/disable switch for action_type output, per (action_type, mart) — lets
      a scenario be toggled off at the output layer without an SQL branching change.
      Missing registry row defaults to enabled (COALESCE(reg.enabled, TRUE) = TRUE)
      so a mart-name typo or unregistered action_type never silently drops existing
      output. `enabled` is explicitly typed boolean in dbt_project.yml (DuckDB seed
      inference otherwise loads it as VARCHAR, breaking the COALESCE comparison).
      Consumed by mart_customer_sku_action_queue and mart_customer_action_queue.
    columns:
      - name: action_type
        data_type: varchar
        tests: [not_null]
      - name: mart
        data_type: varchar
        description: "Consuming mart name — 'mart_customer_sku_action_queue' or 'mart_customer_action_queue'."
        tests: [not_null]
      - name: enabled
        data_type: boolean
        tests: [not_null]
      - name: scenario_group
        data_type: varchar
      - name: description_vi
        data_type: varchar
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [action_type, mart]

  - name: taxonomy_label
    description: >
      Fine Japan's anchoring of its labels to canonical codes (preview, not final): one row per
      (domain, label) with label_std, a code of taxonomy_canonical for the domain. Overrides the core
      default taxonomy_label__default; core reads it through tenant_ref('taxonomy_label') in the
      lbl_<domain> models. Interim anchors decided by the user 14/10/2026 are noted in `note`.
    columns:
      - name: domain
        data_type: varchar
        tests: [not_null]
      - name: label
        data_type: varchar
        tests: [not_null]
      - name: label_std
        data_type: varchar
        tests: [not_null]
      - name: note
        data_type: varchar
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [domain, label]
