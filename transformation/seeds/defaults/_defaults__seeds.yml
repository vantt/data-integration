version: 2

# Core defaults of the tenant seeds core reads through tenant_ref (macros/tenants/tenant_ref.sql).
# Header only (0 rows); types in dbt_project.yml `seeds: sapo_warehouse: defaults:`. A tenant
# overrides each with seeds/tenants/<tenant>/<seed>.csv (same columns, same order). README.md.
seeds:
  - name: seed_channel_targets__default
    description: >
      Core default (empty) of the tenant seed seed_channel_targets: monthly targets per sales
      channel and metric. Read by dim_channel_targets through tenant_ref; with no tenant the
      dimension is empty.
    columns:
      - name: channel_name
        data_type: varchar
        description: "Sales channel name (dim_channels.channel_name)."
      - name: period_month
        data_type: date
        description: "Month-start date of the target period."
      - name: metric_type
        data_type: varchar
        description: "NET_REVENUE (VND), NET_MARGIN_PCT (%) or ORDER_COUNT."
      - name: target_value
        data_type: double
        description: "Target value in the unit of metric_type."
      - name: target_source
        data_type: varchar
        description: "Where the target comes from (e.g. budget sheet)."
      - name: notes
        data_type: varchar
        description: "Free text."

  - name: seed_sku_regimen_config__default
    description: >
      Core default (empty) of the tenant seed seed_sku_regimen_config: supply/reminder settings per
      consumable SKU. Read by int_customer_sku_supply_tracking through tenant_ref; with no tenant no
      SKU is tracked.
    columns:
      - name: sku
        data_type: varchar
        description: "Sapo SKU."
      - name: product_group
        data_type: varchar
        description: "Product group of the SKU."
      - name: display_name
        data_type: varchar
        description: "Name shown in reminders."
      - name: supply_days_per_unit
        data_type: integer
        description: "Days one unit lasts at the standard dose."
      - name: dose_reduction_buffer
        data_type: double
        description: "Multiplier on supply days (> 1: customers use slower than standard)."
      - name: remind_lead_days
        data_type: integer
        description: "Days before estimated depletion to remind the customer."
      - name: journey_enabled
        data_type: boolean
        description: "Whether the reminder journey runs for this SKU."

  - name: seed_sku_alias_manual__default
    description: >
      Core default (empty) of the tenant seed seed_sku_alias_manual: manual Sapo pack SKU -> base
      SKU / MISA aliases. Read by dim_sku_alias through tenant_ref; with no tenant only automatic
      aliases remain.
    columns:
      - name: sapo_pack_sku
        data_type: varchar
        description: "Sapo SKU of the pack variant."
      - name: sapo_pack_unit
        data_type: varchar
        description: "Unit of the pack variant."
      - name: sapo_base_sku
        data_type: varchar
        description: "Sapo SKU of the base product."
      - name: sapo_base_unit
        data_type: varchar
        description: "Unit of the base product."
      - name: units_per_pack
        data_type: integer
        description: "Base units in one pack."
      - name: misa_join_key
        data_type: varchar
        description: "MISA product code used for COGS lookup."
      - name: misa_qty_multiplier
        data_type: integer
        description: "MISA units per Sapo unit (1 when MISA records in the pack unit)."
      - name: notes
        data_type: varchar
        description: "Free text."

  - name: taxonomy_label__default
    description: >
      Core default (empty) of the tenant seed taxonomy_label: label -> canonical code per domain.
      Read by the lbl_<domain> models through tenant_ref; with no tenant every label is UNMAPPED.
    columns:
      - name: domain
        data_type: varchar
        description: "Taxonomy domain (taxonomy_canonical.domain)."
      - name: label
        data_type: varchar
        description: "Label as produced by the core model."
      - name: label_std
        data_type: varchar
        description: "Canonical code (taxonomy_canonical.code of the domain)."
      - name: note
        data_type: varchar
        description: "Why this anchor."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [domain, label]

  - name: taxonomy_rule_tenant__default
    description: >
      Core default (empty) of the tenant seed taxonomy_rule_tenant: classification rules of the
      tenant layer. Read through tenant_ref by the lbl_<domain> models of the classification engine;
      with no tenant only the product layer taxonomy_rule_product applies.
    columns:
      - name: rule_id
        data_type: varchar
        description: "Rule key, unique within the layer. Several rows with the same rule_id are conditions joined by AND; domain, priority, label and enabled must be equal across them."
      - name: domain
        data_type: varchar
        description: "Domain declared in vars.taxonomy.domains (dbt_project.yml)."
      - name: priority
        data_type: integer
        description: "Lower is evaluated first, within the layer."
      - name: label
        data_type: varchar
        description: "Tenant label, declared in taxonomy_label for the domain's label_set. Empty only on a row that disables a rule of another layer."
      - name: feature
        data_type: varchar
        description: "Feature column declared for the domain. Empty = unconditional rule (always true, used as the default)."
      - name: op
        data_type: varchar
        description: "like, eq, in, not_in, between, starts_with, contains, regex, is_null, has."
      - name: value
        data_type: varchar
        description: "Operand, cast to the feature type; in/not_in split on '|'; is_null takes empty (IS NULL) or false (IS NOT NULL)."
      - name: value_to
        data_type: varchar
        description: "Upper bound of between, exclusive: [value, value_to); an empty bound is open."
      - name: enabled
        data_type: boolean
        description: "false disables the rule with this rule_id in every layer (how the tenant layer turns off an inherited rule)."
      - name: note
        data_type: varchar
        description: "Free text for readers, not used in evaluation."
