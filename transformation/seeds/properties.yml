version: 2

seeds:
  - name: ref_order_sources
    config:
      column_types:
        id: varchar
        name: varchar
        status: boolean
        channel_format: varchar
        is_generic_source: boolean
        platform: varchar
        mapping_tag: varchar
        channel_brand: varchar
        market: varchar
        source_type: varchar

  - name: ref_brands
    config:
      column_types:
        vendor_raw: varchar
        brand_name: varchar
        brand_code: varchar

  - name: ref_tag_categories
    description: "Tag pattern to category mapping for order tag classification"
    config:
      column_types:
        pattern: varchar
        category: varchar
        match_type: varchar
        priority: integer
        description: varchar

  - name: seed_sku_alias_manual
    description: >
      Manual overrides for MISA↔Sapo SKU mismatches where MISA uses a different
      code than the Sapo base SKU (e.g. Metabo: MISA=VCSP20002G001 Gói vs
      Sapo=VCSP20002H030 Hộp). Consumed by dim_sku_alias alongside AUTO_PACKSIZE rows.
    config:
      column_types:
        sapo_pack_sku: varchar
        sapo_pack_unit: varchar
        sapo_base_sku: varchar
        sapo_base_unit: varchar
        units_per_pack: integer
        misa_join_key: varchar
        misa_qty_multiplier: integer
        notes: varchar

  - name: seed_sku_regimen_config
    description: >
      Per-SKU supply regimen config for the customer SKU action queue.
      supply_days_per_unit: days 1 unit lasts at standard dose.
      dose_reduction_buffer: multiplier from calibrated repurchase data (>1 = customers use slower than standard).
      Buffer = 1.0 is a safe default when data is insufficient.
    config:
      column_types:
        sku: varchar
        product_group: varchar
        display_name: varchar
        supply_days_per_unit: integer
        dose_reduction_buffer: double
        remind_lead_days: integer
        journey_enabled: boolean

  - name: ref_gl_accounts
    description: >
      MISA chart-of-accounts name enrichment (TT200). One row per account_code →
      Vietnamese account_name. Optional lookup consumed by dim_gl_account; accounts
      absent here fall back to their code. Add codes as new accounts appear in the ledger.
    config:
      column_types:
        account_code: varchar
        account_name: varchar

  - name: seed_channel_targets
    description: >
      Raw CSV seed: channel-level budget targets maintained manually. One row per
      (channel_name, period_month, metric_type, target_source). Consumed by
      dim_channel_targets.sql which resolves channel_key via join to dim_channels.
    config:
      column_types:
        channel_name: varchar
        period_month: date
        metric_type: varchar
        target_value: double
        target_source: varchar
        notes: varchar

  - name: seed_cashflow_budget
    description: >
      Monthly cash budget: planned flows per cashflow_line × period_month × direction.
      Generated from Google Sheet tab BUDGET_ITEMS. Join key to actuals (recurring rows):
      account_code (prefix-match against fact_cash_movement.offset_account, supports both
      parent-rollup and child-level budgeting) + period_month + direction — see
      plans/260709-1415-budget-account-level-remap/. account_code is nullable: empty for
      item_type=one_off/reserve (plan-side only, never matched to MISA) and, during the
      migration window, for any recurring row not yet re-entered via the account-code
      dropdown (falls back to the legacy cashflow_line exact-match join).
      Refresh: dbt seed --select seed_cashflow_budget && dbt build --select fact_cashflow_budget+
    config:
      column_types:
        cashflow_line: varchar
        period_month: date
        direction: varchar
        planned_amount: double
        payment_week: varchar
        item_type: varchar
        item_label: varchar
        item_target: double
        target_month: date
        notes: varchar
        account_code: varchar

  - name: seed_cash_allocation_policy
    description: >
      Waterfall allocation policy config. Append-only: close old rows with effective_to,
      add new rows. Grain: (priority, bucket) per effective period.
      Constraint: rule_type='remainder' must be highest priority number (last in waterfall).
    config:
      column_types:
        priority: integer
        bucket: varchar
        rule_type: varchar
        value: double
        effective_from: date
        effective_to: date
        notes: varchar

  - name: taxonomy_canonical
    description: >
      Canonical label codes per taxonomy domain (product-owned, preview, not final): code,
      optional parent_code in the same domain, names. Every domain has the reserved codes UNMAPPED,
      UNKNOWN, NOT_APPLICABLE and OTHER (is_reserved = true). Labels are anchored to these codes by
      the tenant's taxonomy_label; read by the lbl_<domain> models' tests.
    columns:
      - name: domain
        data_type: varchar
        tests: [not_null]
      - name: code
        data_type: varchar
        tests: [not_null]
      - name: parent_code
        data_type: varchar
        description: "Parent code in the same domain (NULL for a root); checked by assert_taxonomy_canonical_parent_exists."
      - name: name_vi
        data_type: varchar
      - name: name_en
        data_type: varchar
      - name: is_reserved
        data_type: boolean
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [domain, code]

  - name: taxonomy_rule_product
    description: >
      Classification rules, product default layer (product-owned): one row per condition of a
      rule of a domain declared in vars.taxonomy. The tenant layer taxonomy_rule_tenant is evaluated
      first. Validated before load by scripts/checks/check_taxonomy_rules.py (the hard check; the not_null tests here only warn). Schema: docs/architecture/taxonomy-engine.md "Hiện thực MVP".
    columns:
      - name: rule_id
        data_type: varchar
        description: "Rule key, unique within the layer. Several rows with the same rule_id are conditions joined by AND; domain, priority, label and enabled must be equal across them."
        tests:
          - not_null:
              config:
                severity: warn
      - name: domain
        data_type: varchar
        description: "Domain declared in vars.taxonomy.domains (dbt_project.yml)."
        tests:
          - not_null:
              config:
                severity: warn
      - name: priority
        data_type: integer
        description: "Lower is evaluated first, within the layer."
      - name: label
        data_type: varchar
        description: "Tenant label, declared in taxonomy_label for the domain's label_set. Empty only on a row that disables a rule of another layer."
        tests:
          - not_null:
              config:
                severity: warn
                where: "enabled or feature is not null"
      - name: feature
        data_type: varchar
        description: "Feature column declared for the domain. Empty = unconditional rule (always true, used as the default)."
      - name: op
        data_type: varchar
        description: "like, eq, in, not_in, between, starts_with, contains, regex, is_null, has."
      - name: value
        data_type: varchar
        description: "Operand, cast to the feature type; in/not_in split on '|'; is_null takes empty (IS NULL) or false (IS NOT NULL)."
      - name: value_to
        data_type: varchar
        description: "Upper bound of between, exclusive: [value, value_to); an empty bound is open."
      - name: enabled
        data_type: boolean
        description: "false disables the rule with this rule_id in every layer (how the tenant layer turns off an inherited rule)."
      - name: note
        data_type: varchar
        description: "Free text for readers, not used in evaluation."
