version: 2

seeds:
  - name: ref_order_sources
    config:
      column_types:
        id: varchar
        name: varchar
        status: boolean
        channel_format: varchar
        is_generic_source: boolean
        platform: varchar
        mapping_tag: varchar
        channel_brand: varchar
        market: varchar
        source_type: varchar

  - name: ref_brands
    config:
      column_types:
        vendor_raw: varchar
        brand_name: varchar
        brand_code: varchar

  - name: ref_tag_categories
    description: "Tag pattern to category mapping for order tag classification"
    config:
      column_types:
        pattern: varchar
        category: varchar
        match_type: varchar
        priority: integer
        description: varchar

  - name: seed_sku_alias_manual
    description: >
      Manual overrides for MISA↔Sapo SKU mismatches where MISA uses a different
      code than the Sapo base SKU (e.g. Metabo: MISA=VCSP20002G001 Gói vs
      Sapo=VCSP20002H030 Hộp). Consumed by dim_sku_alias alongside AUTO_PACKSIZE rows.
    config:
      column_types:
        sapo_pack_sku: varchar
        sapo_pack_unit: varchar
        sapo_base_sku: varchar
        sapo_base_unit: varchar
        units_per_pack: integer
        misa_join_key: varchar
        misa_qty_multiplier: integer
        notes: varchar

  - name: seed_sku_regimen_config
    description: >
      Per-SKU supply regimen config for the customer SKU action queue.
      supply_days_per_unit: days 1 unit lasts at standard dose.
      dose_reduction_buffer: multiplier from calibrated repurchase data (>1 = customers use slower than standard).
      Buffer = 1.0 is a safe default when data is insufficient.
    config:
      column_types:
        sku: varchar
        product_group: varchar
        display_name: varchar
        supply_days_per_unit: integer
        dose_reduction_buffer: double
        remind_lead_days: integer
        journey_enabled: boolean

  - name: ref_gl_accounts
    description: >
      MISA chart-of-accounts name enrichment (TT200). One row per account_code →
      Vietnamese account_name. Optional lookup consumed by dim_gl_account; accounts
      absent here fall back to their code. Add codes as new accounts appear in the ledger.
    config:
      column_types:
        account_code: varchar
        account_name: varchar

  - name: seed_channel_targets
    description: >
      Raw CSV seed: channel-level budget targets maintained manually. One row per
      (channel_name, period_month, metric_type, target_source). Consumed by
      dim_channel_targets.sql which resolves channel_key via join to dim_channels.
    config:
      column_types:
        channel_name: varchar
        period_month: date
        metric_type: varchar
        target_value: double
        target_source: varchar
        notes: varchar
