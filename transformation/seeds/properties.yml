version: 2

seeds:
  - name: ref_order_sources
    config:
      column_types:
        id: varchar
        name: varchar
        status: boolean
        channel_format: varchar
        is_generic_source: boolean
        platform: varchar
        mapping_tag: varchar
        channel_brand: varchar
        market: varchar
        customer_segment: varchar

  - name: ref_brands
    config:
      column_types:
        vendor_raw: varchar
        brand_name: varchar
        brand_code: varchar

  - name: ref_tag_categories
    description: "Tag pattern to category mapping for order tag classification"
    config:
      column_types:
        pattern: varchar
        category: varchar
        match_type: varchar
        priority: integer
        description: varchar
