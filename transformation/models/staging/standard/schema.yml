version: 2

models:
  - name: std_orders
    description: "Standardized Order entity v2.0."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: source_version
        description: "Source API version that produced this record ('v2' for Sapo v2; 'v3' when v3 union is added)."
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['OPEN', 'COMPLETED', 'CANCELLED', 'ARCHIVED', 'DRAFT']
      - name: payment_status
        tests:
          - accepted_values:
              arguments:
                values: ['PAID', 'PENDING', 'PARTIALLY_PAID', 'REFUNDED', 'VOIDED', 'UNPAID']
      - name: fulfillment_status
        tests:
          - accepted_values:
              arguments:
                values: ['FULFILLED', 'UNFULFILLED', 'PARTIALLY_FULFILLED', 'RETURNED', 'SHIPPING', 'CANCELLED', 'COMPLETED', 'SHIPPED_PAID', 'SHIPPED_COD', 'PAID_PROCESSING', 'IN_PROGRESS']
      - name: discount_codes
        description: "List of discount codes applied (JSON)"
      - name: client_info
        description: "Browser IP and User Agent details (JSON)"
      - name: tags
        description: "Order tags"
      - name: seller_user_id
        description: "Sapo `assignee_id` — người được giao đơn. Primary field for sales attribution (team, commission, KPI). NULL for orders without explicit assignee."
      - name: seller_name
        description: "Tên nhân viên seller (từ Sapo assignee.full_name / assignee.name)."
      - name: seller_email
        description: "Email seller."
      - name: creator_user_id
        description: "Sapo `account_id` — người tạo đơn trên Sapo. Operational field; use only as fallback when seller_user_id is NULL or is a system account."
      - name: creator_name
        description: "Tên nhân viên creator (từ Sapo account.full_name / account.name / user_name)."
      - name: creator_email
        description: "Email creator."

  - name: std_order_items
    description: "Line items v2.0"
    columns:
      - name: order_line_id
        tests: [unique, not_null]
      - name: source_version
        description: "Source API version that produced this record ('v2' for Sapo v2; 'v3' when v3 union is added)."
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('std_orders')
                field: order_id
      - name: line_amount
        description: "Total line item amount (quantity * price - discount)"
      - name: discount_amount
        description: "Discount amount allocated to this line item"
      - name: distributed_discount_amount
        description: "Distributed discount amount"
      - name: lots_dates
        description: "Lot number and expiry date details (JSON)"

  - name: std_customers
    description: "Standardized Customers."
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: source_version
        description: "Source API version that produced this record ('v2' for Sapo v2; 'v3' when v3 union is added)."
      - name: birth_date
        description: "Date of Birth"
      - name: gender
        description: "Gender of the customer"
      - name: customer_group
        description: "Customer Group Code/Name"
      - name: loyalty_points
        description: "Loyalty points balance"
      - name: total_spend
        description: "Total amount the customer has spent (source $.total_expense; renamed from total_expense — customer spend, not a business expense)"

  - name: std_fulfillments
    description: "Standardized Fulfillments (Shipments)."
    columns:
      - name: fulfillment_id
        tests: [unique, not_null]
      - name: source_version
        description: "Source API version that produced this record ('v2' for Sapo v2; 'v3' when v3 union is added)."
      - name: order_id
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['DELIVERED', 'SHIPPING', 'PACKED', 'CANCELLED', 'FAILED', 'PENDING']

  - name: std_accounts
    description: "Standardized Accounts (Staff/Salesperson)."
    columns:
      - name: account_id
        tests: [unique, not_null]
      - name: source_version
        description: "Source API version that produced this record ('v2' for Sapo v2; 'v3' when v3 union is added)."

  - name: std_payments
    description: "Standardized Payments (Transactions)."
    columns:
      - name: payment_id
        tests: [unique, not_null]
      - name: source_version
        description: "Source API version that produced this record ('v2' for Sapo v2; 'v3' when v3 union is added)."
      - name: order_id
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['SUCCESS', 'PENDING', 'FAILED', 'REFUNDED']

  - name: std_order_discount_items
    description: "Standardized order discount items. Grain: 1/(order_id × discount_source × reason)."
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_code
        tests: [not_null]

  - name: std_order_returns
    description: "Standardized order returns. Grain: 1/return_id."
    columns:
      - name: return_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]

  - name: std_variants
    description: "Standardized variant catalog. Grain: 1/variant_id. Thin pass-through over stg_sapo_variants; preserves all JSON columns (inventories_json, variant_prices_json, composite_items_json) for downstream unnesting."
    columns:
      - name: variant_id
        tests: [unique, not_null]

  - name: std_products
    description: "Standardized product catalog. Grain: 1/product_id. Thin pass-through over stg_sapo_products."
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: std_variant_prices
    description: "Standardized variant prices. Grain: 1/(variant_id × price_list_id). Thin pass-through over stg_sapo_variant_prices."
    columns:
      - name: variant_id
        tests: [not_null]
      - name: price_list_id
        tests: [not_null]

  - name: std_misa_account_ledger
    description: >
      Monthly rollup of MISA overhead account-ledger lines. Grain: 1 row per (account, period_month).
      Overhead pool source for 6421/6422; 642-promo and traceable accounts dropped later via
      classification gsheet (phase-04). net_cost = debit − credit_excl_911 per design §5.
    columns:
      - name: account
        description: "Leaf account code (e.g. 64211, 64214, 6422). Natural key dimension."
        tests: [not_null]
      - name: account_group
        description: "Top-level group derived from account prefix: '6421' or '6422'."
        tests: [not_null]
      - name: period_month
        description: "First day of the calendar month (DATE_TRUNC month of posting_date). Natural key dimension."
        tests: [not_null]
      - name: debit
        description: "SUM(Nợ) — total overhead expense incurred in the period."
      - name: credit_excl_911
        description: "SUM(Có) excluding offset_account='911' (kết chuyển cuối kỳ). Genuine cost reversals only."
      - name: net_cost
        description: "Net overhead cost = debit − credit_excl_911. Primary consumption column for phase-04 pool allocation."
      - name: line_count
        description: "Count of raw journal lines contributing to this rollup. Used for audit and anomaly detection."
      - name: source_system
        description: "'misa' literal."
      - name: source_version
        description: "Report-format version tag; bump when parser or report structure changes."

  - name: std_misa_sales_lines
    description: "Faithful MISA sales-line std-gate. Grain: 1/(voucher_no, line_no). cogs_amount and gross_profit are mixed 632+642 totals, unfiltered — downstream int/fact apply the 632-only filter."
    columns:
      - name: voucher_no
        tests: [not_null]
      - name: line_no
        tests: [not_null]
      - name: cogs_account
        description: "Raw MISA account; values incl 632, 632.1, 632.3, 642, 642.14 — NOT filtered here."
      - name: cost_account_group
        description: "Derived bucket: '632'=COGS goods sold, '642'=promo/giveaway goods cost, else 'other'."
      - name: source_system
        description: "'misa' literal."
      - name: source_version
        description: "MISA report-format version tag; bump when parser/report changes."

  - name: std_inventory_movements
    tags: [hourly]
    description: >
      Standardized inventory movement ledger. Grain: 1 row per inventory_movement_id
      (= entity_id content hash). Source: src_sapo_v2_inventory_transactions (v2).
      quantity_delta = import_quantity − export_quantity (+IN / −OUT).
      movement_direction derived from import_quantity>0 (NOT action field — stock_transfer
      fires 'received' at both ends; direction from import_quantity>0 is unambiguous).
      cogs_amount = export_amount (pre-txn MAC). inventory_value = amount (= onhand × mac).
      onhand is authoritative — never recomputed. total_mac dropped (always 0 in source).
    columns:
      - name: inventory_movement_id
        tests: [unique, not_null]
      - name: movement_direction
        tests:
          - accepted_values:
              arguments:
                values: ['IN', 'OUT', 'ZERO']
      - name: variant_id
        tests: [not_null]
      - name: location_id
        tests: [not_null]
      - name: source_version
        description: "Source API version that produced this record ('v2' for Sapo v2)."
