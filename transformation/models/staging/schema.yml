version: 2

models:
  - name: stg_us_shipment_prices
    description: "US Shipment Price List — one row per (SKU, effective_from). Source of actual deal prices for US CrossBorder orders."
    columns:
      - name: price_key
        tests: [unique, not_null]
      - name: sku
        tests: [not_null]
      - name: us_price_excl_vat
        tests: [not_null]
      - name: effective_from
        tests: [not_null]

  - name: stg_sapo_orders
    columns:
      - name: order_id
        tests: [not_null]

  - name: stg_sapo_order_items
    columns:
      - name: item_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]

  - name: stg_sapo_payments
    columns:
      - name: payment_id
        tests: [not_null]
      - name: amount
        tests: [not_null]

  - name: stg_sapo_fulfillments
    columns:
      - name: fulfillment_id
        tests: [not_null]

  - name: stg_sapo_order_returns
    columns:
      - name: return_id
        tests: [unique, not_null]

  - name: stg_sapo_customers
    columns:
      - name: sapo_customer_id
        tests: [not_null]

  - name: stg_sapo_products
    columns:
      - name: product_id
        tests: [not_null]

  - name: stg_sapo_variants
    columns:
      - name: variant_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]

  - name: stg_sapo_variant_prices
    columns:
      - name: variant_id
        tests: [not_null]
      - name: price_list_id
        tests: [not_null]

  - name: stg_sapo_inventories
    columns:
      - name: variant_id
        tests: [not_null]
      - name: location_id
        tests: [not_null]

  - name: src_misa_sales_lines
    columns:
      - name: voucher_no
        tests: [not_null]
      - name: line_no
        tests: [not_null]
      - name: posting_date
        tests: [not_null]

  - name: stg_misa_sales_lines
    columns:
      - name: voucher_no
        tests: [not_null]
      - name: line_no
        tests: [not_null]
      - name: posting_date
        tests: [not_null]
      - name: cogs_amount
        tests: [not_null]

  - name: stg_sapo_order_discount_items
    description: "Unnested discount_items array from raw Sapo orders. Grain: 1 row per discount item per order. B2B wholesale-price-gap rows excluded."
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_code
        tests: [not_null]
      - name: amount
        description: "Discount amount (always positive, B2B rate=100/empty-reason rows filtered out)"
      - name: reason
        description: "Raw reason string from Sapo payload — used for cost_type classification in fact_order_costs"
