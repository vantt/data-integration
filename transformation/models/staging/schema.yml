version: 2

models:
  - name: stg_us_shipment_prices
    description: "US Shipment Price List — one row per (SKU, effective_from). Source of actual deal prices for US CrossBorder orders."
    columns:
      - name: price_key
        tests: [unique, not_null]
      - name: sku
        tests: [not_null]
      - name: us_price_excl_vat
        tests: [not_null]
      - name: effective_from
        tests: [not_null]

  - name: stg_overhead_account_classification
    description: >
      Overhead Account Classification — one row per MISA leaf sub-account. Defines
      how each 6421/6422 account is treated in the P&L: pooled allocation (keep_*)
      or excluded (drop_*). Source: Google Sheet snapshot, loaded nightly.
    columns:
      - name: account
        description: "MISA leaf sub-account code (VARCHAR — codes like 64211, never cast to int)"
        tests: [not_null]
      - name: treatment
        description: "P&L treatment for this account"
        tests:
          - not_null
          - accepted_values:
              values:
                - keep_admin
                - keep_handling
                - keep_marketing
                - keep_selling
                - drop_traceable
                - drop_promo_count_once
      - name: pool_id
        description: "Allocation pool identifier (required for keep_* rows)"
      - name: base_metric
        description: "Allocation base for keep_* rows: net_revenue | order_count | gross_profit"
      - name: effective_from
        description: "Date this classification takes effect (NULL = no start constraint)"
      - name: effective_to
        description: "Date this classification expires (NULL = open-ended / currently active)"

  - name: stg_sapo_v2_orders
    columns:
      - name: order_id
        tests: [not_null]

  - name: stg_sapo_v2_order_items
    columns:
      - name: item_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]

  - name: stg_sapo_v2_payments
    columns:
      - name: payment_id
        tests: [not_null]
      - name: amount
        tests: [not_null]

  - name: stg_sapo_v2_fulfillments
    columns:
      - name: fulfillment_id
        tests: [not_null]

  - name: stg_sapo_v2_order_returns
    columns:
      - name: return_id
        tests: [unique, not_null]

  - name: stg_sapo_v2_customers
    columns:
      - name: sapo_customer_id
        tests: [not_null]

  - name: stg_sapo_v2_products
    columns:
      - name: product_id
        tests: [not_null]

  - name: stg_sapo_v2_variants
    columns:
      - name: variant_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]

  - name: stg_sapo_v2_variant_prices
    columns:
      - name: variant_id
        tests: [not_null]
      - name: price_list_id
        tests: [not_null]

  - name: stg_sapo_v2_inventories
    columns:
      - name: variant_id
        tests: [not_null]
      - name: location_id
        tests: [not_null]

  - name: src_sapo_v2_inventory_transactions
    tags: [hourly]
    description: >
      Flattened inventory transactions from Sapo (batch_sync, content-addressed entity_id).
      Grain: 1 row per document × product line × content-state. onhand is a running stock
      balance at the moment of the transaction. import_amount/export_amount are stock-value
      movements (MAC-based). Business-grain dedup deferred to std layer.
    columns:
      - name: entity_id
        description: "Content hash of payload — unique per distinct payload snapshot. Primary key."
        tests: [unique, not_null]
      - name: issued_at_utc
        description: "Transaction timestamp (TIMESTAMPTZ, UTC). Authoritative business time."
        tests: [not_null]
      - name: log_root_id
        description: "Source document ID (order, purchase order, stock adjustment, etc.)."
      - name: trans_type_name
        description: "Human-readable transaction type (e.g., 'Bán hàng', 'Nhập hàng')."
      - name: variant_id
        description: "Sapo variant ID of the SKU involved in the transaction."
        tests: [not_null]
      - name: sku
        description: "SKU code of the variant."
      - name: onhand
        description: "Running stock balance (units) after this transaction at the given location."
      - name: export_quantity
        description: "Units leaving stock (positive = outflow). Null for import-only transactions."
      - name: import_quantity
        description: "Units entering stock (positive = inflow). Null for export-only transactions."
      - name: mac
        description: "Moving-average cost per unit at the time of this transaction."
      - name: location_id
        description: "Sapo warehouse/location ID."

  - name: src_misa_sales_lines
    columns:
      - name: voucher_no
        tests: [not_null]
      - name: line_no
        tests: [not_null]
      - name: posting_date
        tests: [not_null]

  - name: src_misa_account_ledger
    description: "Deduped MISA account-ledger journal lines. Grain: 1 row per journal entry (account, voucher_no, posting_date, offset_account, debit, credit). Source: misa_raw.account_ledger parquet."
    columns:
      - name: posting_date
        tests: [not_null]
      - name: account
        tests: [not_null]
      - name: account_group
        tests: [not_null]

  - name: stg_misa_sales_lines
    columns:
      - name: voucher_no
        tests: [not_null]
      - name: line_no
        tests: [not_null]
      - name: posting_date
        tests: [not_null]
      - name: cogs_amount
        tests: [not_null]

  - name: src_hug_scan
    description: >
      Deduped Hug scan events extracted from hug_raw/scan/ parquet.
      Grain: 1 row per token (latest event). entity_id = token (no numeric id).
    columns:
      - name: entity_id
        description: "Token value — primary key. Hug events are token-keyed, not id-keyed."
        tests: [unique, not_null]
      - name: token
        tests: [not_null]
      - name: event_timestamp
        tests: [not_null]

  - name: stg_hug_scan
    description: >
      Staging view for Hug scan events. Timestamps cast to TIMESTAMPTZ (UTC).
      One row per token (latest snapshot). Identity resolution happens downstream.
    columns:
      - name: scan_token
        description: "Token value (= entity_id from src_hug_scan). Primary key."
        tests: [unique, not_null]
      - name: token
        tests: [not_null]
      - name: scanned_at
        description: "Edge-recorded scan timestamp (TIMESTAMPTZ UTC). Null if edge clock unavailable."
      - name: ingested_at
        description: "Pipeline ingest timestamp (TIMESTAMPTZ UTC)."
        tests: [not_null]

  - name: src_hug_optin_event
    description: >
      Deduped Hug opt-in events extracted from hug_raw/optin_event/ parquet.
      Grain: 1 row per token (latest event). Nullable: phone, zalo_uid, name.
      Payload contract may evolve when landing page (L1-landing) is built.
    columns:
      - name: entity_id
        description: "Token value — primary key."
        tests: [unique, not_null]
      - name: token
        tests: [not_null]
      - name: event_timestamp
        tests: [not_null]

  - name: stg_hug_optin_event
    description: >
      Staging view for Hug opt-in events. Timestamps cast to TIMESTAMPTZ (UTC).
      One row per token (latest opt-in). Read by I2-resolve identity bridge.
    columns:
      - name: optin_token
        description: "Token value (= entity_id from src_hug_optin_event). Primary key."
        tests: [unique, not_null]
      - name: token
        tests: [not_null]
      - name: opted_in_at
        description: "Opt-in timestamp from landing page, or ingest time as fallback (TIMESTAMPTZ UTC)."
      - name: ingested_at
        description: "Pipeline ingest timestamp (TIMESTAMPTZ UTC)."
        tests: [not_null]

  - name: stg_sapo_v2_order_discount_items
    description: "Unnested discount_items array from raw Sapo orders. Grain: 1 row per discount item per order. B2B wholesale-price-gap rows excluded."
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_code
        tests: [not_null]
      - name: amount
        description: "Discount amount (always positive, B2B rate=100/empty-reason rows filtered out)"
      - name: reason
        description: "Raw reason string from Sapo payload — used for cost_type classification in fact_order_costs"
