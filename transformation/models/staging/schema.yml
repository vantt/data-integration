version: 2

models:
  - name: stg_sapo_orders
    columns:
      - name: order_id
        tests: [not_null]

  - name: stg_sapo_order_items
    columns:
      - name: item_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]

  - name: stg_sapo_payments
    columns:
      - name: payment_id
        tests: [not_null]
      - name: amount
        tests: [not_null]

  - name: stg_sapo_fulfillments
    columns:
      - name: fulfillment_id
        tests: [not_null]

  - name: stg_sapo_customers
    columns:
      - name: sapo_customer_id
        tests: [not_null]

  - name: stg_sapo_products
    columns:
      - name: product_id
        tests: [not_null]

  - name: stg_sapo_variants
    columns:
      - name: variant_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]

  - name: stg_sapo_variant_prices
    columns:
      - name: variant_id
        tests: [not_null]
      - name: price_list_id
        tests: [not_null]

  - name: stg_sapo_inventories
    columns:
      - name: variant_id
        tests: [not_null]
      - name: location_id
        tests: [not_null]
