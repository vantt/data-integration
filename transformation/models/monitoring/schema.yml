version: 2

models:
  - name: monitor_uncategorized_tags
    description: "Lists tags without category mapping for review. Add patterns to ref_tag_categories.csv."
    columns:
      - name: tag_value
        description: "Tag value needing categorization"
      - name: order_count
        description: "Number of orders with this tag"
      - name: sample_order_id
        description: "Example order ID for investigation"
      - name: suggestion
        description: "Auto-suggested category based on pattern"
      - name: checked_at
        description: "Timestamp of query"

  - name: mart_capabilities
    description: >
      What data this deployment has, one row per capability of seeds/capabilities/capability_catalog:
      declared by an enabled connector (var enabled_connectors, seed connector_capabilities), needed
      by core or an enabled pack (var enabled_packs), observed in the data (row count of a probe on a
      connector or cdm model). Table in the warehouse only, not on serving. Statuses and probes:
      transformation/seeds/capabilities/README.md.
    columns:
      - name: capability
        description: "Capability id (capability_catalog)."
        tests: [unique, not_null]
      - name: required_by
        description: "Modules that need it, comma-separated: `core` and/or pack ids."
      - name: declared_by
        description: "Enabled connectors that declare it, comma-separated; NULL when none."
      - name: is_declared
        description: "An enabled connector declares it."
      - name: is_pack_enabled
        description: "Core needs it, or a pack that needs it is in enabled_packs."
      - name: observed_rows
        description: "Rows of the probe relation (with its filter)."
      - name: last_observed_date
        description: "Latest date in the probe when it has a date column; NULL otherwise."
      - name: is_observed
        description: "observed_rows > 0."
      - name: status
        description: >
          OK (needed, declared, observed); DECLARED_NO_DATA (needed, declared, no rows);
          PACK_ON_NO_SOURCE (needed, no enabled connector declares it, whatever rows are left);
          DATA_NOT_DECLARED (not needed, not declared, rows present); NOT_NEEDED (otherwise).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['OK', 'DECLARED_NO_DATA', 'PACK_ON_NO_SOURCE', 'DATA_NOT_DECLARED', 'NOT_NEEDED']

  - name: entity_labels
    description: >
      Long table of every label of the classification engine: UNION ALL of the lbl_<domain> models
      of vars.taxonomy (selftest domains excluded), one row per subject, domain and label. For
      monitoring and explanation only; no core or pack model may read it (monitoring bucket,
      check_boundaries.py). docs/architecture/taxonomy-engine.md §4b.
    columns:
      - name: subject
        description: "Subject of the domain (customer)."
      - name: entity_id
        description: "Key of the subject, as varchar (customer_key)."
      - name: domain
        description: "Domain name, e.g. customer_type, customer_type__group_blob."
      - name: label
        description: "Tenant label, or UNMAPPED / UNKNOWN."
      - name: label_std
        description: "Canonical code (the <label>_std column of lbl_<domain>)."
      - name: rule_id
        description: "Rule that gave the label (NULL for UNMAPPED / UNKNOWN)."
      - name: source_layer
        description: "Layer of that rule: tenant or product."
      - name: ruleset_version
        description: "md5 of every rule row of the domain."

  - name: monitor_taxonomy_parity
    description: >
      Classification engine vs the legacy customer_type SQL, one row per customer and domain
      (customer_type: dim_customers logic and is_us_gift_recipient; customer_type__group_blob:
      fact_orders / int_customer_benchmarks logic). Holds verbatim copies of the legacy blocks
      (same sha256 in scripts/checks/taxonomy_inventory.yaml) so parity keeps being measured after
      the marts switch to the engine. docs/architecture/taxonomy-engine.md §4b.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "NOT is_diff"
          config:
            severity: warn
    columns:
      - name: domain
      - name: customer_key
      - name: engine_label
        description: "Label of lbl_<domain>."
      - name: legacy_label
        description: "Label of the verbatim copy of the legacy CASE."
      - name: engine_flag
        description: "lbl_customer_type.matched__crossborder (NULL for the blob domain)."
      - name: legacy_flag
        description: "Verbatim copy of dim_customers.is_us_gift_recipient (NULL for the blob domain)."
      - name: engine_rule_id
      - name: ruleset_version
      - name: is_label_diff
      - name: is_flag_diff
      - name: is_diff
        description: "Label or flag differs (IS DISTINCT FROM, so NULL vs FALSE counts)."
      - name: is_legacy_else
        description: "The legacy block fell into its ELSE (RETAIL)."
      - name: is_engine_default
        description: "The engine label came from an unconditional (default) rule."

  - name: monitor_taxonomy_parity_log
    description: >
      Append-only history of monitor_taxonomy_parity: one row per dbt run and domain with the
      counts below (full_refresh=false). Used to count consecutive nights without difference before
      the marts switch to the engine, and for 30 days after. Read one row per run_date and domain.
    columns:
      - name: run_at
      - name: run_date
        description: "Date of the run in Asia/Ho_Chi_Minh."
      - name: domain
      - name: ruleset_version
      - name: n_entities
      - name: n_label_diff
      - name: n_flag_diff
      - name: n_legacy_else
        description: "Customers the legacy block put in its ELSE (RETAIL)."
      - name: n_engine_default
        description: "Customers labelled by the engine's unconditional (default) rule."
      - name: n_unmapped
      - name: n_unknown

  - name: monitor_taxonomy_unmapped
    description: >
      For every classification engine domain with a survey: raw values of the survey features of
      the customers no specific rule classified (UNMAPPED, UNKNOWN, or the default rule), with
      customers, orders (int_customer_metrics.frequency) and revenue (monetary_value), sorted by
      revenue. The list to write new rules from.
    columns:
      - name: domain
      - name: label
      - name: reason
        description: "unmapped, unknown or default_rule."
      - name: raw_values
        description: "JSON object of the survey feature values."
      - name: n_entities
      - name: order_count
      - name: revenue
