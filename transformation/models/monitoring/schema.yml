version: 2

models:
  - name: monitor_uncategorized_tags
    description: "Lists tags without category mapping for review. Add patterns to ref_tag_categories.csv."
    columns:
      - name: tag_value
        description: "Tag value needing categorization"
      - name: order_count
        description: "Number of orders with this tag"
      - name: sample_order_id
        description: "Example order ID for investigation"
      - name: suggestion
        description: "Auto-suggested category based on pattern"
      - name: checked_at
        description: "Timestamp of query"

  - name: mart_capabilities
    description: >
      What data this deployment has, one row per capability of seeds/capabilities/capability_catalog:
      declared by an enabled connector (var enabled_connectors, seed connector_capabilities), needed
      by core or an enabled pack (var enabled_packs), observed in the data (row count of a probe on a
      connector or cdm model). Table in the warehouse only, not on serving. Statuses and probes:
      transformation/seeds/capabilities/README.md.
    columns:
      - name: capability
        description: "Capability id (capability_catalog)."
        tests: [unique, not_null]
      - name: required_by
        description: "Modules that need it, comma-separated: `core` and/or pack ids."
      - name: declared_by
        description: "Enabled connectors that declare it, comma-separated; NULL when none."
      - name: is_declared
        description: "An enabled connector declares it."
      - name: is_pack_enabled
        description: "Core needs it, or a pack that needs it is in enabled_packs."
      - name: observed_rows
        description: "Rows of the probe relation (with its filter)."
      - name: last_observed_date
        description: "Latest date in the probe when it has a date column; NULL otherwise."
      - name: is_observed
        description: "observed_rows > 0."
      - name: status
        description: >
          OK (needed, declared, observed); DECLARED_NO_DATA (needed, declared, no rows);
          PACK_ON_NO_SOURCE (needed, no enabled connector declares it, whatever rows are left);
          DATA_NOT_DECLARED (not needed, not declared, rows present); NOT_NEEDED (otherwise).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['OK', 'DECLARED_NO_DATA', 'PACK_ON_NO_SOURCE', 'DATA_NOT_DECLARED', 'NOT_NEEDED']

  - name: entity_labels
    description: >
      Long table of every label of the classification engine: UNION ALL of the lbl_<domain> models
      of vars.taxonomy (selftest domains excluded), one row per subject, domain and label. For
      monitoring and explanation only; no core or pack model may read it (monitoring bucket,
      check_boundaries.py). docs/architecture/taxonomy-engine.md §4b.
    columns:
      - name: subject
        description: "Subject of the domain (customer)."
      - name: entity_id
        description: "Key of the subject, as varchar (customer_key)."
      - name: domain
        description: "Domain name, e.g. customer_type, customer_type__group_blob."
      - name: label
        description: "Tenant label, or UNMAPPED / UNKNOWN."
      - name: label_std
        description: "Canonical code (the <label>_std column of lbl_<domain>)."
      - name: rule_id
        description: "Rule that gave the label (NULL for UNMAPPED / UNKNOWN)."
      - name: source_layer
        description: "Layer of that rule: tenant or product."
      - name: ruleset_version
        description: "md5 of every rule row of the domain."
