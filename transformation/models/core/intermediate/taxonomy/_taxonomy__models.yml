# Classification engine pilot: feature models of the customer_type domains and unit tests with the
# real Fine Japan rules (fixture tests/fixtures/taxonomy_rule_tenant_customer_type.csv is a
# byte copy of seeds/tenants/fine_japan/taxonomy_rule_tenant.csv, checked by
# scripts/tests/test_taxonomy_fixtures.py). Model tests of lbl_customer_type and
# lbl_customer_type__group_blob: models/core/marts/labels/_labels__models.yml.
# The lbl_* unit tests run only for tenant fine_japan: they mock the tenant seeds, which are not
# parents of the models when var tenant is empty (tenant_ref then reads the core defaults).
version: 2
models:
- name: feat_customer_profile
  description: 'Customer profile features of the classification engine: one row per customer of dim_customers_base
    (sentinel Unknown included), raw group values, not normalized.'
  columns:
  - name: customer_key
    tests:
    - unique
    - not_null
  - name: group_blob
    description: dim_customers_base.customer_group (raw JSON of the Sapo group).
  - name: group_code
    description: dim_customers_base.customer_group_code.
  - name: group_name
    description: dim_customers_base.customer_group_name.
- name: feat_customer_orders
  description: 'Order features of the classification engine: per customer with a non-cancelled order, the distinct
    channel names ordered on (fact_orders JOIN dim_channels, status != ''CANCELLED'').'
  columns:
  - name: customer_key
    tests:
    - unique
    - not_null
  - name: channels_ordered_on
    description: Sorted distinct dim_channels.channel_name; read as [] for a customer without row.
unit_tests:
- name: customer_type_underscore_is_a_wildcard
  description: '''_'' in %KY_GUI% is a LIKE wildcard: KY GUI and KYxGUI are PARTNER (real Fine Japan rules: tests/fixtures/taxonomy_rule_tenant_customer_type.csv).'
  model: lbl_customer_type
  config:
    enabled: '{{ var(''tenant'', '''') == ''fine_japan'' }}'
  given:
  - input: ref('feat_customer_profile')
    format: sql
    rows: |
      select CAST('c1' AS VARCHAR) as customer_key, CAST(NULL AS VARCHAR) as group_blob, CAST('KY GUI' AS VARCHAR) as group_code, CAST(NULL AS VARCHAR) as group_name
      union all
      select CAST('c2' AS VARCHAR) as customer_key, CAST(NULL AS VARCHAR) as group_blob, CAST(NULL AS VARCHAR) as group_code, CAST('KYxGUI' AS VARCHAR) as group_name
  - input: ref('feat_customer_orders')
    format: sql
    rows: |
      select cast(null as varchar) as customer_key, cast(null as varchar[]) as channels_ordered_on where false
  - input: ref('taxonomy_rule_tenant')
    format: csv
    fixture: taxonomy_rule_tenant_customer_type
  - input: ref('taxonomy_rule_product')
    format: sql
    rows: |
      select cast(null as varchar) as rule_id, cast(null as varchar) as domain, cast(null as integer) as priority, cast(null as varchar) as label, cast(null as varchar) as feature, cast(null as varchar) as op, cast(null as varchar) as value, cast(null as varchar) as value_to, cast(null as boolean) as enabled, cast(null as varchar) as note where false
  - input: ref('taxonomy_label')
    rows:
    - domain: customer_type
      label: RETAIL
      label_std: CONSUMER
      note: null
    - domain: customer_type
      label: WHOLESALE
      label_std: WHOLESALE
      note: null
    - domain: customer_type
      label: PARTNER
      label_std: TRADE
      note: null
    - domain: customer_type
      label: STAFF
      label_std: STAFF
      note: null
    - domain: customer_type
      label: KOL
      label_std: KOL
      note: null
    - domain: customer_type
      label: CROSSBORDER
      label_std: OTHER
      note: null
  expect:
    rows:
    - customer_key: c1
      customer_type: PARTNER
    - customer_key: c2
      customer_type: PARTNER
- name: customer_type_group_blob_underscore_is_a_wildcard
  description: '''_'' in %KY_GUI% is a LIKE wildcard: KY GUI and KYxGUI are PARTNER (real Fine Japan rules: tests/fixtures/taxonomy_rule_tenant_customer_type.csv).'
