# Engine selftest of the classification engine (docs/architecture/taxonomy-engine.md §4b).
# Models enabled only with --vars '{taxonomy_selftest: true}'; run with
#   dbt build --select +tag:taxonomy_selftest --vars '{taxonomy_selftest: true}'
# (scripts/checks/run-all.sh step 5). Generated fixtures: one unit test per behaviour.
version: 2
models:
- name: feat_taxonomy_selftest
  description: 'Feature model of the engine selftest domains: empty and typed (one column per type family); unit
    tests give the rows.'
- name: lbl_selftest_first
  description: Engine selftest, FIRST hit policy, required feature s_text2, matched flag A.
- name: lbl_selftest_unique
  description: Engine selftest, UNIQUE hit policy (n_hits).
  data_tests:
  - dbt_utils.expression_is_true:
      arguments:
        expression: n_hits <= 1
      config:
        severity: warn
- name: lbl_selftest_collect
  description: Engine selftest, COLLECT hit policy (multi).
unit_tests:
- name: taxonomy_engine_op_like
  description: 'Operator like: TRUE on a match, FALSE on a non-match, NULL (or FALSE for is_null) on a NULL feature,
    like the SQL predicate.'
  model: lbl_selftest_first
  given:
  - input: ref('feat_taxonomy_selftest')
    format: sql
    rows: |
      select CAST('k1' AS VARCHAR) as s_key, CAST('KYG' AS VARCHAR) as s_text, CAST('r' AS VARCHAR) as s_text2, CAST(NULL AS DOUBLE) as s_num, CAST(NULL AS VARCHAR[]) as s_list
      union all
      select CAST('k2' AS VARCHAR) as s_key, CAST('K G' AS VARCHAR) as s_text, CAST('r' AS VARCHAR) as s_text2, CAST(NULL AS DOUBLE) as s_num, CAST(NULL AS VARCHAR[]) as s_list
      union all
      select CAST('k3' AS VARCHAR) as s_key, CAST('kyg' AS VARCHAR) as s_text, CAST('r' AS VARCHAR) as s_text2, CAST(NULL AS DOUBLE) as s_num, CAST(NULL AS VARCHAR[]) as s_list
      union all
      select CAST('k4' AS VARCHAR) as s_key, CAST(NULL AS VARCHAR) as s_text, CAST('r' AS VARCHAR) as s_text2, CAST(NULL AS DOUBLE) as s_num, CAST(NULL AS VARCHAR[]) as s_list
  - input: ref('taxonomy_rule_tenant')
    rows:
    - rule_id: a1
      domain: selftest_first
      priority: 10
      label: A
      feature: s_text
      op: like
      value: K_G
      value_to: null
      enabled: true
  - input: ref('taxonomy_rule_product')
    format: sql
    rows: |
      select cast(null as varchar) as rule_id, cast(null as varchar) as domain, cast(null as integer) as priority, cast(null as varchar) as label, cast(null as varchar) as feature, cast(null as varchar) as op, cast(null as varchar) as value, cast(null as varchar) as value_to, cast(null as boolean) as enabled, cast(null as varchar) as note where false
  - input: ref('taxonomy_label')
    rows:
    - domain: selftest
      label: A
      label_std: STD_A
      note: null
    - domain: selftest
      label: B
      label_std: STD_B
      note: null
    - domain: selftest
      label: C
      label_std: STD_C
      note: null
  expect:
    rows:
    - s_key: k1
      selftest_first: A
      selftest_first_std: STD_A
      rule_id: a1
      matched__a: true
    - s_key: k2
      selftest_first: A
      selftest_first_std: STD_A
      rule_id: a1
      matched__a: true
    - s_key: k3
      selftest_first: UNMAPPED
      selftest_first_std: UNMAPPED
      rule_id: null
      matched__a: false
    - s_key: k4
      selftest_first: UNMAPPED
      selftest_first_std: UNMAPPED
      rule_id: null
      matched__a: null
