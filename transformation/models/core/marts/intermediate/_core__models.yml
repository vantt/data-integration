version: 2

models:
  - name: int_customer_benchmarks
    description: >
      Percentile benchmark rankings for all customers.
      Grain: one row per customer_key.
      Rankable population (benchmark_status = 'ranked'): lifetime_value > 0 AND order_count >= 2
      AND customer_type = 'RETAIL' AND acquisition_source != 'Đại Lý' — approximately 939 customers.
      Non-rankable customers receive NULL percentile columns and a descriptive benchmark_status.
      Materialized as TABLE because PERCENT_RANK() is a whole-population window — partial recompute
      would silently corrupt unchanged rows when population shifts.
      v1 metrics: lifetime_value, clv_per_active_month (tenure-normalised).
      v1 frames: all_rankable, in_value_group (min-group guard n<30 → fallback to all_rankable).
    columns:
      - name: customer_key
        description: "Surrogate key for this customer record. FK to dim_customers."
        tests:
          - unique
          - not_null

      - name: benchmark_status
        description: >
          Classification of the customer's eligibility for ranking.
          ranked: in the rankable population, has full percentile columns.
          single_purchase: RETAIL with 1 order and CLV > 0 — insufficient history for ranking.
          inactive_zero_value: CLV <= 0 (refunds, cancelled-only, zero-revenue).
          non_retail: WHOLESALE / CROSSBORDER / PARTNER / STAFF / KOL, or acquisition_source='Đại Lý'.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ranked', 'single_purchase', 'inactive_zero_value', 'non_retail']

      - name: lv_all_rankable_pct
        description: >
          Lifetime value percentile (0-100) within the full rankable population (~939).
          NULL for non-ranked customers.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              config:
                where: "lv_all_rankable_pct IS NOT NULL"

      - name: lv_all_rankable_bucket
        description: >
          Bucket label for lv_all_rankable_pct.
          top_5pct | top_decile | top_quartile | above_median | below_median.
        tests:
          - accepted_values:
              arguments:
                values: ['top_5pct', 'top_decile', 'top_quartile', 'above_median', 'below_median']
              config:
                where: "lv_all_rankable_bucket IS NOT NULL"

      - name: lv_in_value_group_pct
        description: >
          Lifetime value percentile (0-100) within the customer's own value_group.
          Falls back to all_rankable when value_group has fewer than 30 ranked members.
          See lv_vg_frame_used for which frame was applied.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              config:
                where: "lv_in_value_group_pct IS NOT NULL"

      - name: lv_vg_frame_used
        description: >
          Which frame was used for lv_in_value_group_pct:
          in_value_group (n >= 30) or all_rankable_fallback (n < 30).
        tests:
          - accepted_values:
              arguments:
                values: ['in_value_group', 'all_rankable_fallback']
              config:
                where: "lv_vg_frame_used IS NOT NULL"

      - name: clv_all_rankable_pct
        description: >
          Tenure-normalised CLV (clv_per_active_month) percentile within the full rankable population.
          NULL for non-ranked customers.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              config:
                where: "clv_all_rankable_pct IS NOT NULL"

      - name: clv_in_value_group_pct
        description: >
          Tenure-normalised CLV percentile within the customer's own value_group.
          Falls back to all_rankable when group < 30 members.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              config:
                where: "clv_in_value_group_pct IS NOT NULL"

      - name: clv_vs_rankable_median
        description: >
          lifetime_value / median(lifetime_value in rankable population).
          Interpretable as "X times the typical repeat-buyer spend". NULL for non-ranked.

    tests:
      # No ranked row should have lifetime_value <= 0
      - dbt_utils.expression_is_true:
          arguments:
            expression: "lifetime_value > 0"
          config:
            where: "benchmark_status = 'ranked'"
            error_if: ">0"

      # Rankable count sanity: should be roughly 939 (±100 for snapshot drift).
      # dbt_utils.expression_is_true with {{ model }} is unsupported in DuckDB external;
      # this is covered by a singular test in tests/int_customer_benchmarks_rankable_count.sql

  - name: int_customer_discount_metrics
    description: "Per-customer discount metrics across 4 unified buckets: line_discount, voucher, campaign, negotiated."
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: last_line_discount_rate
        description: "Rate (0-1) of item-level discount from most recent order with line discount. NULL = never had line discount."
      - name: max_line_discount_rate
        description: "Highest item-level discount rate ever applied to this customer."
      - name: last_voucher_discount_rate
        description: "Rate from most recent order where customer actively redeemed a voucher."
      - name: max_voucher_discount_rate
        description: "Highest voucher discount rate ever redeemed."
      - name: last_campaign_discount_rate
        description: "Rate from most recent order with merchant-applied promo (bundle/CTKM/sampling)."
      - name: max_campaign_discount_rate
        description: "Highest campaign discount rate ever received."
      - name: last_negotiated_discount_rate
        description: "Rate from most recent order with B2B/direct deal (đại lý/hợp đồng/nhân viên/overseas)."
      - name: max_negotiated_discount_rate
        description: "Highest negotiated discount rate ever."
  - name: int_customer_sku_supply_tracking
    description: >
      Per-customer × SKU supply tracking with recursive stacking, split into two
      independent supply streams.
      Grain: (customer_key, sku, supply_stream) — one row per customer per
      configured core SKU per supply stream.
      Computes estimated_depletion_date using recursive LAG stacking:
        depletion(n) = GREATEST(purchase_date(n), depletion(n-1)) + effective_supply(n)
      effective_supply = qty × supply_days_per_unit × dose_reduction_buffer.
      Covers the 8 Fine Japan core SKUs from seed_sku_regimen_config only.
      Materialized as TABLE (not incremental) — recursive CTE needs full history.

      supply_stream values:
        'purchased'  — customer has EVER bought this SKU non-gift (any order).
                       ALL quantity (purchased + gift) for this stream accumulates
                       into effective_supply_days — unchanged behavior vs. the
                       pre-dual-stream model; a gift on top of a real purchase
                       habit still extends supply (intentional, not a residual bug).
        'gift_only'  — customer has NEVER bought this SKU non-gift; every line is
                       a gift. Supply days tracked independently from any reorder
                       cadence. Feeds the GIFT_TO_PURCHASE action scenario.

      Design note — ever_purchased is a STATIC per-(customer_key, sku) fact, not
      chronological: it does not check whether the purchase happened before or
      after a gift line for that SKU. A single non-gift purchase, at any point in
      time, permanently classifies that customer×SKU pair as 'purchased'. This
      was an explicit product decision (not an oversight) — see
      plans/260708-1501-gift-purchase-sku-action-scenario/phase-03-dual-stream-supply-tracking.md.
    columns:
      - name: customer_key
        description: "Surrogate customer key (FK to dim_customers)."
        tests: [not_null]
      - name: sku
        description: "Core SKU code (from seed_sku_regimen_config)."
        tests: [not_null]
      - name: supply_stream
        description: >
          'purchased' (customer ever bought this SKU non-gift) or 'gift_only'
          (customer never bought this SKU non-gift, all supply came from gifts).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['purchased', 'gift_only']
      - name: product_group
        description: "Product group identifier (e.g. cordyceps_vien)."
      - name: display_name
        description: "Human-readable product name for action queue rationale strings."
      - name: supply_days_per_unit
        description: "Standard days one unit lasts at recommended dose."
      - name: dose_reduction_buffer
        description: "Calibrated multiplier: >1 means customers use slower than standard."
      - name: remind_lead_days
        description: "Days before depletion to start REORDER_PREEMPT signal."
      - name: journey_enabled
        description: "Whether D5-9 / D12-16 journey touchpoints fire for this SKU."
      - name: last_purchase_date
        description: "Date of the customer's most recent purchase of this SKU (ICT)."
      - name: last_order_qty
        description: "Total units purchased in the most recent purchase event."
      - name: effective_supply_days
        description: "Stacked supply days remaining from last purchase = qty × supply_days × buffer."
      - name: estimated_depletion_date
        description: "Estimated date customer runs out of supply (post-stacking). Core signal for the action queue."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_key, sku, supply_stream]
  - name: int_sku_gift_profile
    description: >
      Per-SKU gift-line profile. Grain: one row per SKU (all SKUs ever sold in
      fact_sales — not limited to the 8 core SKUs in seed_sku_regimen_config).
      gift_rate = share of line items where fs.is_gift_line is TRUE (Phase 1's
      line_amount = 0 detection). Distinguishes anchor/premium SKUs (customer
      actively buys) from entry/gift-prone SKUs (frequently bundled free with
      a paid item) — feeds the Phase 4 customer-outreach action queue.

      Deliberately does NOT expose a hardcoded sku_role threshold label.
      gift_rate / multi_sku_gift_rate are the source of truth; any categorical
      threshold (e.g. "gift-prone if gift_rate > X%") belongs in the consuming
      mart (Phase 4), not baked into this table. Rationale: the business
      threshold has only been sanity-checked against 2 of the 8 core SKUs
      (Metabo, Coix) so far — freezing a cutoff here before validating against
      all 8 would risk silently mis-classifying the untested SKUs. See
      plans/260708-1501-gift-purchase-sku-action-scenario/plan.md open
      question #2.
    columns:
      - name: sku
        description: "SKU code (from dim_products), any SKU ever sold — not limited to core SKUs."
        tests: [unique, not_null]
      - name: total_lines
        description: "Total fact_sales line items for this SKU, active orders only (fo.is_active_order = TRUE)."
        tests: [not_null]
      - name: gift_lines
        description: "Count of lines where fs.is_gift_line is TRUE (line_amount = 0)."
        tests: [not_null]
      - name: gift_rate
        description: "gift_lines / total_lines, rounded to 4dp. NULL only if total_lines = 0 (cannot occur post-GROUP BY)."
      - name: multi_sku_lines
        description: "Count of lines belonging to an order (order_id) that contains more than one distinct SKU line."
        tests: [not_null]
      - name: multi_sku_gift_lines
        description: "Count of multi-SKU-basket lines that are also gift lines."
        tests: [not_null]
      - name: multi_sku_gift_rate
        description: >
          multi_sku_gift_lines / multi_sku_lines, rounded to 4dp. NULL when a SKU
          never appears in a multi-SKU basket (NULLIF guards zero-division).
          Per the finejapan gift-entry-sku report, this is the more meaningful
          gift-rate for gift-prone SKUs since solo-SKU orders rarely carry a
          zero-revenue line.

  - name: int_customer_entry_attributes
    description: "One row per retail customer — entry-point attributes derived from their first order. Source for mart_cohort_retention cohort axis assignment."
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null

