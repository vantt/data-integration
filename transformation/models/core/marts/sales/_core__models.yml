version: 2

models:

  - name: dim_price_lists
    description: >
      Reference dimension for the 17 Sapo price lists.
      Grain: 1 row per price_list_id. Stable — changes only when Sapo admin adds/removes price lists.
      is_cost=true → GIANHAP only (import/cost price; reliable COGS proxy for ~10% SKUs not in MISA).
      is_default=true → BANLE (standard retail price list).
      Source: variant_prices embedded in product batch_sync parquet (more complete than src_sapo_price_lists).
    columns:
      - name: price_list_id
        description: "Native Sapo numeric ID for the price list."
        tests: [unique, not_null]
      - name: code
        description: "Short code for the price list (e.g., 'BANLE', 'GIANHAP', 'SHOPEE')."
        tests: [not_null]
      - name: name
        description: "Full display name of the price list as configured in Sapo."
        tests: [not_null]
      - name: currency_iso
        description: "Currency code for prices in this list; always 'VND'."
        tests: [not_null]
      - name: is_cost
        description: "True only for the GIANHAP list — indicates import/cost prices, not selling prices."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_default
        description: "True for the BANLE list — the standard retail price list used by default."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  # Fulfillments / Shipments
  - name: fact_fulfillments
    description: >
      Per-shipment fact — one row per Sapo fulfillment (shipment leg). Sourced from
      std_fulfillments; order_code resolved via fact_orders.order_id. Enables order
      lookup by shipment code / id / tracking code, and the Shipments section in the
      detailView app.
    columns:
      - name: fulfillment_id
        description: "Surrogate key for this fulfillment record."
        tests: [unique, not_null]
      - name: order_id
        description: "Source system order identifier."
        tests: [not_null]
      - name: order_code
        description: "Resolved from fact_orders via order_id (nullable if order absent from mart)"
      - name: tracking_code
        description: "Carrier tracking number"
      - name: status
        description: "DELIVERED / SHIPPING / PACKED / CANCELLED / FAILED / PENDING"
      - name: shipment_status
        description: "Raw carrier shipment status from Sapo ($.shipment.status)"
      - name: shipped_at
        description: "Timestamp when fulfillment was handed to carrier (TIMESTAMPTZ)"
      - name: delivered_at
        description: "Timestamp of carrier delivery confirmation (TIMESTAMPTZ); NULL if not yet delivered"
      - name: days_to_deliver
        description: "Calendar days from shipped_at to delivered_at; NULL if not delivered"
      - name: is_delivered
        description: "TRUE when status = DELIVERED"

  - name: fact_inventory_snapshot
    description: >
      Daily inventory snapshot. Grain: 1 row per (variant_id, location_id, snapshot_date).
      Incremental external parquet — appends each day, never deletes (retention: forever).
      snapshot_date = date of the nightly Sapo product batch run (3am ICT).
      3 physical locations only: 452566 (Trương Định), 494912 (Hậu Giang), 624127 (MM Market An Phú).
      mac-derived stock values are estimates only — not accounting-grade.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [variant_id, location_id, snapshot_date]
    columns:
      - name: inventory_snapshot_key
        description: "Surrogate key for this inventory snapshot record."
        tests: [unique, not_null]
      - name: variant_id
        description: "SKU variant identifier from Sapo."
        tests: [not_null]
      - name: location_id
        description: "Sapo location/warehouse numeric identifier."
        tests: [not_null]
      - name: snapshot_date
        description: "Date of the nightly Sapo product batch run (3am ICT)."
        tests: [not_null]
      - name: sku
        description: "SKU code of the variant (natural key)."
        tests: [not_null]
      - name: on_hand
        description: "Units physically on hand; can be negative for consignment locations"
      - name: available
        description: "on_hand minus committed"
      - name: committed
        description: "Units reserved for open orders"
      - name: mac
        description: "Moving Average Cost per unit (VND). NULL for uncosted variants"
      - name: stock_value_at_mac
        description: "on_hand × mac when both are present and on_hand > 0, else 0"
      - name: committed_value_at_mac
        description: "committed × mac when both present and committed > 0, else 0"

  - name: fact_order_costs
    description: "Long-format cost ledger. Grain: 1 row per (order_id, cost_type). Source of truth for granular costs feeding fact_order_economics."
    columns:
      - name: order_id
        description: "Source system order identifier."
        tests: [not_null]
      - name: order_code
        description: "Source system order code from Sapo."
        tests: [not_null]
      - name: cost_type
        description: "Granular cost type (cogs, platform_payment, discount type, overhead_*)."
        tests: [not_null]
      - name: cost_category
        description: "Broad cost bucket: COGS, PLATFORM_FEE, DISCOUNT, or OVERHEAD."
        tests: [not_null]
      - name: amount
        description: "Always positive (ABS). Sign convention derived from cost_category."
      - name: source_system
        description: "Origin: sapo_mac | sapo_mac+misa | misa | shopee | sapo | derived | estimated | none"
      - name: source_record
        description: "Traceability key: voucher_no for MISA, order_code for Shopee, discount reason for Sapo"
      - name: fee_source
        description: "actual | estimated"
      - name: date_key
        description: "YYYYMMDD in ICT — inherited from fact_orders"
      - name: channel_key
        description: "Inherited from fact_orders"
      - name: discount_rate
        description: "Raw rate (0-100) from Sapo discount_items. NULL for COGS and platform fee rows. Note: always 0 for voucher_promotional (Sapo design). See: docs/architecture/order-pl/discount-classification.md"
      - name: discount_type
        description: "Semantic classification of this discount. NULL for COGS and platform fee rows. 'line_item' = item-level price reduction (no label). See: docs/architecture/order-pl/discount-classification.md"
        tests:
          - accepted_values:
              arguments:
                values: [voucher_promotional, bundle, sampling_gift, wholesale_explicit, overseas, campaign, employee_internal, negotiated_micro, negotiated_standard, negotiated_deep, line_item]
              config:
                where: "discount_type IS NOT NULL"

  - name: fact_order_economics
    description: "Per-order profitability: Sapo revenue + COGS (Sapo-MAC primary / MISA TK632 fallback) + Shopee platform fees. Grain: one row per order."
    columns:
      - name: order_id
        description: "Source system order identifier."
        tests: [unique, not_null]
      - name: order_code
        description: "Source system order code from Sapo."
        tests: [not_null]
      - name: channel_key
        description: "Foreign key to `dim_channels`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: date_key
        description: "Date dimension foreign key (ICT timezone)."
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: status
        description: "Trạng thái đơn hàng (từ fact_orders)"
      - name: gross_revenue
        description: "Giá bán × SL trước chiết khấu (ĐÃ GỒM VAT). WARNING: VAT-INCLUSIVE — not pre-tax gross revenue."
      - name: net_revenue
        description: "Doanh thu thuần (sau chiết khấu, ĐÃ TRỪ VAT)"
        tests: [not_null]
      - name: cogs_amount
        description: "Giá vốn hàng bán (primary: Sapo-MAC moving-avg cost; fallback: MISA TK632). NULL nếu không có dữ liệu COGS."
      - name: has_cogs
        description: "true nếu đơn có dữ liệu COGS (sapo_mac, misa, or both). Alias: cogs_source IS NOT NULL AND cogs_source != 'none'."
      - name: cogs_source
        description: "COGS data source: 'sapo_mac' (Sapo-MAC only) | 'misa' (MISA-632 only) | 'both' (both systems) | 'none' (no COGS). Drives recon panel in detailView."
        tests:
          - accepted_values:
              arguments:
                values: ['sapo_mac', 'misa', 'both', 'none']
              config:
                where: "cogs_source IS NOT NULL"
      - name: gross_profit
        description: "Lãi gộp = net_revenue - COGS. NULL khi không có COGS (has_cogs=FALSE) — luôn filter WHERE has_cogs trước khi SUM để tránh thổi phồng margin."
      - name: gross_margin_pct
        description: "Biên lãi gộp = gross_profit / net_revenue"
      - name: shopee_platform_fees
        description: "Phí sàn cơ bản (service + payment + fixed + affiliate). NULL cho non-Shopee."
      - name: shopee_infra_fee
        description: "Phí hạ tầng Shopee (từ Service Fee Details sheet). NULL cho non-Shopee."
      - name: shopee_voucher_xtra_fee
        description: "Phí Voucher Xtra (từ Service Fee Details sheet). NULL cho non-Shopee."
      - name: shopee_taxes
        description: "VAT + thuế TNCN Shopee. NULL cho non-Shopee."
      - name: shopee_net_settlement
        description: "Số tiền Shopee thực chuyển về. NULL cho non-Shopee."
      - name: has_platform_fees
        description: "true nếu đơn có dữ liệu phí platform (hiện tại: Shopee; mở rộng khi thêm Lazada/TikTok)"
      - name: channel_net_profit
        description: "Lãi ròng kênh = net_revenue - COGS - all Shopee fees"
      - name: channel_net_margin_pct
        description: "Biên lãi ròng kênh = channel_net_profit / net_revenue"
      - name: allocated_overhead
        description: "Tier-3 G&A overhead allocated to this order proportionally by gross_profit share (from int_order_overhead_allocation). NULL when no overhead pool exists for the period."
      - name: is_overhead_estimated
        description: "TRUE if the overhead pool used a budgeted rate (MISA month not yet closed); FALSE when actual MISA data was available."
      - name: fully_loaded_net_profit
        description: "Lãi ròng đầy đủ = channel_net_profit - promo_goods_cost - allocated_overhead. NULL when allocated_overhead is NULL (overhead pool not yet available for the period)."
      - name: fully_loaded_margin_pct
        description: "Biên lãi ròng đầy đủ = fully_loaded_net_profit / net_revenue. NULL when net_revenue = 0 or allocated_overhead is NULL."
      - name: promo_goods_cost
        description: "Chi phí hàng khuyến mãi/quà tặng (revenue=0 lines) định giá theo Sapo-MAC. Marketing cost — KHÔNG phải COGS; không trừ vào gross_profit nhưng trừ vào fully_loaded_net_profit."
      - name: cod_amount
        description: "Giá trị COD thu hộ từ người mua (từ đơn giao hàng đầu tiên)"
      - name: carrier_id
        description: "Đơn vị vận chuyển (GHTK, J&T, GHN, VTP, ...) từ đơn giao hàng đầu tiên"
      - name: return_amount
        description: "Tổng giá trị hoàn trả của đơn (từ fact_order_returns). NULL nếu không có hoàn trả. Không ảnh hưởng channel_net_profit — P&L hoàn trả được ghi nhận tại ngày hoàn trả."
      - name: return_count
        description: "Số lần hoàn trả của đơn"
      - name: has_returns
        description: "true nếu đơn có ít nhất 1 lần hoàn trả"

  - name: fact_order_returns
    description: "Per-return fact: one row per Sapo return event. Returns recognized at return date — original order P&L is not restated."
    columns:
      - name: return_id
        description: "Surrogate key for this return record."
        tests: [unique, not_null]
      - name: order_id
        description: "Source system order identifier."
        tests: [not_null]
      - name: order_code
        description: "Source system order code from Sapo."
        tests: [not_null]
      - name: returned_at
        description: "Thời điểm hoàn trả (issued_at hoặc created_at)"
      - name: return_date
        description: "Ngày hoàn trả tính theo múi giờ ICT"
      - name: refund_amount
        description: "Giá trị hoàn tiền (từ Sapo total_amount của return)"
      - name: return_quantity
        description: "Số lượng sản phẩm hoàn trả"
      - name: return_status
        description: "Trạng thái hoàn trả từ Sapo"
      - name: refund_status
        description: "Trạng thái hoàn tiền từ Sapo"
      - name: return_reason
        description: "Lý do hoàn trả (reason hoặc note từ Sapo)"
      - name: channel_key
        description: "NULL for legacy orders whose order_code is not found in fact_orders (expected for historical returns)"
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
              config:
                severity: warn
                where: "channel_key IS NOT NULL"
      - name: date_key
        description: "Date dimension foreign key (ICT timezone)."
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  # Order Transitions (history_log)
  - name: fact_order_transitions
    description: >
      One row per meaningful order state transition from history_log snapshots.
      Grain: (order_id, snapshot_seq). transition_type classifies each event:
      created, cancelled, completed, shipped, payment_received, or updated.
      days_since_prev_event is NULL for the first snapshot (creation).
      APPROXIMATE: derived from snapshot diffing, not true event log — see
      plans/archive/260609-1606-order-history-log-transitions/plan.md.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, snapshot_seq]
    columns:
      - name: order_id
        description: "Sapo order identifier."
        tests: [not_null]
      - name: snapshot_seq
        description: "1-indexed sequence of distinct captured snapshots per order."
        tests: [not_null]
      - name: transition_type
        description: "Classified transition: created, cancelled, completed, shipped, payment_received, updated."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [created, cancelled, completed, shipped, payment_received, updated]
      - name: days_since_prev_event
        description: "Days between this snapshot and the prior one for the same order. NULL on first snapshot (creation)."

  - name: fact_orders
    description: "Aggregated order fact."
    columns:
      - name: order_id
        description: "Source system order identifier."
        tests: [unique, not_null]
      - name: order_code
        description: "Business order code. Canonical 1:1 join key for cross-source enrichment (Shopee fee/adjustment ingestion, economics, voucher attribution). Must stay one row per code — the sapo v2→v3 union must dedupe so this invariant holds; downstream order_code joins fan out if it breaks."
        tests: [unique, not_null]
      - name: customer_key
        description: "Foreign key to `dim_customers`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: shipping_geography_key
        description: "Geography dimension foreign key for shipping address."
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
              config:
                severity: warn
      - name: billing_geography_key
        description: "Geography dimension foreign key for billing address."
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
              config:
                severity: warn
      - name: channel_key
        description: "Foreign key to `dim_channels`."
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: promotion_key
        description: "Foreign key to `dim_promotions`."
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_promotions')
                field: promotion_key
              config:
                severity: warn
      - name: seller_staff_key
        data_type: varchar
        description: "Người chốt/được giao đơn (Sapo assignee). Primary for team attribution & commission."
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: creator_staff_key
        data_type: varchar
        description: "Người tạo đơn trên Sapo (Sapo account). Operational; use as fallback only."
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: team_key
        data_type: varchar
        description: "Team attribution via seller email → team_members (SCD2)"
        tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: status_key
        description: "Foreign key to `dim_order_status`."
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_order_status')
                field: status_key
      - name: branch_location_key
        description: "Foreign key to `dim_branch_location`."
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_branch_location')
                field: branch_location_key
      - name: date_key
        description: "Date dimension foreign key (ICT timezone)."
        data_type: integer
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: time_key
        description: "Time-of-day dimension foreign key."
        data_type: integer
        tests:
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: gross_revenue
        description: "Giá bán × SL trước chiết khấu (ĐÃ GỒM VAT). Formula: total_amount + total_discount_amount. WARNING: VAT-INCLUSIVE — do NOT subtract vat_amount to get pre-tax gross (that double-counts discount). Use net_revenue for VAT-exclusive revenue."
      - name: discount_amount
        description: "Tổng chiết khấu (coupon, promotion, combo)"
      - name: net_revenue
        description: "Doanh thu thuần (sau chiết khấu, ĐÃ TRỪ VAT). Field gốc từ Sapo $.total − $.total_tax"
      - name: vat_amount
        description: "Thuế VAT (8% hoặc 10%) nhúng trong giá bán Sapo ($.total_tax)"
      - name: total_collected
        description: "Tổng thu từ khách (sau chiết khấu, gồm thuế). Formula: net_revenue + vat_amount"
      - name: client_info
        description: "JSON details about client (IP, User Agent)"
      - name: discount_codes
        description: "JSON list of discount codes"
      - name: max_discount_rate
        description: "Highest discount_rate (0-100) across all discount items on this order. NULL for orders with no discount_items. See: docs/architecture/order-pl/discount-classification.md"
      - name: primary_discount_type
        description: "discount_type of the highest-amount discount item on this order. NULL for orders with no discounts. See: docs/architecture/order-pl/discount-classification.md"
        tests:
          - accepted_values:
              arguments:
                values: [voucher_promotional, bundle, sampling_gift, wholesale_explicit, overseas, campaign, employee_internal, negotiated_micro, negotiated_standard, negotiated_deep]
              config:
                where: "primary_discount_type IS NOT NULL"
      - name: is_active_order
        description: "TRUE when status NOT IN ('CANCELLED','DRAFT'). Status gate for revenue calculations — use with scope_* for revenue cards; use scope_* alone for total order counts."
        tests: [not_null]

  - name: fact_payments
    description: "Transactional payment fact (one row per payment attempt/transaction)."
    columns:
      - name: payment_key
        description: "Surrogate key for this payment record."
        tests: [unique, not_null]
      - name: order_id
        description: "Source system order identifier."
        tests: [not_null]
      - name: payment_method_key
        description: "Foreign key to `dim_payment_methods`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_payment_methods')
                field: payment_method_key
      - name: amount
        description: "Transaction amount"
      - name: status
        description: "Payment status (paid, pending, etc)"
      - name: payment_timestamp
        description: "Time of payment creation"
      - name: paid_on
        description: "Time of payment completion"

  # Facts
  - name: fact_sales
    description: "Transactional sales fact (line item grain)."
    columns:
      - name: order_id
        description: "Source system order identifier."
        tests: [not_null]
      - name: product_key
        description: "Foreign key to `dim_products`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: product_type_key
        description: "Foreign key to `dim_product_types`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_product_types')
                field: product_type_key
      - name: seller_staff_key
        description: "Người chốt/được giao đơn (Sapo assignee). Primary for team attribution & commission."
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: creator_staff_key
        description: "Người tạo đơn trên Sapo (Sapo account). Operational; use as fallback only."
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: team_key
        description: "Team attribution via seller email → team_members (SCD2)"
        tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: status_key
        description: "Foreign key to `dim_order_status`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_order_status')
                field: status_key
      - name: customer_key
        description: "Foreign key to `dim_customers`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: branch_location_key
        description: "Foreign key to `dim_branch_location`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_branch_location')
                field: branch_location_key
      - name: channel_key
        description: "Foreign key to `dim_channels`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: date_key
        description: "Date dimension foreign key (ICT timezone)."
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: shipping_geography_key
        description: "Geography dimension foreign key for shipping address."
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: billing_geography_key
        description: "Geography dimension foreign key for billing address."
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: time_key
        description: "Time-of-day dimension foreign key."
        tests:
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: net_revenue
        description: "VAT-exclusive line net revenue (VAT-strip of line_amount using per-order tax ratio)"
      - name: discount_amount
        description: "Direct discount amount"
      - name: distributed_discount_amount
        description: "Distributed discount amount"
      - name: is_gift_line
        description: "TRUE when line_amount = 0 (STRICT) — rep-entered giveaway/gift, distinct from voucher/campaign discounts that reduce but don't zero the line. Mirrors int_order_promo_goods_cost.is_gift_no_invoice definition at line-item grain."
        tests: [not_null]

  - name: fact_variant_prices_snapshot
    description: >
      Daily snapshot of variant prices per price list.
      Grain: 1 row per (variant_id × price_list_id × snapshot_date).
      Only non-zero prices stored (value=0 means channel not configured for this SKU).
      Incremental external parquet — appends today's snapshot, never overwrites historical prices.
      snapshot_date = dbt run date (CURRENT_DATE), not Sapo product modified_on.
      gianhap_cost denormalized per row for inline margin calcs without self-join.
      17 price lists × ~682 variants × 365 days ≈ 4.2M rows/year.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [variant_id, price_list_id, snapshot_date]
    columns:
      - name: variant_id
        description: "SKU variant identifier from Sapo."
        tests: [not_null]
      - name: price_list_id
        description: "Foreign key to `dim_price_lists`."
        tests: [not_null]
      - name: snapshot_date
        description: "Date of the dbt run when this price snapshot was captured."
        tests: [not_null]
      - name: price_value
        description: "Channel price in VND. Always > 0 (zero-price rows excluded)."
        tests: [not_null]
      - name: price_incl_tax
        description: "Price including VAT. Equals price_value when tax_included=false on variant."
      - name: is_cost
        description: "true only for GIANHAP price list — Sapo-native import/cost price."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: gianhap_cost
        description: "GIANHAP import price for this variant. NULL when GIANHAP not set (value=0) for the SKU."
      - name: implied_gross_margin_pct
        description: "((price_value - gianhap_cost) / price_value) × 100. NULL for cost rows or when gianhap_cost=0."
      - name: is_below_cost
        description: "true when price_value < gianhap_cost for a non-cost price list. Pricing compliance flag."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  # Observability
  - name: mart_data_quality
    description: >
      Single-row (dq_key='global') system data-quality / coverage snapshot powering the
      detailView "Data health" surface: COGS & platform-fee coverage, fulfillment / return /
      US rates, carrier & acquisition NULL rates. Recomputed each pipeline run.
    columns:
      - name: dq_key
        description: "Singleton row identifier; always 'global'."
        tests: [unique, not_null]
      - name: as_of_ict
        description: "Timestamp (ICT) when this snapshot was computed."
      - name: total_orders
        description: "Total order count in fact_order_economics at snapshot time."
      - name: cogs_rate_pct
        description: "Percentage of orders with COGS data (has_cogs = true)."
      - name: platform_fees_rate_pct
        description: "Percentage of orders with Shopee platform-fee data."
      - name: fulfillment_coverage_pct
        description: "Percentage of orders that have at least one fulfillment record."
      - name: return_rate_pct
        description: "Percentage of scope_sales orders that have a return event."
      - name: us_share_pct
        description: "Percentage of orders that are US cross-border shipments."
      - name: carrier_null_rate_pct
        description: "Percentage of fulfillment records with a NULL carrier_id."
      - name: acq_source_null_rate_pct
        description: "Percentage of customers with a NULL acquisition_source."

  - name: mart_inventory_health
    description: >
      Derived inventory health signals. Grain: 1 row per (variant_id, location_id, snapshot_date).
      Full rebuild — joins fact_inventory_snapshot (all dates) × latest velocity from
      mart_sku_economics_monthly. Boolean health flags: is_oos, is_low_stock, is_overstock,
      is_slow_mover, is_dead_stock. Velocity sourced from last completed month per SKU.
    columns:
      - name: inventory_snapshot_key
        description: "Foreign key to `fact_inventory_snapshot`."
        tests: [not_null]
      - name: variant_id
        description: "SKU variant identifier from Sapo."
        tests: [not_null]
      - name: location_id
        description: "Sapo location/warehouse numeric identifier."
        tests: [not_null]
      - name: snapshot_date
        description: "Date of the nightly Sapo product batch run (3am ICT)."
        tests: [not_null]
      - name: is_oos
        description: "true when on_hand <= 0"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_low_stock
        description: "true when 0 < on_hand <= min_value (only when min_value is configured)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_overstock
        description: "true when on_hand > max_value (only when max_value is configured)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_slow_mover
        description: "true when days_of_supply > 90 OR no sale in last 30 days"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_dead_stock
        description: "true when no sale in last 90 days (proxy via mart_sku_economics_monthly)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: days_of_supply
        description: "on_hand / daily_velocity. NULL when no sales history. 0 when on_hand <= 0"
      - name: daily_velocity
        description: "Units/day from last completed month in mart_sku_economics_monthly. NULL for new/unsold SKUs"
      - name: stock_value_at_mac
        description: "Inherited from fact_inventory_snapshot"
      - name: committed_value_at_mac
        description: "Inherited from fact_inventory_snapshot"
      - name: slow_mover_value_at_risk
        description: "stock_value_at_mac when is_slow_mover, else 0"
      - name: dead_stock_value_at_risk
        description: "stock_value_at_mac when is_dead_stock, else 0"

  - name: mart_sku_economics_monthly
    description: >
      Single source of truth for SKU-level economics at monthly grain.
      One row per (product_key, snapshot_month). Rolling 24-month window for YoY.
      Combines Sapo sales volume (fact_sales) + MISA COGS (int_misa_sales_lines) +
      returns (int_return_sku_lines). COGS columns are NULL for ~35% of orders
      without a MISA invoice match. return_adjusted_margin_pct uses worst-case
      (full refund, no COGS recovery).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_key, snapshot_month]
    columns:
      - name: product_key
        description: "Foreign key to dim_products."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: product_code
        description: "Sapo SKU code for the product variant."
      - name: product_name
        description: "Display name of the product."
      - name: snapshot_month
        description: "First day of the reporting month (month-start DATE)."
        tests: [not_null]
      - name: units_sold
        description: "Total units sold in the month across all confirmed orders."
        tests: [not_null]
      - name: net_revenue
        description: "VAT-exclusive net revenue for this SKU in the month."
        tests: [not_null]
      - name: order_count
        description: "Count of distinct orders containing this SKU in the month."
        tests: [not_null]
      - name: daily_velocity
        description: "Average units sold per selling day (units_sold / days_with_sales)."
      - name: cogs_amount
        description: "Total COGS from MISA for this SKU in the month. NULL when no MISA invoice match."
      - name: cogs_per_unit
        description: "Average COGS per unit (cogs_amount / units_sold). NULL when no MISA data."
      - name: gross_profit
        description: "Gross profit = MISA net revenue − COGS. NULL when no MISA data."
      - name: gross_margin_pct
        description: "Gross margin % based on MISA revenue. NULL when no MISA data."
        meta:
          deprecated: true
          use_instead: realized_margin_pct
          reason: "Uses MISA book revenue as denominator; H010 SKUs (~5 SKUs) have ~2× COGS error uncorrected here. realized_margin_pct uses Sapo net_revenue and has the H010 fix applied."
      - name: realized_gross_profit
        description: "Commercial gross profit = Sapo net_revenue − cogs_amount. Preferred over gross_profit for pricing/dashboards (CAVEAT #7 in SQL)."
      - name: realized_margin_pct
        description: "Commercial margin % = (net_revenue − cogs_amount) / net_revenue. Uses actual Sapo selling price. Prefer over gross_margin_pct for pricing decisions. COGS correctness depends on misa_qty_multiplier in seed_sku_alias_manual (H010 SKUs fixed 2026-06-10)."
      - name: cogs_per_unit_3m_avg
        description: "Trailing 3-month average COGS per unit for trend comparison."
      - name: cogs_variance_pct
        description: "Percentage change in cogs_per_unit vs 3-month trailing average."
      - name: return_count
        description: "Count of return events attributed to this SKU in the month."
        tests: [not_null]
      - name: return_quantity
        description: "Total units returned for this SKU in the month."
        tests: [not_null]
      - name: refund_amount_allocated
        description: "Refund value allocated to this SKU proportionally by line revenue."
        tests: [not_null]
      - name: return_rate
        description: "Return count / order_count for this SKU in the month."
      - name: return_adjusted_gross_profit
        description: "Gross profit minus full refund (worst-case; no COGS recovery assumed)."
      - name: return_adjusted_margin_pct
        description: "Gross margin % after deducting full refund amount (conservative lower bound)."
      - name: days_since_last_sale
        description: "Days from last observed sale to month-end within the snapshot window."
      - name: is_slow_mover
        description: "True when no sale in the final 14 days of the month AND not a top-200 SKU by revenue."
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "is_slow_mover IS NOT NULL"
      - name: revenue_share_pct
        description: "This SKU's net_revenue as a % of total revenue across all SKUs in the month."
      - name: margin_outlier
        description: "True when COGS data exists and gross_margin_pct is below 10%."
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "margin_outlier IS NOT NULL"
      - name: top_channel_name
        description: "Name of the channel that generated the highest revenue for this SKU in the month."
      - name: top_channel_revenue_pct
        description: "Percentage of this SKU's revenue that came from the top channel."

