version: 2

models:

  - name: dim_price_lists
    description: >
      Reference dimension for the 17 Sapo price lists.
      Grain: 1 row per price_list_id. Stable — changes only when Sapo admin adds/removes price lists.
      is_cost=true → GIANHAP only (import/cost price; reliable COGS proxy for ~10% SKUs not in MISA).
      is_default=true → BANLE (standard retail price list).
      Source: variant_prices embedded in product batch_sync parquet (more complete than src_sapo_price_lists).
    columns:
      - name: price_list_id
        description: "Native Sapo numeric ID for the price list."
        tests: [unique, not_null]
      - name: code
        description: "Short code for the price list (e.g., 'BANLE', 'GIANHAP', 'SHOPEE')."
        tests: [not_null]
      - name: name
        description: "Full display name of the price list as configured in Sapo."
        tests: [not_null]
      - name: currency_iso
        description: "Currency code for prices in this list; always 'VND'."
        tests: [not_null]
      - name: is_cost
        description: "True only for the GIANHAP list — indicates import/cost prices, not selling prices."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_default
        description: "True for the BANLE list — the standard retail price list used by default."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  # Fulfillments / Shipments
  - name: fact_fulfillments
    description: >
      Per-shipment fact — one row per Sapo fulfillment (shipment leg). Sourced from
      std_fulfillments; order_code resolved via fact_orders.order_id. Enables order
      lookup by shipment code / id / tracking code, and the Shipments section in the
      detailView app.
    columns:
      - name: fulfillment_id
        description: "Surrogate key for this fulfillment record."
        tests: [unique, not_null]
      - name: order_id
        description: "Source system order identifier."
        tests: [not_null]
      - name: order_code
        description: "Resolved from fact_orders via order_id (nullable if order absent from mart)"
      - name: tracking_code
        description: "Carrier tracking number"
      - name: status
        description: "DELIVERED / SHIPPING / PACKED / CANCELLED / FAILED / PENDING"
      - name: shipment_status
        description: "Raw carrier shipment status from Sapo ($.shipment.status)"
      - name: shipped_at
        description: "Timestamp when fulfillment was handed to carrier (TIMESTAMPTZ)"
      - name: delivered_at
        description: "Timestamp of carrier delivery confirmation (TIMESTAMPTZ); NULL if not yet delivered"
      - name: days_to_deliver
        description: "Calendar days from shipped_at to delivered_at; NULL if not delivered"
      - name: is_delivered
        description: "TRUE when status = DELIVERED"

  - name: fact_inventory_snapshot
    description: >
      Daily inventory snapshot. Grain: 1 row per (variant_id, location_id, snapshot_date).
      Rebuilt on every build (rolling, last 3 files): no history accumulates; see
      fact_inventory_position_daily (positions per day from the nightly capture) and
      fact_inventory_balance (on_hand ledger). Values come from the latest product payload, refreshed
      only when Sapo moves modified_on, so snapshot_date can be weeks or years old.
      3 physical locations only: 452566 (Trương Định), 494912 (Hậu Giang), 624127 (MM Market An Phú).
      mac-derived stock values are estimates only — not accounting-grade.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [variant_id, location_id, snapshot_date]
    columns:
      - name: inventory_snapshot_key
        description: "Surrogate key for this inventory snapshot record."
        tests: [unique, not_null]
      - name: variant_id
        description: "SKU variant identifier from Sapo."
        tests: [not_null]
      - name: location_id
        description: "Sapo location/warehouse numeric identifier."
        tests: [not_null]
      - name: snapshot_date
        description: "Date of the nightly Sapo product batch run (3am ICT)."
        tests: [not_null]
      - name: sku
        description: "SKU code of the variant (natural key)."
        tests: [not_null]
      - name: on_hand
        description: "Units physically on hand; can be negative for consignment locations"
      - name: available
        description: "on_hand minus committed"
      - name: committed
        description: "Units reserved for open orders"
      - name: mac
        description: "Moving Average Cost per unit (VND). NULL for uncosted variants"
      - name: stock_value_at_mac
        description: "on_hand × mac when both are present and on_hand > 0, else 0"
      - name: committed_value_at_mac
        description: "committed × mac when both present and committed > 0, else 0"

  - name: fact_order_returns
    description: "Per-return fact: one row per Sapo return event. Returns recognized at return date — original order P&L is not restated."
    columns:
      - name: return_id
        description: "Surrogate key for this return record."
        tests: [unique, not_null]
      - name: order_id
        description: "Source system order identifier."
        tests: [not_null]
      - name: order_code
        description: "Source system order code from Sapo."
        tests: [not_null]
      - name: returned_at
        description: "Thời điểm hoàn trả (issued_at hoặc created_at)"
      - name: return_date
        description: "Ngày hoàn trả tính theo múi giờ ICT"
      - name: refund_amount
        description: "Giá trị hoàn tiền (từ Sapo total_amount của return)"
      - name: return_quantity
        description: "Số lượng sản phẩm hoàn trả"
      - name: return_status
        description: "Trạng thái hoàn trả từ Sapo"
      - name: refund_status
        description: "Trạng thái hoàn tiền từ Sapo"
      - name: return_reason
        description: "Lý do hoàn trả (reason hoặc note từ Sapo)"
      - name: channel_key
        description: "NULL for legacy orders whose order_code is not found in fact_orders (expected for historical returns)"
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
              config:
                severity: warn
                where: "channel_key IS NOT NULL"
      - name: date_key
        description: "Date dimension foreign key (ICT timezone)."
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  # Order Transitions (history_log)
  - name: fact_order_transitions
    description: >
      One row per meaningful order state transition from history_log snapshots.
      Grain: (order_id, snapshot_seq). transition_type classifies each event:
      created, cancelled, completed, shipped, payment_received, or updated.
      days_since_prev_event is NULL for the first snapshot (creation).
      APPROXIMATE: derived from snapshot diffing, not true event log — see
      plans/archive/260609-1606-order-history-log-transitions/plan.md.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, snapshot_seq]
    columns:
      - name: order_id
        description: "Sapo order identifier."
        tests: [not_null]
      - name: snapshot_seq
        description: "1-indexed sequence of distinct captured snapshots per order."
        tests: [not_null]
      - name: transition_type
        description: "Classified transition: created, cancelled, completed, shipped, payment_received, updated."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [created, cancelled, completed, shipped, payment_received, updated]
      - name: days_since_prev_event
        description: "Days between this snapshot and the prior one for the same order. NULL on first snapshot (creation)."

  - name: fact_orders
    description: "Aggregated order fact."
    columns:
      - name: order_id
        description: "Source system order identifier."
        tests: [unique, not_null]
      - name: order_code
        description: "Business order code. Canonical 1:1 join key for cross-source enrichment (Shopee fee/adjustment ingestion, economics, voucher attribution). Must stay one row per code — the sapo v2→v3 union must dedupe so this invariant holds; downstream order_code joins fan out if it breaks."
        tests: [unique, not_null]
      - name: customer_key
        description: "Foreign key to `dim_customers`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: shipping_geography_key
        description: "Geography dimension foreign key for shipping address."
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
              config:
                severity: warn
      - name: billing_geography_key
        description: "Geography dimension foreign key for billing address."
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
              config:
                severity: warn
      - name: channel_key
        description: "Foreign key to `dim_channels`."
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: promotion_key
        description: "Foreign key to `dim_promotions`."
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_promotions')
                field: promotion_key
              config:
                severity: warn
      - name: seller_staff_key
        data_type: varchar
        description: "Người chốt/được giao đơn (Sapo assignee). Primary for team attribution & commission."
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: creator_staff_key
        data_type: varchar
        description: "Người tạo đơn trên Sapo (Sapo account). Operational; use as fallback only."
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: team_key
        data_type: varchar
        description: "Team attribution via seller email → team_members (SCD2)"
        tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: status_key
        description: "Foreign key to `dim_order_status`."
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_order_status')
                field: status_key
      - name: branch_location_key
        description: "Foreign key to `dim_branch_location`."
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_branch_location')
                field: branch_location_key
      - name: date_key
        description: "Date dimension foreign key (ICT timezone)."
        data_type: integer
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: time_key
        description: "Time-of-day dimension foreign key."
        data_type: integer
        tests:
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: gross_revenue
        description: "Giá bán × SL trước chiết khấu (ĐÃ GỒM VAT). Formula: total_amount + total_discount_amount. WARNING: VAT-INCLUSIVE — do NOT subtract vat_amount to get pre-tax gross (that double-counts discount). Use net_revenue for VAT-exclusive revenue."
      - name: discount_amount
        description: "Tổng chiết khấu (coupon, promotion, combo)"
      - name: net_revenue
        description: "Doanh thu thuần (sau chiết khấu, ĐÃ TRỪ VAT). Field gốc từ Sapo $.total − $.total_tax"
      - name: vat_amount
        description: "Thuế VAT (8% hoặc 10%) nhúng trong giá bán Sapo ($.total_tax)"
      - name: total_collected
        description: "Tổng thu từ khách (sau chiết khấu, gồm thuế). Formula: net_revenue + vat_amount"
      - name: client_info
        description: "JSON details about client (IP, User Agent)"
      - name: discount_codes
        description: "JSON list of discount codes"
      - name: max_discount_rate
        description: "Highest discount_rate (0-100) across all discount items on this order. NULL for orders with no discount_items. See: docs/architecture/order-pl/discount-classification.md"
      - name: primary_discount_type
        description: "discount_type of the highest-amount discount item on this order. NULL for orders with no discounts. See: docs/architecture/order-pl/discount-classification.md"
        tests:
          - accepted_values:
              arguments:
                values: [voucher_promotional, bundle, sampling_gift, wholesale_explicit, overseas, campaign, employee_internal, negotiated_micro, negotiated_standard, negotiated_deep]
              config:
                where: "primary_discount_type IS NOT NULL"
      - name: is_active_order
        description: "TRUE when status NOT IN ('CANCELLED','DRAFT'). Status gate for revenue calculations — use with scope_* for revenue cards; use scope_* alone for total order counts."
        tests: [not_null]

  - name: fact_payments
    description: "Transactional payment fact (one row per payment attempt/transaction)."
    columns:
      - name: payment_key
        description: "Surrogate key for this payment record."
        tests: [unique, not_null]
      - name: order_id
        description: "Source system order identifier."
        tests: [not_null]
      - name: payment_method_key
        description: "Foreign key to `dim_payment_methods`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_payment_methods')
                field: payment_method_key
      - name: amount
        description: "Transaction amount"
      - name: status
        description: "Payment status (paid, pending, etc)"
      - name: payment_timestamp
        description: "Time of payment creation"
      - name: paid_on
        description: "Time of payment completion"

  # Facts
  - name: fact_sales
    description: "Transactional sales fact (line item grain)."
    columns:
      - name: order_id
        description: "Source system order identifier."
        tests: [not_null]
      - name: product_key
        description: "Foreign key to `dim_products`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: product_type_key
        description: "Foreign key to `dim_product_types`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_product_types')
                field: product_type_key
      - name: seller_staff_key
        description: "Người chốt/được giao đơn (Sapo assignee). Primary for team attribution & commission."
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: creator_staff_key
        description: "Người tạo đơn trên Sapo (Sapo account). Operational; use as fallback only."
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: team_key
        description: "Team attribution via seller email → team_members (SCD2)"
        tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: status_key
        description: "Foreign key to `dim_order_status`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_order_status')
                field: status_key
      - name: customer_key
        description: "Foreign key to `dim_customers`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: branch_location_key
        description: "Foreign key to `dim_branch_location`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_branch_location')
                field: branch_location_key
      - name: channel_key
        description: "Foreign key to `dim_channels`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: date_key
        description: "Date dimension foreign key (ICT timezone)."
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: shipping_geography_key
        description: "Geography dimension foreign key for shipping address."
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: billing_geography_key
        description: "Geography dimension foreign key for billing address."
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: time_key
        description: "Time-of-day dimension foreign key."
        tests:
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: net_revenue
        description: "VAT-exclusive line net revenue (VAT-strip of line_amount using per-order tax ratio)"
      - name: discount_amount
        description: "Direct discount amount"
      - name: distributed_discount_amount
        description: "Distributed discount amount"
      - name: is_gift_line
        description: "TRUE when line_amount = 0 (STRICT) — rep-entered giveaway/gift, distinct from voucher/campaign discounts that reduce but don't zero the line. Mirrors int_order_promo_goods_cost.is_gift_no_invoice definition at line-item grain."
        tests: [not_null]

  - name: fact_variant_prices_snapshot
    description: >
      Daily snapshot of variant prices per price list.
      Grain: 1 row per (variant_id × price_list_id × snapshot_date).
      Only non-zero prices stored (value=0 means channel not configured for this SKU).
      Rebuilt on every build with the current prices only (rolling, last 3 files): no history; see
      fact_variant_price_daily and fact_variant_price_changes. Prices come from the latest product
      payload, refreshed only when Sapo moves modified_on, so they can be stale.
      snapshot_date = dbt run date (CURRENT_DATE), not Sapo product modified_on.
      gianhap_cost denormalized per row for inline margin calcs without self-join.
      17 price lists × ~682 variants × 365 days ≈ 4.2M rows/year.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [variant_id, price_list_id, snapshot_date]
    columns:
      - name: variant_id
        description: "SKU variant identifier from Sapo."
        tests: [not_null]
      - name: price_list_id
        description: "Foreign key to `dim_price_lists`."
        tests: [not_null]
      - name: snapshot_date
        description: "Date of the dbt run when this price snapshot was captured."
        tests: [not_null]
      - name: price_value
        description: "Channel price in VND. Always > 0 (zero-price rows excluded)."
        tests: [not_null]
      - name: price_incl_tax
        description: "Price including VAT. Equals price_value when tax_included=false on variant."
      - name: is_cost
        description: "true only for GIANHAP price list — Sapo-native import/cost price."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: gianhap_cost
        description: "GIANHAP import price for this variant. NULL when GIANHAP not set (value=0) for the SKU."
      - name: implied_gross_margin_pct
        description: "((price_value - gianhap_cost) / price_value) × 100. NULL for cost rows or when gianhap_cost=0."
      - name: is_below_cost
        description: "true when price_value < gianhap_cost for a non-cost price list. Pricing compliance flag."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  # Observability
  - name: mart_data_quality
    description: >
      Single-row (dq_key='global') system data-quality / coverage snapshot powering the
      detailView "Data health" surface: COGS & platform-fee coverage, fulfillment / return /
      US rates, carrier & acquisition NULL rates. Recomputed each pipeline run.
    columns:
      - name: dq_key
        description: "Singleton row identifier; always 'global'."
        tests: [unique, not_null]
      - name: as_of_ict
        description: "Timestamp (ICT) when this snapshot was computed."
      - name: total_orders
        description: "Total order count in fact_order_economics (pack finance, via pack_ref) at snapshot time. 0 khi tắt pack finance."
      - name: cogs_rate_pct
        description: "Percentage of orders with COGS data (has_cogs = true). NULL khi tắt pack finance."
      - name: platform_fees_rate_pct
        description: "Percentage of orders with Shopee platform-fee data. NULL khi tắt pack finance."
      - name: fulfillment_coverage_pct
        description: "Percentage of orders that have at least one fulfillment record."
      - name: return_rate_pct
        description: "Percentage of scope_sales orders that have a return event."
      - name: us_share_pct
        description: "Percentage of orders that are US cross-border shipments."
      - name: carrier_null_rate_pct
        description: "Percentage of fulfillment records with a NULL carrier_id."
      - name: acq_source_null_rate_pct
        description: "Percentage of customers with a NULL acquisition_source."

  - name: mart_inventory_health
    description: >
      Derived inventory health signals. Grain: 1 row per (variant_id, location_id, snapshot_date).
      Full rebuild — joins fact_inventory_snapshot (all dates) × latest velocity from
      int_sku_sales_monthly (core). Boolean health flags: is_oos, is_low_stock, is_overstock,
      is_slow_mover, is_dead_stock. Velocity sourced from last completed month per SKU.
    columns:
      - name: inventory_snapshot_key
        description: "Foreign key to `fact_inventory_snapshot`."
        tests: [not_null]
      - name: variant_id
        description: "SKU variant identifier from Sapo."
        tests: [not_null]
      - name: location_id
        description: "Sapo location/warehouse numeric identifier."
        tests: [not_null]
      - name: snapshot_date
        description: "Date of the nightly Sapo product batch run (3am ICT)."
        tests: [not_null]
      - name: is_oos
        description: "true when on_hand <= 0"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_low_stock
        description: "true when 0 < on_hand <= min_value (only when min_value is configured)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_overstock
        description: "true when on_hand > max_value (only when max_value is configured)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_slow_mover
        description: "true when days_of_supply > 90 OR no sale in last 30 days"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_dead_stock
        description: "true when no sale in last 90 days (proxy via int_sku_sales_monthly)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: days_of_supply
        description: "on_hand / daily_velocity. NULL when no sales history. 0 when on_hand <= 0"
      - name: daily_velocity
        description: "Units/day from last completed month in int_sku_sales_monthly. NULL for new/unsold SKUs"
      - name: stock_value_at_mac
        description: "Inherited from fact_inventory_snapshot"
      - name: committed_value_at_mac
        description: "Inherited from fact_inventory_snapshot"
      - name: slow_mover_value_at_risk
        description: "stock_value_at_mac when is_slow_mover, else 0"
      - name: dead_stock_value_at_risk
        description: "stock_value_at_mac when is_dead_stock, else 0"

  - name: fact_variant_price_daily
    description: >
      Daily price history per variant and price list, from the nightly full capture of Sapo
      (sapo_v2_raw/product_daily_snapshot, since 15/10/2026). Grain: 1 row per
      (variant_id × price_list_id × as_of_date). as_of_date = ICT day the capture stands for
      (var history_day_cutoff_hour, default 6: the 03:01 capture of D+1 records the end of day D);
      the latest capture of a day wins. A missed night is a missing day (never filled in). Zero
      prices kept with is_configured = false. Source-provided values only, no margin columns.
      Rebuilt in full from raw on every build.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [variant_id, price_list_id, as_of_date]
    columns:
      - name: variant_id
        description: "Sapo variant identifier."
        tests: [not_null]
      - name: price_list_id
        description: "Foreign key to `dim_price_lists`."
        tests: [not_null]
      - name: as_of_date
        description: "ICT day the price stands for (end of day when captured by the nightly)."
        tests: [not_null]
      - name: sku
        description: "Variant SKU at capture time."
      - name: product_id
        description: "Sapo product identifier."
      - name: price_list_code
        description: "Price list code (BANLE, GIANHAP, ...)."
      - name: price_list_name
        description: "Price list name at capture time."
      - name: is_cost
        description: "true for the cost price list (GIANHAP). Source-provided."
      - name: price_value
        description: "Price in VND as captured; 0 = not configured for this SKU."
      - name: price_incl_tax
        description: "Price including VAT as captured."
      - name: is_configured
        description: "price_value > 0."
        tests: [not_null]
      - name: captured_at
        description: "UTC time of the capture used for this day."
        tests: [not_null]

  - name: fact_variant_price_changes
    description: >
      Price intervals (SCD type 2) per variant and price list: consecutive observations with the same
      price form one interval. Evidence: every product version in raw (from 28/05/2026; earlier starts
      are inferred from product modified_on) plus the nightly full capture (from 15/10/2026).
      Grain: 1 row per (variant_id × price_list_id × valid_from_at). As of end of day D:
      `D BETWEEN valid_from_date AND COALESCE(valid_to_date, DATE '9999-12-31')`. A pair missing
      from the latest capture is closed at its last observation (is_current = false).
      previous_price_value / price_change_pct compare with the previous interval (not a margin).
      Rebuilt in full from raw on every build.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [variant_id, price_list_id, valid_from_at]
    columns:
      - name: variant_id
        tests: [not_null]
      - name: price_list_id
        tests: [not_null]
      - name: valid_from_at
        description: "First observation of this price (UTC)."
        tests: [not_null]
      - name: valid_from_date
        description: "First day this price holds: as_of_date for a capture, ICT date for a product version."
        tests: [not_null]
      - name: valid_to_at
        description: "Start of the next interval (exclusive), or last observation when the pair was removed; NULL while current."
      - name: valid_to_date
        description: "Last day this price holds at end of day; NULL while current. Below valid_from_date when replaced on the same day."
      - name: price_value
        description: "Price in VND for the interval; 0 = not configured."
      - name: price_incl_tax
        description: "Price including VAT for the interval."
      - name: is_configured
        description: "price_value > 0."
      - name: previous_price_value
        description: "price_value of the previous interval; NULL for the first."
      - name: price_change_pct
        description: "(price_value − previous_price_value) / previous_price_value × 100, when the previous price is > 0."
      - name: evidence_source
        description: "Evidence of the interval's first observation."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [daily_capture, sapo_product_version]
      - name: last_observed_at
        description: "Last observation of this price (UTC)."
        tests: [not_null]
      - name: is_current
        description: "true for the open interval of a pair still present in the latest capture."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

unit_tests:
  - name: price_daily_as_of_date_follows_the_cutoff_and_latest_capture_wins
    description: >
      The 03:01 ICT capture of D+1 records day D; a 10:00 capture on D and the 03:01 capture of D+1
      give one row for D with the 03:01 price; a zero price is kept as not configured; product
      versions are not daily captures.
    model: fact_variant_price_daily
    given:
      - input: ref('std_variant_price_observations')
        rows:
          - {variant_id: '1', product_id: '9', sku: S1, price_list_id: '10', price_list_name: Retail, price_list_code: BANLE, is_cost_price: false, price_value: 100, price_incl_tax: 100, observed_at: '2026-10-15 20:01:00+00', evidence_source: daily_capture, observation_ref: r1, source_system: sapo_v2, source_version: v2}
          - {variant_id: '1', product_id: '9', sku: S1, price_list_id: '20', price_list_name: Wholesale, price_list_code: BANSI, is_cost_price: false, price_value: 0, price_incl_tax: 0, observed_at: '2026-10-15 20:01:00+00', evidence_source: daily_capture, observation_ref: r1, source_system: sapo_v2, source_version: v2}
          - {variant_id: '1', product_id: '9', sku: S1, price_list_id: '10', price_list_name: Retail, price_list_code: BANLE, is_cost_price: false, price_value: 110, price_incl_tax: 110, observed_at: '2026-10-16 03:00:00+00', evidence_source: daily_capture, observation_ref: r2, source_system: sapo_v2, source_version: v2}
          - {variant_id: '1', product_id: '9', sku: S1, price_list_id: '10', price_list_name: Retail, price_list_code: BANLE, is_cost_price: false, price_value: 120, price_incl_tax: 120, observed_at: '2026-10-16 20:01:00+00', evidence_source: daily_capture, observation_ref: r3, source_system: sapo_v2, source_version: v2}
          - {variant_id: '1', product_id: '9', sku: S1, price_list_id: '10', price_list_name: Retail, price_list_code: BANLE, is_cost_price: false, price_value: 90, price_incl_tax: 90, observed_at: '2026-10-14 08:00:00+00', evidence_source: sapo_product_version, observation_ref: l1, source_system: sapo_v2, source_version: v2}
    expect:
      rows:
        - {variant_id: 1, price_list_id: 10, as_of_date: '2026-10-15', price_value: 100, is_configured: true}
        - {variant_id: 1, price_list_id: 20, as_of_date: '2026-10-15', price_value: 0, is_configured: false}
        - {variant_id: 1, price_list_id: 10, as_of_date: '2026-10-16', price_value: 120, is_configured: true}

  - name: price_changes_merge_runs_of_the_same_price_and_close_removed_pairs
    description: >
      Captures A, A, B, A give three intervals with the right valid_to_date; a pair seen in a product
      version and an early capture but missing from the latest capture is one closed interval
      (duplicate product versions collapse).
    model: fact_variant_price_changes
    given:
      - input: ref('std_variant_price_observations')
        rows:
          - {variant_id: '1', product_id: '9', sku: S1, price_list_id: '10', price_list_name: Retail, price_list_code: BANLE, is_cost_price: false, price_value: 100, price_incl_tax: 100, observed_at: '2026-10-01 20:01:00+00', evidence_source: daily_capture, observation_ref: r1, source_system: sapo_v2, source_version: v2}
          - {variant_id: '1', product_id: '9', sku: S1, price_list_id: '10', price_list_name: Retail, price_list_code: BANLE, is_cost_price: false, price_value: 100, price_incl_tax: 100, observed_at: '2026-10-02 20:01:00+00', evidence_source: daily_capture, observation_ref: r2, source_system: sapo_v2, source_version: v2}
          - {variant_id: '1', product_id: '9', sku: S1, price_list_id: '10', price_list_name: Retail, price_list_code: BANLE, is_cost_price: false, price_value: 120, price_incl_tax: 120, observed_at: '2026-10-03 20:01:00+00', evidence_source: daily_capture, observation_ref: r3, source_system: sapo_v2, source_version: v2}
          - {variant_id: '1', product_id: '9', sku: S1, price_list_id: '10', price_list_name: Retail, price_list_code: BANLE, is_cost_price: false, price_value: 100, price_incl_tax: 100, observed_at: '2026-10-04 20:01:00+00', evidence_source: daily_capture, observation_ref: r4, source_system: sapo_v2, source_version: v2}
          - {variant_id: '2', product_id: '8', sku: S2, price_list_id: '10', price_list_name: Retail, price_list_code: BANLE, is_cost_price: false, price_value: 50, price_incl_tax: 50, observed_at: '2026-06-01 03:00:00+00', evidence_source: sapo_product_version, observation_ref: l1, source_system: sapo_v2, source_version: v2}
          - {variant_id: '2', product_id: '8', sku: S2, price_list_id: '10', price_list_name: Retail, price_list_code: BANLE, is_cost_price: false, price_value: 50, price_incl_tax: 50, observed_at: '2026-06-01 03:00:00+00', evidence_source: sapo_product_version, observation_ref: l2, source_system: sapo_v2, source_version: v2}
          - {variant_id: '2', product_id: '8', sku: S2, price_list_id: '10', price_list_name: Retail, price_list_code: BANLE, is_cost_price: false, price_value: 50, price_incl_tax: 50, observed_at: '2026-10-01 20:01:00+00', evidence_source: daily_capture, observation_ref: r1, source_system: sapo_v2, source_version: v2}
    expect:
