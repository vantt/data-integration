version: 2

models:

  - name: fact_inventory_balance
    tags: [hourly]
    description: >
      Sparse effective-dated stock-balance ledger per (variant_id, location_id). Natural
      counterpart to fact_inventory_movements (movements change the balance).
      Grain: 1 row per (variant_id, location_id, movement-day) = that day's CLOSING on-hand
      (~17.6k rows). Replaces the former dense daily carry-forward (fact_inventory_onhand_daily,
      ~1.9M rows / 99.1% redundant). Each row carries an effective range:
        - Current stock:   WHERE is_current             (~1,494 pairs; 59 with onhand>0)
        - Stock on date X: WHERE X BETWEEN valid_from_date AND valid_to_date
        - Trend over time: step-line on (valid_from_date, onhand) per pair
      onhand is authoritative (never recomputed). Negative-onhand pairs flagged via is_negative_onhand.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [variant_id, location_id, valid_from_date]
    columns:
      - name: variant_id
        description: "Source system identifier."
        tests: [not_null]
      - name: location_id
        description: "Source system identifier."
        tests: [not_null]
      - name: sku
        description: "Product SKU code."
        tests: [not_null]
      - name: valid_from_date
        description: "Movement-day this closing balance became effective (ICT date)."
        tests: [not_null]
      - name: valid_to_date
        description: "Last day this balance holds (day before next movement-day); DATE '9999-12-31' if current."
        tests: [not_null]
      - name: onhand
        description: "Closing stock quantity for the day. Authoritative from source."
      - name: moving_avg_cost
        description: "Moving average cost per unit at close (VND)."
      - name: inventory_value
        description: "Inventory value = onhand × mac at close (VND)."
      - name: is_current
        description: "true for the latest (open-ended) balance per (variant, location) = current stock."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_negative_onhand
        description: "true where onhand < 0 (data anomaly to flag)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
  - name: fact_inventory_movements
    tags: [hourly]
    description: >
      Inventory movement ledger fact. Grain: 1 row per inventory_movement_id (entity_id
      content hash). Sourced from std_inventory_movements; filters quantity_delta != 0
      (excludes zero-qty catalog-init and pure cost-adjustment rows).
      Both legs of a cancelled fulfillment are preserved (do NOT net/sum — analysis caveat #2).
      movement_direction: IN (import_quantity>0) / OUT (export_quantity>0).
      cogs_amount = export_amount (pre-txn MAC — use directly for COGS).
      document_code links to std_orders.order_code for SON… codes (41% of rows).
    columns:
      - name: inventory_movement_id
        description: "Surrogate key for this record."
        tests: [unique, not_null]
      - name: issued_date_key
        description: "Date dimension foreign key (ICT timezone)."
        tests: [not_null]
      - name: issued_at
        description: "Timestamp when movement was recorded (ICT)."
        tests: [not_null]
      - name: variant_id
        description: "Source system identifier."
        tests: [not_null]
      - name: location_id
        description: "Source system identifier."
        tests: [not_null]
      - name: quantity_delta
        description: "Signed quantity: +IN (import) / −OUT (export). Zero rows excluded by WHERE clause."
        tests: [not_null]
      - name: movement_direction
        description: "IN / OUT — derived from import_quantity>0, not action field."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['IN', 'OUT']
      - name: cogs_amount
        description: "COGS at pre-txn MAC (= export_amount). Use directly; do NOT recompute from mac."
      - name: inventory_value
        description: "Post-txn inventory value = onhand × mac (amount column from source)."
      - name: onhand
        description: "Running stock balance at moment of transaction. Authoritative — never recomputed."
      - name: moving_avg_cost
        description: "Moving average cost per unit (post-txn MAC)."
      - name: source_version
        description: "Source API version ('v2')."


  - name: fact_inventory_position_daily
    description: >
      Daily stock position per variant and location, as Sapo reported it at the nightly full capture
      (sapo_v2_raw/product_daily_snapshot, since 15/10/2026): on_hand, available, committed,
      incoming, onway, min/max, bin_location, wait_to_pack, mac (all source-provided).
      Grain: 1 row per (variant_id × location_id × as_of_date). as_of_date = ICT day the capture
      stands for (var history_day_cutoff_hour, default 6); the latest capture of a day wins. A missed
      night is a missing day. on_hand before the first capture: fact_inventory_balance. No stock value
      column. Rebuilt in full from raw on every build.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [variant_id, location_id, as_of_date]
    columns:
      - name: variant_id
        tests: [not_null]
      - name: location_id
        tests: [not_null]
      - name: as_of_date
        description: "ICT day the position stands for (end of day when captured by the nightly)."
        tests: [not_null]
      - name: location_name
        description: "From dim_branch_location; 'Unknown' when missing."
      - name: location_code
        description: "From dim_branch_location; 'UNK' when missing."
      - name: on_hand
        description: "Physical stock reported by Sapo."
      - name: available
        description: "Sellable stock (on_hand − committed)."
      - name: committed
        description: "Stock reserved by open orders."
      - name: incoming
        description: "Stock on incoming purchase orders."
      - name: onway
        description: "Stock in transfer between locations."
      - name: min_value
        description: "Reorder minimum set in Sapo for this location."
      - name: max_value
        description: "Reorder maximum set in Sapo for this location."
      - name: mac
        description: "Moving average cost reported by Sapo at capture time."
      - name: bin_location
        description: "Bin (shelf) location set in Sapo."
      - name: wait_to_pack
        description: "Quantity waiting to be packed."
      - name: captured_at
        description: "UTC time of the capture used for this day."
        tests: [not_null]

unit_tests:
  - name: inventory_position_daily_keeps_the_latest_capture_of_each_day
    description: "A 10:00 ICT capture and the 03:01 capture of the next day give one row for the day, with the 03:01 values and the location name."
    model: fact_inventory_position_daily
    given:
      - input: ref('std_inventory_position_captures')
        rows:
          - {variant_id: '1', product_id: '9', sku: S1, location_id: '100', on_hand: 5, available: 4, committed: 1, captured_at: '2026-10-16 03:00:00+00', capture_run_id: r1}
          - {variant_id: '1', product_id: '9', sku: S1, location_id: '100', on_hand: 3, available: 3, committed: 0, captured_at: '2026-10-16 20:01:00+00', capture_run_id: r2}
      - input: ref('dim_branch_location')
        rows:
          - {branch_location_id: 100, branch_location_name: Main store, branch_location_code: MAIN}
    expect:
      rows:
        - {variant_id: '1', location_id: '100', as_of_date: '2026-10-16', on_hand: 3, available: 3, location_name: Main store, location_code: MAIN}
