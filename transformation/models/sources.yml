version: 2

sources:

  - name: hug_raw
    schema: main
    meta:
      external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/hug_raw/{name}/ingest_method=*/**/*.parquet', hive_partitioning=1, union_by_name=true)"
    tables:
      - name: scan
        description: >
          Raw Hug scan events from Cloudflare D1 queue (source_system='hug', entity_type='scan').
          One row per poll batch per token. entity_id = token (no numeric 'id' field).
          Produced by hug_webhook_consumer DLT pipeline, landing in hug_raw/scan/.
      - name: optin_event
        description: >
          Raw Hug opt-in events from Cloudflare D1 queue (source_system='hug', entity_type='optin').
          Posted by the landing page to /webhook/hug/optin/created, enqueued at edge,
          polled locally. entity_id = token. Nullable fields: phone, zalo_uid, name.
          Landing in hug_raw/optin_event/. Landing page built in a later task (L1-landing).

  - name: crm_export
    schema: main
    tables:
      - name: crm_last_contact
        meta:
          external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/crm_export/crm_last_contact.parquet')"
      - name: crm_activity_log
        meta:
          external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/crm_export/crm_activity_log/**/*.parquet', hive_partitioning=1, union_by_name=true)"
      - name: crm_hug_voucher
        meta:
          external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/crm_export/crm_hug_voucher.parquet')"
      - name: crm_campaign_target
        meta:
          external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/crm_export/crm_campaign_target.parquet')"
      - name: crm_app_user
        description: "CRM staff users (snapshot). staff_id = Sapo account_id bridge."
        meta:
          external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/crm_export/crm_app_user.parquet')"
      - name: crm_task
        description: "CRM tasks (incremental by updated_at). Grain: 1 row per task × update batch."
        meta:
          external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/crm_export/crm_task/**/*.parquet', hive_partitioning=1, union_by_name=true)"
      - name: crm_note
        description: "CRM notes incremental (private excluded). Grain: 1 note × batch."
        meta:
          external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/crm_export/crm_note/**/*.parquet', hive_partitioning=1, union_by_name=true)"
      - name: crm_tag
        description: "Tag taxonomy snapshot."
        meta:
          external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/crm_export/crm_tag.parquet')"
      - name: crm_party_tag
        description: "Party-tag assignments snapshot."
        meta:
          external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/crm_export/crm_party_tag.parquet')"
      - name: crm_party_insight
        description: "Rep-curated insights incremental (active rows only)."
        meta:
          external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/crm_export/crm_party_insight/**/*.parquet', hive_partitioning=1, union_by_name=true)"
      - name: crm_customer_profile_custom
        description: "Customer profile custom JSON blob snapshot. Pivot in staging."
        meta:
          external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/crm_export/crm_customer_profile_custom.parquet')"
