version: 2

sources:
  - name: sapo_v2_raw
    schema: main
    # Cấu hình Meta chung cho Source này
    # Tự động map tên bảng vào đường dẫn: external_location: Quy định cách DuckDB đọc file.
    # ingest_method=*/**/*.parquet nghĩa là đọc đệ quy tất cả file parquet trong các thư mục partition hợp lệ,
    # qua đó bỏ qua các thư mục log nội bộ như _delta_log.
    # D1 middle-ground: dbt source alias renamed to sapo_v2_raw; physical folder stays sapo_raw/ (dlt pipeline unchanged).
    meta:
      external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/sapo_raw/{name}/ingest_method=*/**/*.parquet', hive_partitioning=1, union_by_name=true)"

    tables:
      # Bảng 1: Orders
      - name: order
        description: >
          Raw orders data from Parquet files. IMPORTANT: Sapo selling prices are VAT-INCLUSIVE.
          $.total (total_amount) is the gross amount after discount with VAT already embedded — it is NOT pre-tax.
          $.total_tax (vat_amount) is the VAT embedded inside $.total: 8/108 for 8%-VAT items,
          10/110 for 10%-VAT items, 0 for exports/non-VAT items. It is NOT added on top.
          Net revenue (VAT-exclusive) = total_amount - vat_amount.
          ~60% of orders carry tax=0 (US/export channel + retail orders with no recorded VAT); for those net_revenue = total_amount.
        columns:
          - name: payload
            description: >
              Full Sapo order JSON snapshot. Key financial fields:
              $.total → total_amount (VAT-inclusive gross after discount; cash collected from customer — do NOT add tax on top),
              $.total_tax → vat_amount (VAT embedded in $.total; computed by Sapo as 8/108 or 10/110 per order),
              $.total_discount → total_discount_amount (total discount applied).

      # Bảng 2: Customers
      - name: customer
        description: "Raw customers data from Parquet files"

      # Bảng 3: Accounts (Staff)
      - name: account
        description: "Raw accounts/staff data from Parquet files"

      # Bảng 4: Products
      - name: product
        description: "Raw products data from Parquet files"

      # Bảng 5: Fulfillments (history_log — packing slips with nested shipment)
      - name: fulfillment
        description: "Raw fulfillment/shipment data from history log"

      # Bảng 6: Purchase Orders (history_log — supplier orders)
      - name: purchase_order
        description: "Raw purchase order data from history log"

      # Bảng 7: Order Returns (history_log)
      - name: order_return
        description: "Raw order return data from history log"

      # Bảng 8: Stock Adjustments (history_log — inventory adjustments)
      - name: stock_adjustment
        description: "Raw stock adjustment data from history log"

      # Bảng 9: Customer Groups (history_log — customer segmentation)
      - name: customer_group
        description: "Raw customer group data from history log"

      # Bảng 10: Price Lists (history_log)
      - name: price_list
        description: "Raw price list data from history log"

      # Targets (Google Sheets)
      - name: targets_raw
        description: "Target goals ingested from Google Sheets"

      # Bảng 5: Marketing Spend (Google Sheets)
      - name: marketing_spend_raw
        description: "Marketing spend data ingested from Google Sheets"

      # Team Configuration (Google Sheets)
      - name: teams_raw
        description: "Team definitions with revenue_type and revenue_filter"

      - name: team_members_raw
        description: "Staff membership with SCD2 (effective_from/to)"

      # US Shipment Price List (Google Sheets)
      - name: us_shipment_prices_raw
        description: "SKU-level US export deal prices with effective_from date versioning. Sapo records US prices as 0; this is the source of truth."

      # Bảng 11: Inventory Transactions v2 (batch_sync parquet, content-addressed entity_id)
      - name: inventory_transaction_v2
        description: >
          Raw inventory in/out transactions from Sapo (batch_sync ingest). Grain: 1 row per
          document × product line (e.g., one line per SKU on a sales order, purchase order, or
          stock adjustment that moved inventory). entity_id is CONTENT-ADDRESSED (SHA of payload):
          identical re-fetches collapse; any field change (incl. onhand running balance) produces
          a distinct row. onhand = running stock balance at the moment of the transaction.
          import_amount / export_amount are the stock-value movements; mac = moving-average cost
          at transaction time; total_mac = cumulative MAC after the transaction.
          Business-grain dedup (e.g., last onhand per document) is deferred to the std layer.

  - name: shopee_raw
    schema: main
    meta:
      external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/shopee_raw/{name}/ingest_method=*/**/*.parquet', hive_partitioning=1, union_by_name=true)"
    tables:
      - name: order_revenue
        description: "Shopee order-level revenue & fees (Doanh thu sheet, Order rows)"
      - name: order_revenue_items
        description: "Shopee order × product line items (Doanh thu sheet, Sku rows)"
      - name: order_service_fees
        description: "Shopee extra service fees: infrastructure + Xtra voucher (Service Fee Details sheet)"
      - name: order_adjustments
        description: "Shopee order-level adjustments: marketing fees, compensations (Adjustment sheet, detail rows only)"

  - name: misa_raw
    schema: main
    meta:
      external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/misa_raw/{name}/ingest_method=*/**/*.parquet', hive_partitioning=1, union_by_name=true)"
    tables:
      - name: sales_lines
        description: "MISA AMIS Sổ chi tiết bán hàng — 1 row per invoice line, includes COGS (giá vốn)"
      - name: account_ledger
        description: >
          MISA AMIS Sổ chi tiết các tài khoản — 1 row per journal line for overhead accounts
          (6421/6422). Section-based parser forward-fills account from section markers.
          Grain: 1 row per journal entry line. Partition: year/month (hive).
          Overhead pool source; 642-promo and traceable accounts dropped later via
          classification gsheet (phase-04).
        columns:
          - name: posting_date
            description: "Ngày hạch toán (journal posting date)"
          - name: voucher_no
            description: "Số chứng từ (voucher / document number)"
          - name: invoice_date
            description: "Ngày hoá đơn (invoice date, may be null)"
          - name: invoice_no
            description: "Số hoá đơn (invoice number, may be null)"
          - name: description
            description: "Diễn giải (transaction description)"
          - name: offset_account
            description: "TK đối ứng (counterpart account code). 911 = kết chuyển cuối kỳ."
          - name: debit
            description: "Phát sinh Nợ (debit amount, VND)"
          - name: credit
            description: "Phát sinh Có (credit amount, VND)"
          - name: account
            description: "Leaf account code forward-filled from section marker (e.g. 64211, 6422)"
          - name: account_group
            description: "Top-level group: '6421' or '6422' (derived from account prefix)"
          - name: ingest_method
            description: "Ingestion method tag (e.g. misa_account)"
          - name: source_file
            description: "Source Excel filename"
          - name: ingested_at
            description: "Ingestion timestamp (UTC)"
