version: 2

sources:
  - name: sapo_raw
    schema: main
    # Cấu hình Meta chung cho Source này 
    # Tự động map tên bảng vào đường dẫn: external_location: Quy định cách DuckDB đọc file. 
    # **/*.parquet nghĩa là đọc đệ quy tất cả file parquet trong thư mục con.
    meta:
      external_location: "read_parquet('{{ env_var('DBT_DATA_LAKE_PATH') }}/sapo_raw/{name}/**/*.parquet', hive_partitioning=1)"

    tables:
      # Bảng 1: Orders
      - name: order
        description: "Raw orders data from Parquet files"

      # Bảng 2: Customers
      - name: customer
        description: "Raw customers data from Parquet files"

      # Bảng 3: Accounts (Staff)
      - name: account
        description: "Raw accounts/staff data from Parquet files"

      # Bảng 4: Targets (Google Sheets)
      - name: targets_raw
        description: "Target goals ingested from Google Sheets"