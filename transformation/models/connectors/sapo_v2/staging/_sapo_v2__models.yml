version: 2

models:

  - name: src_sapo_v2_inventory_transactions
    tags: [hourly]
    description: >
      Flattened inventory transactions from Sapo (batch_sync, content-addressed entity_id).
      Grain: 1 row per document × product line × content-state. onhand is a running stock
      balance at the moment of the transaction. import_amount/export_amount are stock-value
      movements (MAC-based). Business-grain dedup deferred to std layer.
    columns:
      - name: entity_id
        description: "Content hash of payload — unique per distinct payload snapshot. Primary key."
        tests: [unique, not_null]
      - name: issued_at_utc
        description: "Transaction timestamp (TIMESTAMPTZ, UTC). Authoritative business time."
        tests: [not_null]
      - name: log_root_id
        description: "Source document ID (order, purchase order, stock adjustment, etc.)."
      - name: trans_type_name
        description: "Human-readable transaction type (e.g., 'Bán hàng', 'Nhập hàng')."
      - name: variant_id
        description: "Sapo variant ID of the SKU involved in the transaction."
        tests: [not_null]
      - name: sku
        description: "SKU code of the variant."
      - name: onhand
        description: "Running stock balance (units) after this transaction at the given location."
      - name: export_quantity
        description: "Units leaving stock (positive = outflow). Null for import-only transactions."
      - name: import_quantity
        description: "Units entering stock (positive = inflow). Null for export-only transactions."
      - name: mac
        description: "Moving-average cost per unit at the time of this transaction."
      - name: location_id
        description: "Sapo warehouse/location ID."

  - name: stg_sapo_v2_customers
    columns:
      - name: sapo_customer_id
        tests: [not_null]

  - name: stg_sapo_v2_fulfillments
    columns:
      - name: fulfillment_id
        tests: [not_null]

  - name: stg_sapo_v2_inventories
    columns:
      - name: variant_id
        tests: [not_null]
      - name: location_id
        tests: [not_null]

  - name: stg_sapo_v2_order_discount_items
    description: "Unnested discount_items array from raw Sapo orders. Grain: 1 row per discount item per order. B2B wholesale-price-gap rows excluded."
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_code
        tests: [not_null]
      - name: amount
        description: "Discount amount (always positive, B2B rate=100/empty-reason rows filtered out)"
      - name: reason
        description: "Raw reason string from Sapo payload — used for cost_type classification in fact_order_costs"

  - name: stg_sapo_v2_order_items
    columns:
      - name: item_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]

  - name: stg_sapo_v2_order_returns
    columns:
      - name: return_id
        tests: [unique, not_null]

  - name: stg_sapo_v2_orders
    columns:
      - name: order_id
        tests: [not_null, unique]

  - name: stg_sapo_v2_payments
    columns:
      - name: payment_id
        tests: [not_null]
      - name: amount
        tests: [not_null]

  - name: stg_sapo_v2_products
    columns:
      - name: product_id
        tests: [not_null]

  - name: stg_sapo_v2_variant_prices
    columns:
      - name: variant_id
        tests: [not_null]
      - name: price_list_id
        tests: [not_null]

  - name: stg_sapo_v2_variants
    columns:
      - name: variant_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]


  - name: src_sapo_v2_product_daily_snapshots
    description: >
      Nightly full capture of Sapo products, extracted from raw product_daily_snapshot. Grain: 1 row
      per (capture run, product); every capture is kept. Incremental on _dlt_load_id; empty when the
      raw table has no file yet (source_or_empty).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [capture_run_id, entity_id]
    columns:
      - name: entity_id
        tests: [not_null]
      - name: captured_at
        description: "UTC start of the capture run; one value per run."
        tests: [not_null]
      - name: capture_run_id
        tests: [not_null]

  - name: stg_sapo_v2_variant_price_captures
    description: "Captured prices. Grain: 1 row per (capture run, variant_id, price_list_id). Zero prices kept."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [capture_run_id, variant_id, price_list_id]
    columns:
      - name: variant_id
        tests: [not_null]
      - name: price_list_id
        tests: [not_null]
      - name: captured_at
        tests: [not_null]

  - name: stg_sapo_v2_inventory_position_captures
    description: "Captured stock positions. Grain: 1 row per (capture run, variant_id, location_id)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [capture_run_id, variant_id, location_id]
    columns:
      - name: variant_id
        tests: [not_null]
      - name: location_id
        tests: [not_null]
      - name: captured_at
        tests: [not_null]

  - name: stg_sapo_v2_variant_price_versions
    description: >
      Prices of every product version loaded into raw product (all ingest methods, not deduplicated).
      Grain: 1 row per (product version, variant_id, price_list_id); a version loaded several times
      appears several times. observed_at = version event_timestamp. Backfill evidence for price history.
    columns:
      - name: variant_id
        tests: [not_null]
      - name: price_list_id
        tests: [not_null]
      - name: observed_at
        tests: [not_null]
