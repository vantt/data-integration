version: 2

models:
  - name: int_sapo_inventories
    description: >
      Enriched inventory rows — one row per (variant_id, location_id) from the latest
      nightly Sapo product batch. Adds min_value, max_value, wait_to_pack fields
      (absent in stg_sapo_inventories) and denormalizes location_name/location_code
      from dim_branch_location. snapshot_date = CAST(source_timestamp AS DATE).
      CAVEAT: inventory.modified_on is always NULL in Sapo API — snapshot-only, no intra-day history.
    columns:
      - name: variant_id
        tests: [not_null]
      - name: location_id
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
      - name: sku
        tests: [not_null]
      - name: on_hand
        description: "Units physically in warehouse (can be negative for consignment locations)"
      - name: available
        description: "on_hand minus committed — units available to sell"
      - name: committed
        description: "Units reserved against open orders"
      - name: mac
        description: "Moving Average Cost per unit (VND). May be NULL for zero-cost or uncosted variants"
      - name: location_name
        description: "Denormalized from dim_branch_location; 'Unknown' when location_id not in registry"

  - name: int_order_snapshots_ranked
    description: >
      All history_log snapshots per order ranked by event_timestamp, with LAG columns
      exposing previous status/payment_status/fulfillment_status. Grain: one row per
      (order_id, event_timestamp). Used exclusively by fact_order_transitions.

  - name: int_return_sku_lines
    description: >
      Returns × SKU approximation (Case B). Grain: (return_id, product_key).
      CAVEAT: Sapo returns API is order-level only — no per-line-item breakdown.
      All SKUs present in a returned order are included. refund_amount_allocated
      is proportional by line revenue share within the order.
      Use for ranking / triage direction — not precise per-SKU refund accounting.
    columns:
      - name: return_sku_key
        description: "Surrogate key: MD5(return_id || product_key)"
        tests: [unique, not_null]
      - name: return_id
        tests: [not_null]
      - name: order_code
        tests: [not_null]
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: return_date
        tests: [not_null]
      - name: channel_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
              config:
                severity: warn
                where: "channel_key IS NOT NULL"
      - name: refund_amount_allocated
        description: "Proportional refund = (line_revenue / order_total_revenue) × return refund_amount"
      - name: refund_amount_order_total
        description: "Raw order-level refund amount (sanity check — should match SUM per return_id)"
