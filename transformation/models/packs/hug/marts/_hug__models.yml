version: 2

models:

  - name: mart_hug_attribution
    description: >
      HUG voucher redemption attribution. Grain: one row per HUG voucher
      (from stg_crm__hug_voucher). Redemption financials are enriched onto the
      voucher's order via order_code (1:1), and are VAT-EXCLUDED so the
      revenue/margin pair shares one base.
    columns:
      - name: order_code
        description: "Voucher's bound order code; join key to fact_orders / fact_order_economics. NULL until redeemed."
      - name: is_redeemed
        description: "TRUE when the voucher is bound to an order (order_code IS NOT NULL)."
      - name: redemption_revenue_vnd
        description: >
          Revenue of the redeemed order = fact_orders.net_revenue (after discount,
          VAT REMOVED). Deliberately NOT total_collected: VAT is a pass-through, not
          earnings, and including it would inflate revenue ~8-10% and distort the
          revenue/margin ratio (margin below is already VAT-net). NULL when not redeemed.
      - name: redemption_margin_vnd
        description: >
          Contribution margin of the redeemed order = fact_order_economics.channel_net_profit
          (net_revenue − COGS − channel fees; EXCLUDES overhead). Warehouse-canonical margin
          definition, same VAT-excluded base as redemption_revenue_vnd. NULL when not redeemed or when
          the redeemed order has no COGS (has_cogs FALSE: missing cost is not zero cost).
      - name: issued_date
        description: "Voucher issue date (ICT calendar date)."
      - name: redeemed_date
        description: "Voucher redemption date (ICT calendar date); NULL when not redeemed."


  # Hug
  - name: mart_hug_optin
    description: >
      Deduplicated Hug opt-in events ready for local identity resolution.
      Grain: one row per (token, phone) — latest opt-in wins. Zalo-only rows
      (NULL phone) are kept once per token. Consumed by the I2-resolve identity
      resolver which writes crm_identity_link + updates crm_party_identity.
    columns:
      - name: token
        description: "Opaque 12-char Crockford base32 token (the QR code payload)."
        tests: [not_null]
      - name: buyer_customer_id
        description: "Sapo customer_id from the token's order context; NULL when token was not yet bound to an order."
      - name: phone
        description: "Scanner's phone in VN local format (09...); NULL for Zalo-only opt-ins."
      - name: zalo_uid
        description: "Scanner's Zalo UID; NULL when not provided."
      - name: name
        description: "Scanner's display name from opt-in form; NULL when not provided."
      - name: consent_json
        description: "Raw JSON consent payload from the landing page."
      - name: event_ts
        description: "Timestamp of the opt-in event (UTC TIMESTAMPTZ); watermark column for incremental resolver runs."
      - name: ingested_at
        description: "Timestamp when the event was ingested from the D1 queue (UTC TIMESTAMPTZ)."

