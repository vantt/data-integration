version: 2

models:

  - name: fact_order_costs
    description: "Long-format cost ledger. Grain: 1 row per (order_id, cost_type). Source of truth for granular costs feeding fact_order_economics."
    columns:
      - name: order_id
        description: "Source system order identifier."
        tests: [not_null]
      - name: order_code
        description: "Source system order code from Sapo."
        tests: [not_null]
      - name: cost_type
        description: "Granular cost type (cogs, platform_payment, discount type, overhead_*)."
        tests: [not_null]
      - name: cost_category
        description: "Broad cost bucket: COGS, PLATFORM_FEE, DISCOUNT, or OVERHEAD."
        tests: [not_null]
      - name: amount
        description: "Always positive (ABS). Sign convention derived from cost_category."
      - name: source_system
        description: "Origin: sapo_mac | sapo_mac+misa | misa | shopee | sapo | derived | estimated | none"
      - name: source_record
        description: "Traceability key: voucher_no for MISA, order_code for Shopee, discount reason for Sapo"
      - name: fee_source
        description: "actual | estimated"
      - name: date_key
        description: "YYYYMMDD in ICT — inherited from fact_orders"
      - name: channel_key
        description: "Inherited from fact_orders"
      - name: discount_rate
        description: "Raw rate (0-100) from Sapo discount_items. NULL for COGS and platform fee rows. Note: always 0 for voucher_promotional (Sapo design). See: docs/architecture/order-pl/discount-classification.md"
      - name: discount_type
        description: "Semantic classification of this discount. NULL for COGS and platform fee rows. 'line_item' = item-level price reduction (no label). See: docs/architecture/order-pl/discount-classification.md"
        tests:
          - accepted_values:
              arguments:
                values: [voucher_promotional, bundle, sampling_gift, wholesale_explicit, overseas, campaign, employee_internal, negotiated_micro, negotiated_standard, negotiated_deep, line_item]
              config:
                where: "discount_type IS NOT NULL"


  - name: fact_order_economics
    data_tests:
      - pack_contract   # columns core reads (mart_data_quality): macros/packs/pack_contracts.sql
    description: "Per-order profitability: Sapo revenue + COGS (Sapo-MAC primary / MISA TK632 fallback) + Shopee platform fees. Grain: one row per order."
    columns:
      - name: order_id
        description: "Source system order identifier."
        tests: [unique, not_null]
      - name: order_code
        description: "Source system order code from Sapo."
        tests: [not_null]
      - name: channel_key
        description: "Foreign key to `dim_channels`."
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: date_key
        description: "Date dimension foreign key (ICT timezone)."
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: status
        description: "Trạng thái đơn hàng (từ fact_orders)"
      - name: gross_revenue
        description: "Giá bán × SL trước chiết khấu (ĐÃ GỒM VAT). WARNING: VAT-INCLUSIVE — not pre-tax gross revenue."
      - name: net_revenue
        description: "Doanh thu thuần (sau chiết khấu, ĐÃ TRỪ VAT)"
        tests: [not_null]
      - name: cogs_amount
        description: "Giá vốn hàng bán (primary: Sapo-MAC moving-avg cost; fallback: MISA TK632). NULL nếu không có dữ liệu COGS."
      - name: has_cogs
        description: "true nếu đơn có dữ liệu COGS (sapo_mac, misa, or both). Alias: cogs_source IS NOT NULL AND cogs_source != 'none'."
      - name: cogs_source
        description: "COGS data source: 'sapo_mac' (Sapo-MAC only) | 'misa' (MISA-632 only) | 'both' (both systems) | 'none' (no COGS). Drives recon panel in detailView."
        tests:
          - accepted_values:
              arguments:
                values: ['sapo_mac', 'misa', 'both', 'none']
              config:
                where: "cogs_source IS NOT NULL"
      - name: gross_profit
        description: "Lãi gộp = net_revenue - COGS. NULL khi không có COGS (has_cogs=FALSE) — luôn filter WHERE has_cogs trước khi SUM để tránh thổi phồng margin."
      - name: gross_margin_pct
        description: "Biên lãi gộp = gross_profit / net_revenue"
      - name: shopee_platform_fees
        description: "Phí sàn cơ bản (service + payment + fixed + affiliate). NULL cho non-Shopee."
      - name: shopee_infra_fee
        description: "Phí hạ tầng Shopee (từ Service Fee Details sheet). NULL cho non-Shopee."
      - name: shopee_voucher_xtra_fee
        description: "Phí Voucher Xtra (từ Service Fee Details sheet). NULL cho non-Shopee."
      - name: shopee_taxes
        description: "VAT + thuế TNCN Shopee. NULL cho non-Shopee."
      - name: shopee_net_settlement
        description: "Số tiền Shopee thực chuyển về. NULL cho non-Shopee."
      - name: has_platform_fees
        description: "true nếu đơn có dữ liệu phí platform (hiện tại: Shopee; mở rộng khi thêm Lazada/TikTok)"
      - name: channel_net_profit
        description: "Lãi ròng kênh = net_revenue - COGS - all Shopee fees"
      - name: channel_net_margin_pct
        description: "Biên lãi ròng kênh = channel_net_profit / net_revenue"
      - name: allocated_overhead
        description: "Tier-3 G&A overhead allocated to this order proportionally by gross_profit share (from int_order_overhead_allocation). NULL when no overhead pool exists for the period."
      - name: is_overhead_estimated
        description: "TRUE if the overhead pool used a budgeted rate (MISA month not yet closed); FALSE when actual MISA data was available."
      - name: fully_loaded_net_profit
        description: "Lãi ròng đầy đủ = channel_net_profit - promo_goods_cost - allocated_overhead. NULL when allocated_overhead is NULL (overhead pool not yet available for the period)."
      - name: fully_loaded_margin_pct
        description: "Biên lãi ròng đầy đủ = fully_loaded_net_profit / net_revenue. NULL when net_revenue = 0 or allocated_overhead is NULL."
      - name: promo_goods_cost
        description: "Chi phí hàng khuyến mãi/quà tặng (revenue=0 lines) định giá theo Sapo-MAC. Marketing cost — KHÔNG phải COGS; không trừ vào gross_profit nhưng trừ vào fully_loaded_net_profit."
      - name: cod_amount
        description: "Giá trị COD thu hộ từ người mua (từ đơn giao hàng đầu tiên)"
      - name: carrier_id
        description: "Đơn vị vận chuyển (GHTK, J&T, GHN, VTP, ...) từ đơn giao hàng đầu tiên"
      - name: return_amount
        description: "Tổng giá trị hoàn trả của đơn (từ fact_order_returns). NULL nếu không có hoàn trả. Không ảnh hưởng channel_net_profit — P&L hoàn trả được ghi nhận tại ngày hoàn trả."
      - name: return_count
        description: "Số lần hoàn trả của đơn"
      - name: has_returns
        description: "true nếu đơn có ít nhất 1 lần hoàn trả"


  - name: mart_sku_economics_monthly
    description: >
      Single source of truth for SKU-level economics at monthly grain.
      One row per (product_key, snapshot_month). Rolling 24-month window for YoY.
      Combines Sapo sales volume (fact_sales) + MISA COGS (int_misa_sales_lines) +
      returns (int_return_sku_lines). COGS columns are NULL for ~35% of orders
      without a MISA invoice match. return_adjusted_margin_pct uses worst-case
      (full refund, no COGS recovery).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_key, snapshot_month]
      - pack_contract   # columns core reads (mart_product_health): macros/packs/pack_contracts.sql
    columns:
      - name: product_key
        description: "Foreign key to dim_products."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: product_code
        description: "Sapo SKU code for the product variant."
      - name: product_name
        description: "Display name of the product."
      - name: snapshot_month
        description: "First day of the reporting month (month-start DATE)."
        tests: [not_null]
      - name: units_sold
        description: "Total units sold in the month across all confirmed orders."
        tests: [not_null]
      - name: net_revenue
        description: "VAT-exclusive net revenue for this SKU in the month."
        tests: [not_null]
      - name: order_count
        description: "Count of distinct orders containing this SKU in the month."
        tests: [not_null]
      - name: daily_velocity
        description: "Average units sold per selling day (units_sold / days_with_sales)."
      - name: cogs_amount
        description: "Total COGS from MISA for this SKU in the month. NULL when no MISA invoice match."
      - name: cogs_per_unit
        description: "Average COGS per unit (cogs_amount / units_sold). NULL when no MISA data."
      - name: gross_profit
        description: "Gross profit = MISA net revenue − COGS. NULL when no MISA data."
      - name: gross_margin_pct
        description: "Gross margin % based on MISA revenue. NULL when no MISA data."
        meta:
          deprecated: true
          use_instead: realized_margin_pct
          reason: "Uses MISA book revenue as denominator; H010 SKUs (~5 SKUs) have ~2× COGS error uncorrected here. realized_margin_pct uses Sapo net_revenue and has the H010 fix applied."
      - name: realized_gross_profit
        description: "Commercial gross profit = Sapo net_revenue − cogs_amount. Preferred over gross_profit for pricing/dashboards (CAVEAT #7 in SQL)."
      - name: realized_margin_pct
        description: "Commercial margin % = (net_revenue − cogs_amount) / net_revenue. Uses actual Sapo selling price. Prefer over gross_margin_pct for pricing decisions. COGS correctness depends on misa_qty_multiplier in seed_sku_alias_manual (H010 SKUs fixed 2026-06-10)."
      - name: cogs_per_unit_3m_avg
        description: "Trailing 3-month average COGS per unit for trend comparison."
      - name: cogs_variance_pct
        description: "Percentage change in cogs_per_unit vs 3-month trailing average."
      - name: return_count
        description: "Count of return events attributed to this SKU in the month."
        tests: [not_null]
      - name: return_quantity
        description: "Total units returned for this SKU in the month."
        tests: [not_null]
      - name: refund_amount_allocated
        description: "Refund value allocated to this SKU proportionally by line revenue."
        tests: [not_null]
      - name: return_rate
        description: "Return count / order_count for this SKU in the month."
      - name: return_adjusted_gross_profit
        description: "Gross profit minus full refund (worst-case; no COGS recovery assumed)."
      - name: return_adjusted_margin_pct
        description: "Gross margin % after deducting full refund amount (conservative lower bound)."
      - name: days_since_last_sale
        description: "Days from last observed sale to month-end within the snapshot window."
      - name: is_slow_mover
        description: "True when no sale in the final 14 days of the month AND not a top-200 SKU by revenue."
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "is_slow_mover IS NOT NULL"
      - name: revenue_share_pct
        description: "This SKU's net_revenue as a % of total revenue across all SKUs in the month."
      - name: margin_outlier
        description: "True when COGS data exists and gross_margin_pct is below 10%."
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "margin_outlier IS NOT NULL"
      - name: top_channel_name
        description: "Name of the channel that generated the highest revenue for this SKU in the month."
      - name: top_channel_revenue_pct
        description: "Percentage of this SKU's revenue that came from the top channel."

