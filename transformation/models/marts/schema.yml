version: 2

models:
  # US Shipment
  - name: fact_us_shipment_economics
    description: >
      US CrossBorder order economics — actual deal revenue from the US Shipment Price List.
      Grain: one row per US order (order_id). Sapo records US prices as 0; use this mart
      for all US revenue reporting instead of fact_orders.net_revenue.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_code
        tests: [not_null]
      - name: total_us_revenue_excl_vat
        description: "Sum of (quantity × us_price_excl_vat) across all line items"
      - name: total_us_revenue_incl_vat
        description: "Sum of (quantity × us_price_incl_vat) across all line items"
      - name: has_unpriced_sku
        description: "TRUE if any line item had no matching price in the price list"

  # Fulfillments / Shipments
  - name: fact_fulfillments
    description: >
      Per-shipment fact — one row per Sapo fulfillment (shipment leg). Sourced from
      std_fulfillments; order_code resolved via fact_orders.order_id. Enables order
      lookup by shipment code / id / tracking code, and the Shipments section in the
      detailView app.
    columns:
      - name: fulfillment_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: order_code
        description: "Resolved from fact_orders via order_id (nullable if order absent from mart)"
      - name: tracking_code
        description: "Carrier tracking number"
      - name: status
        description: "DELIVERED / SHIPPING / PACKED / CANCELLED / FAILED / PENDING"

  # Observability
  - name: mart_data_quality
    description: >
      Single-row (dq_key='global') system data-quality / coverage snapshot powering the
      detailView "Data health" surface: COGS & platform-fee coverage, fulfillment / return /
      US rates, carrier & acquisition NULL rates. Recomputed each pipeline run.
    columns:
      - name: dq_key
        tests: [unique, not_null]

  # Dimensions
  - name: dim_channel_targets
    description: >
      Channel-level budget/target dimension. One row per (channel_key, period_month,
      metric_type, target_source). Built from seed_channel_targets CSV; channel_key
      resolved via join to dim_channels by channel_name.
      metric_type: NET_REVENUE (VND), NET_MARGIN_PCT (%), ORDER_COUNT (count).
    columns:
      - name: channel_target_key
        tests: [unique, not_null]
      - name: channel_key
        tests: [not_null]
      - name: period_month
        tests: [not_null]
      - name: metric_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NET_REVENUE', 'NET_MARGIN_PCT', 'ORDER_COUNT']
      - name: target_source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BUDGET', 'STRETCH', 'MIN_VIABLE']
      - name: target_value
        tests: [not_null]

  - name: dim_customers
    description: "Customer dimension with 8 segmentation dimensions. See docs/context/customer-segmentation.md"
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: customer_type
        description: "Commercial relationship type (Manual from Sapo TYPE_* groups)"
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['RETAIL', 'WHOLESALE', 'PARTNER', 'STAFF', 'KOL']
      - name: value_group
        description: "Customer value tier (Auto): VALUE_VIP (>=50M or >=20 orders), VALUE_GOLD (>=20M), VALUE_SILVER (>=5M), VALUE_BRONZE (else)"
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['VALUE_VIP', 'VALUE_GOLD', 'VALUE_SILVER', 'VALUE_BRONZE']
      - name: lifecycle_stage
        description: "Customer lifecycle state (Auto): NEW (<=30 days & <=2 orders), ACTIVE (<=90 days), AT_RISK (<=180 days), CHURNED (>180 days)"
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['LIFECYCLE_NEW', 'LIFECYCLE_ACTIVE', 'LIFECYCLE_AT_RISK', 'LIFECYCLE_CHURNED']
      - name: channel_preference
        description: "Preferred purchase channel (Auto): CHANNEL_SOCIAL/MARKETPLACE/DIRECT/OFFLINE/OTHER based on mode of channel_format"
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['CHANNEL_SOCIAL', 'CHANNEL_MARKETPLACE', 'CHANNEL_DIRECT', 'CHANNEL_OFFLINE', 'CHANNEL_OTHER']
      - name: product_affinity
        description: "Primary brand preference (Auto): Brand with >60% revenue share, else PRODUCT_MULTI"
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['PRODUCT_FINE_JAPAN', 'PRODUCT_FG_CARE', 'PRODUCT_FINE_CARE', 'PRODUCT_MULTI']
      - name: payment_behavior
        description: "Payment pattern (Auto): PAYMENT_COD if >70% COD orders, else PAYMENT_PREPAID"
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['PAYMENT_PREPAID', 'PAYMENT_COD', 'PAYMENT_CREDIT', 'PAYMENT_DELINQUENT']
      - name: geo_region
        description: "Geographic region (Auto): GEO_HCMC/HANOI/MEKONG/CENTRAL/OTHER based on province"
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['GEO_HCMC', 'GEO_HANOI', 'GEO_MEKONG', 'GEO_CENTRAL', 'GEO_OTHER']
      - name: acquisition_source
        description: "Customer acquisition channel (Manual): SOURCE_ORGANIC/ADS/REFERRAL/KOL/EVENT. NULL until Sapo implementation."
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['SOURCE_ORGANIC', 'SOURCE_ADS', 'SOURCE_REFERRAL', 'SOURCE_KOL', 'SOURCE_EVENT']
              config:
                where: "acquisition_source IS NOT NULL"
      - name: lifetime_value
        description: "Total collected from customer (after discounts, incl. tax). Formula: SUM(fact_orders.total_collected)"
      - name: recency_days
        description: "Days since last order. Formula: CURRENT_DATE - MAX(order_date)"
      - name: customer_status
        description: "DEPRECATED: Use lifecycle_stage. Legacy RFM Status: Active/At Risk/Churned"

  - name: dim_customers_base
    description: "Base customer dimension (SCD Type 1) without circular dependencies."
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: birth_date
        description: "Date of Birth"
      - name: gender
        description: "Gender of the customer"
      - name: customer_group
        description: "Customer Group Code/Name"
      - name: loyalty_points
        description: "Loyalty points balance"


  - name: dim_products
    description: "Product dimension derived from sales."
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: brand_name
        description: "Standardized product brand name"
        data_type: varchar
      - name: brand_code
        description: "Product brand abbreviation code"
        data_type: varchar

  - name: dim_channels
    description: "Sales channel dimension."
    columns:
      - name: channel_key
        tests: [unique, not_null]
      - name: channel_name
        data_type: varchar
      - name: channel_code
        data_type: varchar
      - name: channel_category
        description: "Tier 1. Online-Ecommerce / Offline / Internal."
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['Online-Ecommerce', 'Offline', 'Internal']
      - name: channel_format
        description: "Tier 2. Marketplace / Social / Web / Retail / B2B / Direct / System / CrossBorder Fulfillment / Other."
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['Marketplace', 'Social', 'Web', 'Retail', 'B2B', 'Direct', 'System', 'CrossBorder Fulfillment', 'Other']
      - name: platform
        data_type: varchar
      - name: channel_brand
        description: "Brand that owns this channel"
        data_type: varchar
      - name: market
        description: "Domestic / Export"
        data_type: varchar
      - name: source_type
        description: "Source classification: channel, customer_type, team, purpose, arrangement"
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['channel', 'customer_type', 'team', 'purpose', 'arrangement']
      - name: is_sales_channel
        description: "true = real sales channel (not System/Internal)"
        data_type: boolean

  - name: dim_staff
    description: "Salesperson/Staff dimension."
    columns:
      - name: staff_key
        tests: [unique, not_null]

  - name: dim_teams
    description: "Sales team dimension. See docs/context/team-management.md"
    columns:
      - name: team_key
        tests: [unique, not_null]
      - name: team_code
        description: "Team code (PK from Google Sheet)"
        data_type: varchar
        tests: [unique, not_null]
      - name: team_name
        description: "Team display name"
        data_type: varchar
      - name: revenue_type
        description: "How team revenue is calculated: member, platform, channel_name"
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['member', 'platform', 'channel_name']
      - name: revenue_filter
        description: "Comma-separated filter values (for platform/channel_name types)"
        data_type: varchar
      - name: active_member_count
        description: "Count of currently active team members"
        data_type: integer

  - name: dim_time
    description: "Time dimension (Minute grain) with business hour flags."
    columns:
      - name: time_key
        description: "Integer HHMM (e.g., 0930, 2359)"
        tests: [unique, not_null]
      - name: time_of_day_24
        description: "HH:MM format"
      - name: time_of_day_12
        description: "HH:MM AM/PM format"
      - name: hour_24
        description: "Hour of day (0-23)"
      - name: is_business_hour
        description: "Boolean: Is between 09:00 and 17:00"
      - name: is_peak_hour
        description: "Boolean: Is Lunch (11-14) or Dinner (16-19)"
      - name: day_period
        description: "Morning, Afternoon, Evening, Night"

  - name: dim_date
    description: "Calendar date dimension."
    columns:
      - name: date_key
        description: "Integer date key (YYYYMMDD)"
        tests: [unique, not_null]
      - name: date_actual
        description: "Actual date value"

  - name: dim_branch_location
    description: "Location/Warehouse dimension."
    columns:
      - name: branch_location_key
        tests: [unique, not_null]

  - name: dim_payment_methods
    description: "Payment method dimension."
    columns:
      - name: payment_method_key
        tests: [unique, not_null]

  - name: dim_order_status
    description: "Order status dimension (Static)."
    columns:
      - name: status_key
        tests: [unique, not_null]

  - name: dim_product_types
    description: "Product type dimension."
    columns:
      - name: product_type_key
        tests: [unique, not_null]

  - name: dim_promotions
    description: "Promotion dimension."
    columns:
      - name: promotion_key
        tests: [unique, not_null]

  - name: dim_geography
    description: "Geography dimension."
    columns:
      - name: geography_key
        tests: [unique, not_null]

  # Facts
  - name: fact_sales
    description: "Transactional sales fact (line item grain)."
    columns:
      - name: order_id
        tests: [not_null]
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: product_type_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product_types')
                field: product_type_key
      - name: seller_staff_key
        description: "Người chốt/được giao đơn (Sapo assignee). Primary for team attribution & commission."
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: creator_staff_key
        description: "Người tạo đơn trên Sapo (Sapo account). Operational; use as fallback only."
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: team_key
        description: "Team attribution via seller email → team_members (SCD2)"
        tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: status_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_order_status')
                field: status_key
      - name: customer_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers_base')
                field: customer_key
      - name: branch_location_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_branch_location')
                field: branch_location_key
      - name: channel_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: shipping_geography_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: billing_geography_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: time_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: net_revenue
        description: "VAT-exclusive line net revenue (VAT-strip of line_amount using per-order tax ratio)"
      - name: discount_amount
        description: "Direct discount amount"
      - name: distributed_discount_amount
        description: "Distributed discount amount"

  - name: fact_orders
    description: "Aggregated order fact."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers_base')
                field: customer_key
      - name: shipping_geography_key
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
              config:
                severity: warn
      - name: billing_geography_key
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
              config:
                severity: warn
      - name: channel_key
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: promotion_key
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_promotions')
                field: promotion_key
              config:
                severity: warn
      - name: seller_staff_key
        data_type: varchar
        description: "Người chốt/được giao đơn (Sapo assignee). Primary for team attribution & commission."
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: creator_staff_key
        data_type: varchar
        description: "Người tạo đơn trên Sapo (Sapo account). Operational; use as fallback only."
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: team_key
        data_type: varchar
        description: "Team attribution via seller email → team_members (SCD2)"
        tests:
          - relationships:
              arguments:
                to: ref('dim_teams')
                field: team_key
      - name: status_key
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_order_status')
                field: status_key
      - name: branch_location_key
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_branch_location')
                field: branch_location_key
      - name: date_key
        data_type: integer
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: time_key
        data_type: integer
        tests:
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: gross_revenue
        description: "Giá bán × SL (trước chiết khấu & thuế). Formula: net_revenue + discount_amount"
      - name: discount_amount
        description: "Tổng chiết khấu (coupon, promotion, combo)"
      - name: net_revenue
        description: "Doanh thu thuần (sau chiết khấu, trước thuế). Field gốc từ Sapo $.total"
      - name: vat_amount
        description: "Thuế VAT (8% hoặc 10%) nhúng trong giá bán Sapo ($.total_tax)"
      - name: total_collected
        description: "Tổng thu từ khách (sau chiết khấu, gồm thuế). Formula: net_revenue + vat_amount"
      - name: client_info
        description: "JSON details about client (IP, User Agent)"
      - name: discount_codes
        description: "JSON list of discount codes"
      - name: max_discount_rate
        description: "Highest discount_rate (0-100) across all discount items on this order. NULL for orders with no discount_items. See: docs/architecture/discount-classification.md"
      - name: primary_discount_type
        description: "discount_type of the highest-amount discount item on this order. NULL for orders with no discounts. See: docs/architecture/discount-classification.md"
        tests:
          - accepted_values:
              arguments:
                values: [voucher_promotional, bundle, sampling_gift, wholesale_explicit, overseas, campaign, employee_internal, negotiated_micro, negotiated_standard, negotiated_deep]
              config:
                where: "primary_discount_type IS NOT NULL"

  - name: fact_payments
    description: "Transactional payment fact (one row per payment attempt/transaction)."
    columns:
      - name: payment_key
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: payment_method_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_payment_methods')
                field: payment_method_key
      - name: amount
        description: "Transaction amount"
      - name: status
        description: "Payment status (paid, pending, etc)"
      - name: payment_timestamp
        description: "Time of payment creation"
      - name: paid_on
        description: "Time of payment completion"

  - name: fact_order_economics
    description: "Per-order profitability: Sapo revenue + MISA COGS + Shopee platform fees. Grain: one row per order."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_code
        tests: [not_null]
      - name: channel_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: status
        description: "Trạng thái đơn hàng (từ fact_orders)"
      - name: gross_revenue
        description: "Giá bán × SL (trước chiết khấu & thuế)"
      - name: net_revenue
        description: "Doanh thu thuần (sau chiết khấu, trước thuế)"
        tests: [not_null]
      - name: cogs_amount
        description: "Giá vốn hàng bán (từ MISA). NULL nếu chưa có dữ liệu MISA."
      - name: has_cogs
        description: "true nếu đơn có dữ liệu COGS từ MISA"
      - name: gross_profit
        description: "Lãi gộp = net_revenue - COGS. Nếu không có COGS thì = net_revenue."
      - name: gross_margin_pct
        description: "Biên lãi gộp = gross_profit / net_revenue"
      - name: shopee_platform_fees
        description: "Phí sàn cơ bản (service + payment + fixed + affiliate). NULL cho non-Shopee."
      - name: shopee_infra_fee
        description: "Phí hạ tầng Shopee (từ Service Fee Details sheet). NULL cho non-Shopee."
      - name: shopee_voucher_xtra_fee
        description: "Phí Voucher Xtra (từ Service Fee Details sheet). NULL cho non-Shopee."
      - name: shopee_taxes
        description: "VAT + thuế TNCN Shopee. NULL cho non-Shopee."
      - name: shopee_net_settlement
        description: "Số tiền Shopee thực chuyển về. NULL cho non-Shopee."
      - name: has_platform_fees
        description: "true nếu đơn có dữ liệu phí platform (hiện tại: Shopee; mở rộng khi thêm Lazada/TikTok)"
      - name: channel_net_profit
        description: "Lãi ròng kênh = net_revenue - COGS - all Shopee fees"
      - name: channel_net_margin_pct
        description: "Biên lãi ròng kênh = channel_net_profit / net_revenue"
      - name: cod_amount
        description: "Giá trị COD thu hộ từ người mua (từ đơn giao hàng đầu tiên)"
      - name: carrier_id
        description: "Đơn vị vận chuyển (GHTK, J&T, GHN, VTP, ...) từ đơn giao hàng đầu tiên"
      - name: return_amount
        description: "Tổng giá trị hoàn trả của đơn (từ fact_order_returns). NULL nếu không có hoàn trả. Không ảnh hưởng channel_net_profit — P&L hoàn trả được ghi nhận tại ngày hoàn trả."
      - name: return_count
        description: "Số lần hoàn trả của đơn"
      - name: has_returns
        description: "true nếu đơn có ít nhất 1 lần hoàn trả"

  - name: fact_order_costs
    description: "Long-format cost ledger. Grain: 1 row per (order_id, cost_type). Source of truth for granular costs feeding fact_order_economics."
    columns:
      - name: order_id
        tests: [not_null]
      - name: order_code
        tests: [not_null]
      - name: cost_type
        tests: [not_null]
      - name: cost_category
        tests: [not_null]
      - name: amount
        description: "Always positive (ABS). Sign convention derived from cost_category."
      - name: source_system
        description: "Origin system: misa | shopee | sapo"
      - name: source_record
        description: "Traceability key: voucher_no for MISA, order_code for Shopee, discount reason for Sapo"
      - name: fee_source
        description: "actual | estimated"
      - name: date_key
        description: "YYYYMMDD in ICT — inherited from fact_orders"
      - name: channel_key
        description: "Inherited from fact_orders"
      - name: discount_rate
        description: "Raw rate (0-100) from Sapo discount_items. NULL for COGS and platform fee rows. Note: always 0 for voucher_promotional (Sapo design). See: docs/architecture/discount-classification.md"
      - name: discount_type
        description: "Semantic classification of this discount. NULL for COGS and platform fee rows. See: docs/architecture/discount-classification.md"
        tests:
          - accepted_values:
              arguments:
                values: [voucher_promotional, bundle, sampling_gift, wholesale_explicit, overseas, campaign, employee_internal, negotiated_micro, negotiated_standard, negotiated_deep]
              config:
                where: "discount_type IS NOT NULL"

  - name: fact_order_returns
    description: "Per-return fact: one row per Sapo return event. Returns recognized at return date — original order P&L is not restated."
    columns:
      - name: return_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: order_code
        tests: [not_null]
      - name: returned_at
        description: "Thời điểm hoàn trả (issued_at hoặc created_at)"
      - name: return_date
        description: "Ngày hoàn trả tính theo múi giờ ICT"
      - name: refund_amount
        description: "Giá trị hoàn tiền (từ Sapo total_amount của return)"
      - name: return_quantity
        description: "Số lượng sản phẩm hoàn trả"
      - name: return_status
        description: "Trạng thái hoàn trả từ Sapo"
      - name: refund_status
        description: "Trạng thái hoàn tiền từ Sapo"
      - name: return_reason
        description: "Lý do hoàn trả (reason hoặc note từ Sapo)"
      - name: channel_key
        description: "NULL for legacy orders whose order_code is not found in fact_orders (expected for historical returns)"
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
              config:
                severity: warn
                where: "channel_key IS NOT NULL"
      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: mart_sku_economics_monthly
    description: >
      Single source of truth for SKU-level economics at monthly grain.
      One row per (product_key, snapshot_month). Rolling 24-month window for YoY.
      Combines Sapo sales volume (fact_sales) + MISA COGS (int_misa_sales_lines) +
      returns (int_return_sku_lines). COGS columns are NULL for ~35% of orders
      without a MISA invoice match. return_adjusted_margin_pct uses worst-case
      (full refund, no COGS recovery).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_key, snapshot_month]
    columns:
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: snapshot_month
        tests: [not_null]
      - name: units_sold
        tests: [not_null]
      - name: net_revenue
        tests: [not_null]
      - name: order_count
        tests: [not_null]
      - name: return_count
        tests: [not_null]
      - name: return_quantity
        tests: [not_null]
      - name: refund_amount_allocated
        tests: [not_null]
      - name: is_slow_mover
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "is_slow_mover IS NOT NULL"
      - name: margin_outlier
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
              config:
                where: "margin_outlier IS NOT NULL"

  - name: fact_inventory_snapshot
    description: >
      Daily inventory snapshot. Grain: 1 row per (variant_id, location_id, snapshot_date).
      Incremental external parquet — appends each day, never deletes (retention: forever).
      snapshot_date = date of the nightly Sapo product batch run (3am ICT).
      3 physical locations only: 452566 (Trương Định), 494912 (Hậu Giang), 624127 (MM Market An Phú).
      mac-derived stock values are estimates only — not accounting-grade.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [variant_id, location_id, snapshot_date]
    columns:
      - name: inventory_snapshot_key
        tests: [unique, not_null]
      - name: variant_id
        tests: [not_null]
      - name: location_id
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
      - name: sku
        tests: [not_null]
      - name: on_hand
        description: "Units physically on hand; can be negative for consignment locations"
      - name: available
        description: "on_hand minus committed"
      - name: committed
        description: "Units reserved for open orders"
      - name: mac
        description: "Moving Average Cost per unit (VND). NULL for uncosted variants"
      - name: stock_value_at_mac
        description: "on_hand × mac when both are present and on_hand > 0, else 0"
      - name: committed_value_at_mac
        description: "committed × mac when both present and committed > 0, else 0"

  - name: mart_inventory_health
    description: >
      Derived inventory health signals. Grain: 1 row per (variant_id, location_id, snapshot_date).
      Full rebuild — joins fact_inventory_snapshot (all dates) × latest velocity from
      mart_sku_economics_monthly. Boolean health flags: is_oos, is_low_stock, is_overstock,
      is_slow_mover, is_dead_stock. Velocity sourced from last completed month per SKU.
    columns:
      - name: inventory_snapshot_key
        tests: [not_null]
      - name: variant_id
        tests: [not_null]
      - name: location_id
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
      - name: is_oos
        description: "true when on_hand <= 0"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_low_stock
        description: "true when 0 < on_hand <= min_value (only when min_value is configured)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_overstock
        description: "true when on_hand > max_value (only when max_value is configured)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_slow_mover
        description: "true when days_of_supply > 90 OR no sale in last 30 days"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_dead_stock
        description: "true when no sale in last 90 days (proxy via mart_sku_economics_monthly)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: days_of_supply
        description: "on_hand / daily_velocity. NULL when no sales history. 0 when on_hand <= 0"
      - name: daily_velocity
        description: "Units/day from last completed month in mart_sku_economics_monthly. NULL for new/unsold SKUs"
      - name: stock_value_at_mac
        description: "Inherited from fact_inventory_snapshot"
      - name: committed_value_at_mac
        description: "Inherited from fact_inventory_snapshot"
      - name: slow_mover_value_at_risk
        description: "stock_value_at_mac when is_slow_mover, else 0"
      - name: dead_stock_value_at_risk
        description: "stock_value_at_mac when is_dead_stock, else 0"

  - name: dim_price_lists
    description: >
      Reference dimension for the 17 Sapo price lists.
      Grain: 1 row per price_list_id. Stable — changes only when Sapo admin adds/removes price lists.
      is_cost=true → GIANHAP only (import/cost price; reliable COGS proxy for ~10% SKUs not in MISA).
      is_default=true → BANLE (standard retail price list).
      Source: variant_prices embedded in product batch_sync parquet (more complete than src_sapo_price_lists).
    columns:
      - name: price_list_id
        tests: [unique, not_null]
      - name: code
        tests: [not_null]
      - name: name
        tests: [not_null]
      - name: currency_iso
        tests: [not_null]
      - name: is_cost
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_default
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: fact_variant_prices_snapshot
    description: >
      Daily snapshot of variant prices per price list.
      Grain: 1 row per (variant_id × price_list_id × snapshot_date).
      Only non-zero prices stored (value=0 means channel not configured for this SKU).
      Incremental external parquet — appends today's snapshot, never overwrites historical prices.
      snapshot_date = dbt run date (CURRENT_DATE), not Sapo product modified_on.
      gianhap_cost denormalized per row for inline margin calcs without self-join.
      17 price lists × ~682 variants × 365 days ≈ 4.2M rows/year.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [variant_id, price_list_id, snapshot_date]
    columns:
      - name: variant_id
        tests: [not_null]
      - name: price_list_id
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
      - name: price_value
        description: "Channel price in VND. Always > 0 (zero-price rows excluded)."
        tests: [not_null]
      - name: price_incl_tax
        description: "Price including VAT. Equals price_value when tax_included=false on variant."
      - name: is_cost
        description: "true only for GIANHAP price list — Sapo-native import/cost price."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: gianhap_cost
        description: "GIANHAP import price for this variant. NULL when GIANHAP not set (value=0) for the SKU."
      - name: implied_gross_margin_pct
        description: "((price_value - gianhap_cost) / price_value) × 100. NULL for cost rows or when gianhap_cost=0."
      - name: is_below_cost
        description: "true when price_value < gianhap_cost for a non-cost price list. Pricing compliance flag."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
