version: 2

seeds:
  - name: seed_action_scenario_registry
    description: >
      Enable/disable switch for action_type output, per (action_type, mart) — lets
      a scenario be toggled off at the output layer without an SQL branching change.
      Missing registry row defaults to enabled (COALESCE(reg.enabled, TRUE) = TRUE)
      so a mart-name typo or unregistered action_type never silently drops existing
      output. `enabled` is explicitly typed boolean in dbt_project.yml (DuckDB seed
      inference otherwise loads it as VARCHAR, breaking the COALESCE comparison).
      Consumed by mart_customer_sku_action_queue and mart_customer_action_queue.
    columns:
      - name: action_type
        data_type: varchar
        tests: [not_null]
      - name: mart
        data_type: varchar
        description: "Consuming mart name — 'mart_customer_sku_action_queue' or 'mart_customer_action_queue'."
        tests: [not_null]
      - name: enabled
        data_type: boolean
        tests: [not_null]
      - name: scenario_group
        data_type: varchar
      - name: description_vi
        data_type: varchar
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [action_type, mart]

models:
  # Customer — opportunity taxonomy passthrough
  - name: dim_action_scenario_registry
    description: >
      Passthrough of seed_action_scenario_registry into the serving layer — the CRM app's
      reverse-ETL cannot see dbt seeds directly (seeds never produce a rolling/ parquet
      folder), so this leaf model exposes the same (action_type, mart) taxonomy + Vietnamese
      labels for the Customer 360 "Cài đặt gợi ý" suppression panel. No filtering, no
      renaming — seed stays the single source of truth.
    columns:
      - name: action_type
        data_type: varchar
        tests: [not_null]
      - name: mart
        data_type: varchar
        description: "'mart_customer_sku_action_queue' or 'mart_customer_action_queue'."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['mart_customer_sku_action_queue', 'mart_customer_action_queue']
      - name: enabled
        data_type: boolean
        tests: [not_null]
      - name: scenario_group
        data_type: varchar
      - name: description_vi
        data_type: varchar
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [action_type, mart]

  # Hug
  - name: mart_hug_optin
    description: >
      Deduplicated Hug opt-in events ready for local identity resolution.
      Grain: one row per (token, phone) — latest opt-in wins. Zalo-only rows
      (NULL phone) are kept once per token. Consumed by the I2-resolve identity
      resolver which writes crm_identity_link + updates crm_party_identity.
    columns:
      - name: token
        description: "Opaque 12-char Crockford base32 token (the QR code payload)."
        tests: [not_null]
      - name: buyer_customer_id
        description: "Sapo customer_id from the token's order context; NULL when token was not yet bound to an order."
      - name: phone
        description: "Scanner's phone in VN local format (09...); NULL for Zalo-only opt-ins."
      - name: zalo_uid
        description: "Scanner's Zalo UID; NULL when not provided."
      - name: name
        description: "Scanner's display name from opt-in form; NULL when not provided."
      - name: consent_json
        description: "Raw JSON consent payload from the landing page."
      - name: event_ts
        description: "Timestamp of the opt-in event (UTC TIMESTAMPTZ); watermark column for incremental resolver runs."
      - name: ingested_at
        description: "Timestamp when the event was ingested from the D1 queue (UTC TIMESTAMPTZ)."

  - name: mart_hug_attribution
    description: >
      HUG voucher redemption attribution. Grain: one row per HUG voucher
      (from stg_crm__hug_voucher). Redemption financials are enriched onto the
      voucher's order via order_code (1:1), and are VAT-EXCLUDED so the
      revenue/margin pair shares one base.
    columns:
      - name: order_code
        description: "Voucher's bound order code; join key to fact_orders / fact_order_economics. NULL until redeemed."
      - name: is_redeemed
        description: "TRUE when the voucher is bound to an order (order_code IS NOT NULL)."
      - name: redemption_revenue_vnd
        description: >
          Revenue of the redeemed order = fact_orders.net_revenue (after discount,
          VAT REMOVED). Deliberately NOT total_collected: VAT is a pass-through, not
          earnings, and including it would inflate revenue ~8-10% and distort the
          revenue/margin ratio (margin below is already VAT-net). NULL when not redeemed.
      - name: redemption_margin_vnd
        description: >
          Contribution margin of the redeemed order = fact_order_economics.channel_net_profit
          (net_revenue − COGS − channel fees; EXCLUDES overhead). Warehouse-canonical margin
          definition, same VAT-excluded base as redemption_revenue_vnd. NULL when not redeemed.
      - name: issued_date
        description: "Voucher issue date (ICT calendar date)."
      - name: redeemed_date
        description: "Voucher redemption date (ICT calendar date); NULL when not redeemed."

  # US Shipment
  - name: fact_us_shipment_economics
    description: >
      US CrossBorder order economics — actual deal revenue from the US Shipment Price List.
      Grain: one row per US order (order_id). Sapo records US prices as 0; use this mart
      for all US revenue reporting instead of fact_orders.net_revenue.
    columns:
      - name: order_id
        description: "Source system order identifier."
        tests: [unique, not_null]
      - name: order_code
        description: "Source system order code from Sapo."
        tests: [not_null]
      - name: total_us_revenue_excl_vat
        description: "Sum of (quantity × us_price_excl_vat) across all line items"
      - name: total_us_revenue_incl_vat
        description: "Sum of (quantity × us_price_incl_vat) across all line items"
      - name: has_unpriced_sku
        description: "TRUE if any line item had no matching price in the price list"

  - name: int_crm_party_tag_flags
    description: >
      Aggregates CRM party tags (risk, vip_tier categories) to 1 row per customer_id.
      Only source='crm_user' tags count as signal (sync-origin tags from
      260619-0830-crm-tag-acl-sync are classification data, not human judgment —
      see model SQL comment). Archived tags (crm_tag.is_archived, 260706-0833
      Governance Admin) are excluded — archiving a tag retires it from the action
      queue, not just from CRM pickers. Consumed by mart_customer_action_queue to
      extend VIP eligibility and drive the MANUAL_RISK_REVIEW action_type.
    columns:
      - name: customer_id
        description: "Sapo customer_id (INTEGER), resolved via crm_party_identity in stg_crm__party_tag."
        tests: [unique, not_null]
      - name: has_vip_tag
        description: "TRUE if customer has any non-archived vip_tier tag from a human (crm_user) assignment."
      - name: vip_tag_labels
        description: "Comma-concatenated display labels of vip_tier tags."
      - name: has_risk_tag
        description: "TRUE if customer has any non-archived risk tag from a human (crm_user) assignment."
      - name: risk_tag_labels
        description: "Comma-concatenated display labels of risk tags."
      - name: tags_updated_at
        description: "Latest tagged_at timestamp across this customer's qualifying tags."

  - name: mart_customer_action_queue
    description: >
      Actionable outreach queue: one row per RETAIL customer needing outreach.
      action_type drives the detailView Actions tab and CS/Sales daily workflow.
      Excludes BRONZE-tier and margin-negative customers by design.
    columns:
      - name: customer_key
        data_type: varchar
        tests: [not_null]
      - name: customer_id
        data_type: varchar
      - name: customer_code
        data_type: varchar
      - name: full_name
        data_type: varchar
      - name: phone
        data_type: varchar
      - name: email
        data_type: varchar
      - name: value_group
        data_type: varchar
      - name: customer_status
        data_type: varchar
      - name: next_purchase_signal
        data_type: varchar
      - name: discount_sensitivity
        data_type: varchar
      - name: lifetime_value
        data_type: bigint
      - name: order_count
        data_type: integer
      - name: avg_order_spend
        data_type: bigint
      - name: avg_days_between_orders
        data_type: double
      - name: cancel_rate
        data_type: double
      - name: recency_days
        data_type: integer
      - name: last_order_date
        data_type: date
      - name: predicted_next_purchase_date
        data_type: date
      - name: channel_preference
        data_type: varchar
      - name: product_affinity
        data_type: varchar
      - name: last_purchased_product
        data_type: varchar
      - name: last_purchased_sku
        data_type: varchar
      - name: top_affinity_product
        data_type: varchar
      - name: top_affinity_sku
        data_type: varchar
      - name: second_affinity_product
        data_type: varchar
      - name: payment_behavior
        data_type: varchar
      - name: is_contactable
        data_type: boolean
        description: >
          Passthrough from mart_customer_tier.is_contactable (dim_customers.is_contactable
          is the canonical source) — stricter than a bare phone-presence check, excludes
          masked/obfuscated marketplace-relay phones.
      - name: strategic_tier
        data_type: varchar
        description: "Passthrough from mart_customer_tier.strategic_tier — enrichment column, available as a future branching predicate."
      - name: lifetime_contribution_margin
        data_type: bigint
      - name: is_margin_negative
        data_type: boolean
      - name: action_type
        data_type: varchar
        tests: [not_null]
      - name: has_manual_risk_flag
        data_type: boolean
        description: >
          TRUE if customer has a human-assigned (source='crm_user') risk tag,
          regardless of which action_type won the CASE (e.g. still TRUE for a
          VIP customer whose action_type is CALL_NOW/WIN_BACK, not just
          MANUAL_RISK_REVIEW). Prevents the risk signal from being silently
          dropped when a higher-priority VIP branch wins the CASE.
      - name: risk_tag_labels
        data_type: varchar
        description: "Comma-concatenated display labels of the customer's risk tags. NULL when has_manual_risk_flag is FALSE."
      - name: priority_rank
        data_type: integer
        tests: [not_null]
      - name: action_rationale
        data_type: varchar
      - name: value_at_stake
        data_type: bigint
      - name: queue_generated_at
        data_type: timestamp with time zone
      - name: last_contacted_at
        data_type: timestamp with time zone
      - name: last_contact_result
        data_type: varchar
      - name: last_contact_channel
        data_type: varchar
      - name: is_recently_contacted_positively
        data_type: boolean

  - name: mart_customer_sku_action_queue
    description: >
      Product-aware outreach queue. Grain: (customer_key, sku) — one row per customer
      per core SKU needing action today. One customer can have multiple rows (one per SKU).
      Companion to mart_customer_action_queue (customer-level behavioral signals).
      5 action types for supply_stream='purchased': USAGE_FOLLOWUP (D5-9), PROGRESS_CHECK (D12-16),
      REORDER_OVERDUE (>7d past depletion), REORDER_NUDGE (D-7 to D0), REORDER_PREEMPT (within lead days).
      Priority ranks integrate with the customer-level queue: 2=OVERDUE, 3=NUDGE, 5=PREEMPT,
      6=PROGRESS_CHECK, 7=USAGE_FOLLOWUP (GIFT_TO_PURCHASE falls to the default rank 9).
      GIFT_TO_PURCHASE (supply_stream='gift_only', Phase 4) ships enabled=false in
      seed_action_scenario_registry — computed but suppressed pending timing-rule review.
    columns:
      - name: customer_key
        data_type: varchar
        tests: [not_null]
      - name: customer_id
        data_type: integer
      - name: sku
        data_type: varchar
        tests: [not_null]
      - name: product_group
        data_type: varchar
      - name: product_display_name
        data_type: varchar
      - name: last_purchase_date
        data_type: date
      - name: last_order_qty
        data_type: integer
      - name: effective_supply_days
        data_type: integer
      - name: estimated_depletion_date
        data_type: date
      - name: days_until_depletion
        data_type: integer
      - name: days_since_order
        data_type: integer
      - name: is_contactable
        data_type: boolean
        description: >
          Passthrough from mart_customer_tier.is_contactable (dim_customers.is_contactable
          is the canonical source) — stricter than a bare phone-presence check, excludes
          masked/obfuscated marketplace-relay phones.
      - name: strategic_tier
        data_type: varchar
        description: "Passthrough from mart_customer_tier.strategic_tier — enrichment column, available as a future branching predicate."
      - name: action_type
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['USAGE_FOLLOWUP', 'PROGRESS_CHECK', 'REORDER_OVERDUE', 'REORDER_NUDGE', 'REORDER_PREEMPT', 'GIFT_TO_PURCHASE']
      - name: priority_rank
        data_type: integer
        tests: [not_null]
      - name: action_rationale
        data_type: varchar
      - name: queue_generated_at
        data_type: timestamp with time zone
