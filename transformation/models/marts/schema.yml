version: 2

models:
  # Dimensions
  - name: dim_customers
    description: "Customer dimension with CLV and RFM metrics."
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: lifetime_value
        description: "Total collected from customer (after discounts, incl. tax). Formula: SUM(fact_orders.total_collected)"
      - name: recency_days
        description: "Days since last order. Formula: CURRENT_DATE - MAX(order_date)"
      - name: frequency
        description: "Total count of distinct orders. Formula: COUNT(order_id)"
      - name: customer_status
        description: "RFM Status. Logic: Active (<=30 days), At Risk (31-90 days), Churned (>90 days)"

  - name: dim_customers_base
    description: "Base customer dimension (SCD Type 1) without circular dependencies."
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: dob
        description: "Date of Birth"
      - name: sex
        description: "Gender/Sex of the customer"
      - name: customer_group
        description: "Customer Group Code/Name"
      - name: loyalty_point
        description: "Loyalty points balance"


  - name: dim_products
    description: "Product dimension derived from sales."
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: brand_name
        description: "Standardized product brand name"
        data_type: varchar
      - name: brand_code
        description: "Product brand abbreviation code"
        data_type: varchar

  - name: dim_channels
    description: "Sales channel dimension."
    columns:
      - name: channel_key
        tests: [unique, not_null]
      - name: channel_name
        data_type: varchar
      - name: channel_code
        data_type: varchar
      - name: channel_category
        description: "Ecommerce / Offline / Internal / Other"
        data_type: varchar
      - name: platform_group
        data_type: varchar
      - name: platform
        data_type: varchar
      - name: channel_brand
        description: "Brand that owns this channel"
        data_type: varchar
      - name: market
        description: "Domestic / Export"
        data_type: varchar
      - name: customer_segment
        description: "B2C / B2B"
        data_type: varchar
      - name: is_sales_channel
        description: "true = real sales channel (not System/Internal)"
        data_type: boolean

  - name: dim_staff
    description: "Salesperson/Staff dimension."
    columns:
      - name: staff_key
        tests: [unique, not_null]

  - name: dim_time
    description: "Time dimension (Minute grain) with business hour flags."
    columns:
      - name: time_key
        description: "Integer HHMM (e.g., 0930, 2359)"
        tests: [unique, not_null]
      - name: time_of_day_24
        description: "HH:MM format"
      - name: time_of_day_12
        description: "HH:MM AM/PM format"
      - name: hour_24
        description: "Hour of day (0-23)"
      - name: is_business_hour
        description: "Boolean: Is between 09:00 and 17:00"
      - name: is_peak_hour
        description: "Boolean: Is Lunch (11-14) or Dinner (16-19)"
      - name: day_period
        description: "Morning, Afternoon, Evening, Night"

  - name: dim_date
    description: "Calendar date dimension."
    columns:
      - name: date_key
        description: "Integer date key (YYYYMMDD)"
        tests: [unique, not_null]
      - name: date_actual
        description: "Actual date value"

  - name: dim_branch_location
    description: "Location/Warehouse dimension."
    columns:
      - name: branch_location_key
        tests: [unique, not_null]

  - name: dim_payment_methods
    description: "Payment method dimension."
    columns:
      - name: payment_method_key
        tests: [unique, not_null]

  - name: dim_order_status
    description: "Order status dimension (Static)."
    columns:
      - name: status_key
        tests: [unique, not_null]

  - name: dim_product_types
    description: "Product type dimension."
    columns:
      - name: product_type_key
        tests: [unique, not_null]

  - name: dim_promotions
    description: "Promotion dimension."
    columns:
      - name: promotion_key
        tests: [unique, not_null]

  - name: dim_geography
    description: "Geography dimension."
    columns:
      - name: geography_key
        tests: [unique, not_null]

  # Facts
  - name: fact_sales
    description: "Transactional sales fact (line item grain)."
    columns:
      - name: order_id
        tests: [not_null]
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: product_type_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product_types')
                field: product_type_key
      - name: staff_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: status_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_order_status')
                field: status_key
      - name: customer_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers_base')
                field: customer_key
      - name: branch_location_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_branch_location')
                field: branch_location_key
      - name: channel_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: shipping_geography_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: billing_geography_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: time_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: revenue
        description: "Total revenue (quantity * line_amount)"
      - name: discount_amount
        description: "Direct discount amount"
      - name: distributed_discount_amount
        description: "Distributed discount amount"

  - name: fact_orders
    description: "Aggregated order fact."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers_base')
                field: customer_key
      - name: shipping_geography_key
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
              config:
                severity: warn
      - name: billing_geography_key
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
              config:
                severity: warn
      - name: channel_key
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel_key
      - name: promotion_key
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_promotions')
                field: promotion_key
              config:
                severity: warn
      - name: staff_key
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_staff')
                field: staff_key
      - name: status_key
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_order_status')
                field: status_key
      - name: branch_location_key
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('dim_branch_location')
                field: branch_location_key
      - name: date_key
        data_type: integer
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: time_key
        data_type: integer
        tests:
          - relationships:
              arguments:
                to: ref('dim_time')
                field: time_key
      - name: gross_revenue
        description: "Giá bán × SL (trước chiết khấu & thuế). Formula: net_revenue + discount_amount"
      - name: discount_amount
        description: "Tổng chiết khấu (coupon, promotion, combo)"
      - name: net_revenue
        description: "Doanh thu thuần (sau chiết khấu, trước thuế). Formula: total_collected - tax_amount"
      - name: tax_amount
        description: "Thuế VAT (8% hoặc 10%)"
      - name: total_collected
        description: "Tổng thu từ khách (sau chiết khấu, gồm thuế). Đây là field gốc $.total từ Sapo"
      - name: client_details
        description: "JSON details about client (IP, User Agent)"
      - name: discount_codes
        description: "JSON list of discount codes"

  - name: fact_payments
    description: "Transactional payment fact (one row per payment attempt/transaction)."
    columns:
      - name: payment_key
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: payment_method_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_payment_methods')
                field: payment_method_key
      - name: amount
        description: "Transaction amount"
      - name: status
        description: "Payment status (paid, pending, etc)"
      - name: payment_timestamp
        description: "Time of payment creation"
      - name: paid_on
        description: "Time of payment completion"
