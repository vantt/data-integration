sapo_warehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DATA_LAKE_PATH') }}/sapo_warehouse.duckdb"
      threads: 1
      extensions:
        - parquet
        - httpfs # if reading from S3/remote in future
      external_root: "{{ env_var('DBT_EXPORT_PATH') }}"
      settings:
        memory_limit: '5GB'
        threads: 1
        preserve_insertion_order: false
        TimeZone: 'Asia/Ho_Chi_Minh'

