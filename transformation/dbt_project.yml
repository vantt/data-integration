name: "sapo_warehouse"
version: "1.0.0"
config-version: 2

profile: "sapo_warehouse"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

seeds:
  sapo_warehouse:
    # Classification seeds live in seeds/taxonomy/. +column_types is keyed by folder path
    # (fqn), so each seed is configured under its folder, not under the project root.
    taxonomy:
      ref_order_sources:
        +column_types:
          id: varchar
          name: varchar
          status: boolean
          platform: varchar
          channel_format: varchar
          is_generic_source: boolean
          mapping_tag: varchar
          channel_brand: varchar
          market: varchar
          source_type: varchar
      ref_brands:
        +column_types:
          vendor_raw: varchar
          brand_name: varchar
          brand_code: varchar
      ref_misa_channel_codes:
        +column_types:
          channel_code: varchar
          channel_name: varchar
          channel_group: varchar
    # Business data of the Fine Japan tenant for the packs (seeds/tenants/fine_japan/).
    tenants:
      fine_japan:
        seed_action_scenario_registry:
          +column_types:
            enabled: boolean
# Dispatch configuration
dispatch:
  - macro_namespace: dbt
    search_order: ["sapo_warehouse", "dbt"]

target-path: "target" # directory which will store compiled SQL files
clean-targets: # directories to be removed by 'dbt clean'
  - "target"
  - "dbt_packages"

models:
  sapo_warehouse:
    # Config for all models
    +materialized: view # Default to view for lightweight transformations

    # Layer configs. Schema, materialization and selection tags depend on the LAYER
    # (staging / intermediate / marts), never on the module folder, so moving a model
    # between modules keeps its relation. Each layer is defined once as a YAML anchor
    # (&layer_staging, &layer_intermediate, &layer_marts) where it is first used and every
    # other module reuses it. Layout: models/<module>/<layer>/... (docs/architecture/modules.md).
    # Modules (bucket of every model: scripts/checks/model_buckets.yaml)
    connectors:
      sapo_v2:
        staging: &layer_staging
          +schema: staging
          +materialized: view
          +tags: ["otp"]
        intermediate: &layer_intermediate
          +materialized: external
          +options:
            format: "parquet"
          shopee:
            +tags: ["int", "shopee"]
          misa:
            +tags: ["int", "misa"]
          us_shipment:
            +tags: ["int", "us_shipment"]
      shopee:
        staging: *layer_staging
      misa:
        staging: *layer_staging
      gsheet:
        staging: *layer_staging
      hug:
        staging: *layer_staging
      facebook_ads:
        staging: *layer_staging
      facebook_messenger:
        staging: *layer_staging
    cdm:
      staging: *layer_staging
    core:
      intermediate: *layer_intermediate
      marts: &layer_marts
        +schema: marts
        +materialized: external
        +options:
          format: "parquet"
        +tags: ["olap"]
        +on_schema_change: sync_all_columns
    packs:
      finance:
        staging: *layer_staging
        intermediate: *layer_intermediate
        marts: *layer_marts
      marketplace:
        intermediate: *layer_intermediate
      crm:
        staging: *layer_staging
        marts: *layer_marts
      hug:
        staging: *layer_staging
        marts: *layer_marts
      sales_playbook:
        marts: *layer_marts
      facebook_ads:
        marts: *layer_marts
      facebook_messenger:
        marts: *layer_marts
    tenants:
      fine_japan:
        staging: *layer_staging
        intermediate: *layer_intermediate
        marts: *layer_marts

vars:
  external_root: "{{ env_var('DBT_EXPORT_PATH') }}"
