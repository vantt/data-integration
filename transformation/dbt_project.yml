name: "sapo_warehouse"
version: "1.0.0"
config-version: 2

profile: "sapo_warehouse"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

seeds:
  sapo_warehouse:
    # Classification seeds live in seeds/taxonomy/. +column_types is keyed by folder path
    # (fqn), so each seed is configured under its folder, not under the project root.
    taxonomy:
      ref_order_sources:
        +column_types:
          id: varchar
          name: varchar
          status: boolean
          platform: varchar
          channel_format: varchar
          is_generic_source: boolean
          mapping_tag: varchar
          channel_brand: varchar
          market: varchar
          source_type: varchar
      ref_brands:
        +column_types:
          vendor_raw: varchar
          brand_name: varchar
          brand_code: varchar
      ref_misa_channel_codes:
        +column_types:
          channel_code: varchar
          channel_name: varchar
          channel_group: varchar
      # Canonical label codes per domain (preview, not final): seeds/taxonomy/README via
      # transformation/docs/TAXONOMY.md "Lớp ánh xạ nhãn → mã chuẩn".
      taxonomy_canonical:
        +column_types:
          domain: varchar
          code: varchar
          parent_code: varchar
          name_vi: varchar
          name_en: varchar
          is_reserved: boolean
      # Classification rules, product default layer (one row = one condition; schema and
      # semantics: docs/architecture/taxonomy-engine.md "Hiện thực MVP"). Every column typed:
      # an untyped value column would be inferred as a number and lose text such as '_'.
      taxonomy_rule_product:
        +column_types:
          rule_id: varchar
          domain: varchar
          priority: integer
          label: varchar
          feature: varchar
          op: varchar
          value: varchar
          value_to: varchar
          enabled: boolean
          note: varchar
    # Product seeds: what each connector provides and which module needs it
    # (seeds/capabilities/README.md). Read by monitoring/mart_capabilities.
    capabilities:
      connector_capabilities:
        +column_types:
          connector_id: varchar
          capability: varchar
          note: varchar
      capability_catalog:
        +column_types:
          capability: varchar
          required_by: varchar
          description_vi: varchar
    # Core defaults of the tenant seeds core reads (seeds/defaults/<seed>__default.csv): header
    # only, so they load as 0-row tables. tenant_ref('<seed>') reads them when var `tenant` is
    # empty. Every column needs a type (an untyped header-only CSV loads as INTEGER); types are
    # those of the Fine Japan seed in the warehouse. check_boundaries.py rule
    # `tenant-seed-contract` keeps headers and column_types in line with the tenant seed.
    defaults:
      seed_channel_targets__default:
        +column_types:
          channel_name: varchar
          period_month: date
          metric_type: varchar
          target_value: double
          target_source: varchar
          notes: varchar
      seed_sku_regimen_config__default:
        +column_types:
          sku: varchar
          product_group: varchar
          display_name: varchar
          supply_days_per_unit: integer
          dose_reduction_buffer: double
          remind_lead_days: integer
          journey_enabled: boolean
      taxonomy_label__default:
        +column_types:
          domain: varchar
          label: varchar
          label_std: varchar
          note: varchar
      taxonomy_rule_tenant__default:
        +column_types:
          rule_id: varchar
          domain: varchar
          priority: integer
          label: varchar
          feature: varchar
          op: varchar
          value: varchar
          value_to: varchar
          enabled: boolean
          note: varchar
      seed_sku_alias_manual__default:
        +column_types:
          sapo_pack_sku: varchar
          sapo_pack_unit: varchar
          sapo_base_sku: varchar
          sapo_base_unit: varchar
          units_per_pack: integer
          misa_join_key: varchar
          misa_qty_multiplier: integer
          notes: varchar
    # Business data of the Fine Japan tenant for the packs (seeds/tenants/fine_japan/).
    tenants:
      fine_japan:
        seed_action_scenario_registry:
          +column_types:
            enabled: boolean
        taxonomy_label:
          +column_types:
            domain: varchar
            label: varchar
            label_std: varchar
            note: varchar
        # Classification rules, tenant layer (same columns as taxonomy_rule_product).
        taxonomy_rule_tenant:
          +column_types:
            rule_id: varchar
            domain: varchar
            priority: integer
            label: varchar
            feature: varchar
            op: varchar
            value: varchar
            value_to: varchar
            enabled: boolean
            note: varchar
# Dispatch configuration
dispatch:
  - macro_namespace: dbt
    search_order: ["sapo_warehouse", "dbt"]

target-path: "target" # directory which will store compiled SQL files
clean-targets: # directories to be removed by 'dbt clean'
  - "target"
  - "dbt_packages"

models:
  sapo_warehouse:
    # Config for all models
    +materialized: view # Default to view for lightweight transformations

    # Layer configs. Schema, materialization and selection tags depend on the LAYER
    # (staging / intermediate / marts), never on the module folder, so moving a model
    # between modules keeps its relation. Each layer is defined once as a YAML anchor
    # (&layer_staging, &layer_intermediate, &layer_marts) where it is first used and every
    # other module reuses it. Layout: models/<module>/<layer>/... (docs/architecture/modules.md).
    # Modules (bucket of every model: scripts/checks/model_buckets.yaml)
    connectors:
      sapo_v2:
        staging: &layer_staging
          +schema: staging
          +materialized: view
          +tags: ["otp"]
        intermediate: &layer_intermediate
          +materialized: external
          +options:
            format: "parquet"
          shopee:
            +tags: ["int", "shopee"]
          misa:
            +tags: ["int", "misa"]
          us_shipment:
            +tags: ["int", "us_shipment"]
      shopee:
        staging: *layer_staging
      misa:
        staging: *layer_staging
      gsheet:
        staging: *layer_staging
      hug:
        staging: *layer_staging
      facebook_ads:
        staging: *layer_staging
      facebook_messenger:
        staging: *layer_staging
    cdm:
      staging: *layer_staging
    core:
      intermediate: *layer_intermediate
      marts: &layer_marts
        +schema: marts
        +materialized: external
        +options:
          format: "parquet"
        +tags: ["olap"]
        +on_schema_change: sync_all_columns
    # Pack switch (docs/architecture/modules.md §8). A pack folder is built only when its id is in
    # the dbt variable `enabled_packs`. dbt renders this file before the `vars:` block below is
    # loaded, so var() here sees only `--vars`; the default list is therefore repeated in every
    # `+enabled` and must equal `vars.enabled_packs` and `packs:` in
    # orchestration/config/modules.yaml (check_boundaries.py rule `module-config` prints the block).
    packs:
      finance:
        +enabled: "{{ ('finance' in var('enabled_packs', ['crm', 'hug', 'finance', 'sales_playbook', 'marketplace', 'facebook_ads', 'facebook_messenger'])) | as_bool }}"
        staging: *layer_staging
        intermediate: *layer_intermediate
        marts: *layer_marts
      marketplace:
        +enabled: "{{ ('marketplace' in var('enabled_packs', ['crm', 'hug', 'finance', 'sales_playbook', 'marketplace', 'facebook_ads', 'facebook_messenger'])) | as_bool }}"
        intermediate: *layer_intermediate
      crm:
        +enabled: "{{ ('crm' in var('enabled_packs', ['crm', 'hug', 'finance', 'sales_playbook', 'marketplace', 'facebook_ads', 'facebook_messenger'])) | as_bool }}"
        staging: *layer_staging
        marts: *layer_marts
      hug:
        +enabled: "{{ ('hug' in var('enabled_packs', ['crm', 'hug', 'finance', 'sales_playbook', 'marketplace', 'facebook_ads', 'facebook_messenger'])) | as_bool }}"
        staging: *layer_staging
        marts: *layer_marts
      sales_playbook:
        +enabled: "{{ ('sales_playbook' in var('enabled_packs', ['crm', 'hug', 'finance', 'sales_playbook', 'marketplace', 'facebook_ads', 'facebook_messenger'])) | as_bool }}"
        marts: *layer_marts
      facebook_ads:
        +enabled: "{{ ('facebook_ads' in var('enabled_packs', ['crm', 'hug', 'finance', 'sales_playbook', 'marketplace', 'facebook_ads', 'facebook_messenger'])) | as_bool }}"
        marts: *layer_marts
      facebook_messenger:
        +enabled: "{{ ('facebook_messenger' in var('enabled_packs', ['crm', 'hug', 'finance', 'sales_playbook', 'marketplace', 'facebook_ads', 'facebook_messenger'])) | as_bool }}"
        marts: *layer_marts
    tenants:
      fine_japan:
        staging: *layer_staging
        intermediate: *layer_intermediate
        marts: *layer_marts

vars:
  external_root: "{{ env_var('DBT_EXPORT_PATH') }}"
  # Packs built by this deployment, same ids and order as `packs:` in
  # orchestration/config/modules.yaml. Read by pack_enabled()/pack_ref() in models; override with
  # --vars '{enabled_packs: [...]}' (e.g. scripts/shadow/build-profile.sh).
  enabled_packs: [crm, hug, finance, sales_playbook, marketplace, facebook_ads, facebook_messenger]
  # Connectors of this deployment, same ids and order as `connectors:` in
  # orchestration/config/modules.yaml (check_boundaries.py rule `module-config`). Read by
  # monitoring/mart_capabilities (which capabilities are declared).
  enabled_connectors: [sapo_v2, shopee, misa_amis, sheets, hug]
  # Tenant of this deployment, same as `tenants:` in orchestration/config/modules.yaml ("" when
  # none). tenant_ref('<seed>') reads seeds/tenants/<tenant>/<seed>.csv when set, the core default
  # seeds/defaults/<seed>__default.csv (0 rows) when empty.
  tenant: fine_japan
  # Classification engine registry, read at compile time (docs/architecture/taxonomy-engine.md
  # "Hiện thực MVP"): `features` maps a feature model to its subject, key and typed columns (the
  # public feature catalog); `domains` declares each lbl_<domain> (subject, cardinality,
  # hit_policy, features, label_set, required_features, matched_flags, survey, selftest). Rules
  # are rows of the seeds taxonomy_rule_product / taxonomy_rule_tenant, never here.
  # scripts/checks/check_taxonomy_rules.py validates the rules against this registry.
  taxonomy:
    features: {}
    domains: {}
