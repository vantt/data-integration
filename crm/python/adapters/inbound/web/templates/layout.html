<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ page_title | default('') }}{% endblock %} — CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <!-- Precision design system (tokens → ui-kit → crm → prototype surfaces) -->
  <link rel="stylesheet" href="/static/ds-precision.css">
  <link rel="stylesheet" href="/static/ds-app.css">
  <link rel="stylesheet" href="/static/ds-crm.css">
  <link rel="stylesheet" href="/static/ds-extra.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  {% block head_extra %}{% endblock %}
</head>
<body class="app">

  <!-- ── Global header (C02: brand + customer search + context crumb) ── -->
  <header class="app-header" data-scrolled="false">
    <a class="brand" href="/" aria-label="Trang chủ">
      <span class="brand__dot"></span>
      <span class="brand__name">retail<b>CRM</b></span>
    </a>

    <form class="search" action="/customers" method="get" role="search" data-surface="C02">
      <div class="search__field">
        <input class="search__input" type="search" name="q"
               placeholder="Tìm khách: SĐT, tên, email, code…"
               autocomplete="off"
               value="{{ request.query_params.get('q', '') if request else '' }}">
        <button class="search__submit" type="submit" aria-label="Tìm">
          <!-- icon: search -->
          <svg class="ico" width="15" height="15" viewBox="0 0 16 16" fill="none"
               stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5"></circle>
            <path d="M10.5 10.5 14 14"></path>
          </svg>
        </button>
      </div>
    </form>

    <div class="context-slot">
      <span class="context-crumb"><b>{% block crumb_title %}{{ page_title | default('') }}{% endblock %}</b></span>
      <button class="icon-btn" type="button" aria-label="Tài khoản">
        <!-- icon: user -->
        <svg class="ico" width="15" height="15" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="5.5" r="2.6"></circle>
          <path d="M3.2 13.2c.5-2.6 2.4-4 4.8-4s4.3 1.4 4.8 4"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── App body: sidebar + content ── -->
  <div class="app-body">

    <!-- ── Left-rail navigation (C01) ── -->
    <nav class="crm-nav" aria-label="Điều hướng" data-surface="C01">

      <!-- Group: Hằng ngày -->
      <div class="crm-nav__group">
        <div class="caption crm-nav__eyebrow">Hằng ngày</div>

        <a href="/" class="crm-nav__item" {% if active_screen in ('S01',) %}aria-current="page"{% endif %}>
          <span class="crm-nav__icon">
            <svg class="ico" width="17" height="17" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <path d="M3 2.5h7l3 3v8H3z"></path>
              <path d="M9.5 2.5v3.5H13"></path>
              <path d="M5.5 9h5M5.5 11.3h3"></path>
            </svg>
          </span>
          <span class="crm-nav__label">Worklist</span>
        </a>

        <a href="/customers" class="crm-nav__item" {% if active_screen in ('S02', 'S03') %}aria-current="page"{% endif %}>
          <span class="crm-nav__icon">
            <svg class="ico" width="17" height="17" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <circle cx="6" cy="6" r="2.4"></circle>
              <path d="M2.3 13c.4-2.2 2-3.4 3.7-3.4S9.3 10.8 9.7 13"></path>
              <path d="M10.4 4.2a2.2 2.2 0 0 1 0 4.2M11.4 9.7c1.4.3 2.4 1.4 2.7 3.1"></path>
            </svg>
          </span>
          <span class="crm-nav__label">Khách hàng</span>
        </a>

        <a href="/inbox" class="crm-nav__item" {% if active_screen in ('S05', 'S06') %}aria-current="page"{% endif %}>
          <span class="crm-nav__icon">
            <svg class="ico" width="17" height="17" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <path d="M2 4.5 8 8.5l6-4"></path>
              <rect x="2" y="3" width="12" height="10" rx="1.5"></rect>
            </svg>
          </span>
          <span class="crm-nav__label">Hộp thư</span>
        </a>

        <a href="/tasks" class="crm-nav__item" {% if active_screen in ('S07',) %}aria-current="page"{% endif %}>
          <span class="crm-nav__icon">
            <svg class="ico" width="17" height="17" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <rect x="2.5" y="2.5" width="11" height="11" rx="1.5"></rect>
              <path d="M5.2 8l1.8 1.8L11 6"></path>
            </svg>
          </span>
          <span class="crm-nav__label">Tasks</span>
        </a>
      </div>

      <!-- Group: Tăng trưởng -->
      <div class="crm-nav__group">
        <div class="caption crm-nav__eyebrow">Tăng trưởng</div>

        <a href="/segments" class="crm-nav__item" {% if active_screen in ('S08', 'S09') %}aria-current="page"{% endif %}>
          <span class="crm-nav__icon">
            <svg class="ico" width="17" height="17" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <circle cx="8" cy="8" r="5.5"></circle>
              <path d="M8 8 8 2.5M8 8l4.8 2.7"></path>
            </svg>
          </span>
          <span class="crm-nav__label">Segments</span>
        </a>

        <a href="/campaigns" class="crm-nav__item" {% if active_screen in ('S10', 'S11') %}aria-current="page"{% endif %}>
          <span class="crm-nav__icon">
            <svg class="ico" width="17" height="17" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 6.5 12 3v8L2.5 9.5z"></path>
              <path d="M2.5 6.5v3M5 9.8v2.7h2V10.4"></path>
            </svg>
          </span>
          <span class="crm-nav__label">Chiến dịch</span>
        </a>
      </div>

      <!-- Group: Quản trị -->
      <div class="crm-nav__group">
        <div class="caption crm-nav__eyebrow">Quản trị</div>

        <a href="/dedup" class="crm-nav__item" {% if active_screen in ('S04',) %}aria-current="page"{% endif %}>
          <span class="crm-nav__icon">
            <svg class="ico" width="17" height="17" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <circle cx="6" cy="8" r="3.2"></circle>
              <circle cx="10" cy="8" r="3.2"></circle>
            </svg>
          </span>
          <span class="crm-nav__label">Dedup</span>
        </a>

        <a href="/settings" class="crm-nav__item" {% if active_screen in ('S13',) %}aria-current="page"{% endif %}>
          <span class="crm-nav__icon">
            <svg class="ico" width="17" height="17" viewBox="0 0 16 16" fill="none"
                 stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <circle cx="8" cy="8" r="2"></circle>
              <circle cx="8" cy="8" r="5.4"></circle>
              <path d="M8 1.4v1.2M8 13.4v1.2M14.6 8h-1.2M2.6 8H1.4"></path>
            </svg>
          </span>
          <span class="crm-nav__label">Cài đặt</span>
        </a>
      </div>

      <!-- Footer status bar -->
      <div class="crm-nav__foot">
        <div class="status status--ready">
          <span class="mono caption">SERVING · SYNCED</span>
        </div>
        <div class="crm-nav__sync">CRM v0.7 · LAN-trust</div>
      </div>
    </nav>

    <!-- ── Main content area ── -->
    <main class="app-content">
      {% block content %}{% endblock %}
    </main>

  </div><!-- /.app-body -->

</body>
</html>
