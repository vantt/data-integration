networks:
  caddy_net:
    external: true

services:
  data_platform:
    build:
      context: .
      dockerfile: Dockerfile.dataplatform
    container_name: data_platform
    restart: unless-stopped
    ports:
      - "3000:3001"
    env_file:
      - .env.docker
    environment:
      - DLT_TELEMETRY_DISABLED=true
      - DBT_SEND_ANONYMOUS_USAGE_STATS=false
      - BACKUP_ROOT=/app/var/backups  # must match volume mount below
      - RECON_LIVE_API=1              # enable live Sapo API calls for recon + KPI
      - KPI_CLOSURE_ENABLED=1         # enable Phase 5 revenue invariant check
    networks:
      - caddy_net
    volumes:
      # Code (stateless, git-tracked)
      - ./transformation:/app/transformation
      - ./transformation/target:/app/transformation/target
      - ./ingestion:/app/ingestion
      - ./orchestration:/app/orchestration
      - ./scripts:/app/scripts
      # Data (stateful, persistent) — grouped under /app/var/
      - ./app_data/data_lake:/app/var/data_lake
      # Named volume overlay: isolates monitoring DB from Windows filesystem scanning (prevents dllhost lock)
      - monitoring_db:/app/var/data_lake/monitoring
      - ./app_data/dagster_home:/app/var/dagster_home
      - ./app_data/backups:/app/var/backups
      - ./app_data/input_source:/app/var/input_source
      # Config (read-only)
      - ./.env.docker:/app/.env.docker:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./Dockerfile.dataplatform:/app/Dockerfile.dataplatform:ro
      - ./Dockerfile.metabase:/app/Dockerfile.metabase:ro
    command: sh -c "python scripts/ensure_dbt_directories.py && python scripts/ensure_shopee_safety_placeholder.py && dbt deps --project-dir /app/transformation && dagster instance concurrency set duckdb_lock 1 && dbt parse --project-dir /app/transformation --profiles-dir /app/transformation && (python scripts/maintenance/unstick_concurrency_pools.py || true) && (python scripts/provisioning/bootstrap_reporting.py || true) && dagster dev -h 0.0.0.0 -p 3001 -f orchestration/definitions.py"
    labels:
      caddy: etl.local
      caddy.reverse_proxy: "{{upstreams 3001}}"

  metabase:
    build:
      context: .
      dockerfile: Dockerfile.metabase
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env.docker
    networks:
      - caddy_net
    volumes:
      - ./app_data/metabase_data:/home/metabase/data
      - ./app_data/data_lake:/app/var/data_lake
      - monitoring_db:/app/var/data_lake/monitoring
    labels:
      caddy: bi.local
      caddy.reverse_proxy: "{{upstreams 3000}}"

  rill:
    build:
      context: .
      dockerfile: Dockerfile.rill
    container_name: rill
    restart: unless-stopped
    ports:
      - "3002:9009"
    environment:
      - RILL_EXPORT_ROOT=/app/var/data_lake/export/rill/current
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - caddy_net
    volumes:
      - ./rill:/app/rill
      - ./app_data/data_lake:/app/var/data_lake
      - ./app_data/rill:/app/rill/.rill
    command: ["start", "--no-open", "--port", "9009", "--env", "RILL_EXPORT_ROOT=/app/var/data_lake/export/rill/current"]
    labels:
      caddy: rill.local
      caddy.reverse_proxy: "{{upstreams 9009}}"

  fileserver:
    image: caddy:alpine
    container_name: data_fileserver
    restart: unless-stopped
    ports:
      - "3004:8080"
    networks:
      - caddy_net
    env_file:
      - .env.docker
    volumes:
      # Standalone export DuckDB files (read-only)
      - ./app_data/data_lake/serving/standalone:/data:ro
      # Caddyfile with basic_auth (Option B — inline auth)
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    labels:
      caddy: files.etl.local
      caddy.reverse_proxy: "{{upstreams 8080}}"

volumes:
  monitoring_db:
    # Stored in Docker VM — isolated from Windows filesystem scanning (no dllhost/Defender lock)

# H2 File Note: The database file will be metabase.db.mv.db (Multi-Version store)
