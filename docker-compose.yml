networks:
  caddy_net:
    external: true

services:
  data_platform:
    build:
      context: .
      dockerfile: Dockerfile.dataplatform
    container_name: data_platform
    restart: unless-stopped
    mem_limit: 8g
    cpus: 4
    ports:
      - "3000:3001"
    env_file:
      - .env.docker
    environment:
      - DLT_TELEMETRY_DISABLED=true
      - DBT_SEND_ANONYMOUS_USAGE_STATS=false
      - BACKUP_ROOT=/app/var/backups  # must match volume mount below
      - RECON_LIVE_API=1              # enable live Sapo API calls for recon + KPI
      - KPI_CLOSURE_ENABLED=1         # enable Phase 5 revenue invariant check
    networks:
      - caddy_net
    volumes:
      # Code (stateless, git-tracked)
      - ./transformation:/app/transformation
      - ./transformation/target:/app/transformation/target
      - ./ingestion:/app/ingestion
      - ./orchestration:/app/orchestration
      - ./scripts:/app/scripts
      # Read-only: scripts/build_approach_prompts.py loads the approach-script prompt
      # template from here at runtime (customer-insight-prompt-template.md).
      - ./plans:/app/plans:ro
      # Data (stateful, persistent) — grouped under /app/var/
      - ./app_data/data_lake:/app/var/data_lake
      # Named volume overlay: isolates monitoring DB from Windows filesystem scanning (prevents dllhost lock)
      - monitoring_db:/app/var/data_lake/monitoring
      # Named volume: dagster_home's SQLite storage (run/event-log/schedule DBs) needs
      # reliable file locking — a 9p bind-mount to Windows caused chronic lock hangs
      # (code-server heartbeat misses, health DB stopped writing for 9 days).
      - dagster_home:/app/var/dagster_home
      - ./app_data/backups:/app/var/backups
      - ./app_data/input_source:/app/var/input_source
      - ./app_data/secrets:/app/var/secrets:ro
      # CRM SQLite databases (read-only — for backup access only)
      - crm_data:/app/var/crm_data:ro
      # codex CLI OAuth state (subscription login, not an API key) — named volume so
      # it survives container recreate/rebuild. One-time setup after first `up`:
      #   docker compose exec data_platform codex login
      # Same pattern as ../fgos (agent-codex-config named volume).
      - agent_codex_config:/root/.codex
      # Config (read-only)
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./Dockerfile.dataplatform:/app/Dockerfile.dataplatform:ro
      - ./Dockerfile.metabase:/app/Dockerfile.metabase:ro
    command: sh -c "mkdir -p /app/var/dagster_home && { [ -f /app/var/dagster_home/dagster.yaml ] || cp /app/orchestration/dagster.yaml /app/var/dagster_home/dagster.yaml; } && python scripts/ensure_dbt_directories.py && python scripts/ensure_shopee_safety_placeholder.py && python scripts/ensure_hug_safety_placeholder.py && python scripts/ensure_crm_export_placeholder.py && (python scripts/maintenance/recover_health_db.py || true) && dbt deps --project-dir /app/transformation && dagster instance concurrency set duckdb_lock 1 && dbt parse --project-dir /app/transformation --profiles-dir /app/transformation && (python scripts/maintenance/unstick_concurrency_pools.py || true) && (python scripts/provisioning/bootstrap_reporting.py || true) && dagster dev -h 0.0.0.0 -p 3001 -f orchestration/definitions.py"
    labels:
      caddy: etl.lan.fwg.vn
      caddy.reverse_proxy: "{{upstreams 3001}}"

  metabase:
    build:
      context: .
      dockerfile: Dockerfile.metabase
    container_name: metabase
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    ports:
      - "3001:3000"
    env_file:
      - .env.docker
    networks:
      - caddy_net
    volumes:
      - ./app_data/metabase_data:/home/metabase/data
      - ./app_data/data_lake:/app/var/data_lake:ro
      - monitoring_db:/app/var/data_lake/monitoring
    labels:
      caddy: bi.lan.fwg.vn
      caddy.reverse_proxy: "{{upstreams 3000}}"

  rill:
    build:
      context: .
      dockerfile: Dockerfile.rill
    container_name: rill
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
    ports:
      - "3002:9009"
    environment:
      - RILL_EXPORT_ROOT=/app/var/data_lake/export/rill/current
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - caddy_net
    volumes:
      - ./rill:/app/rill
      - ./app_data/data_lake:/app/var/data_lake:ro
      - ./app_data/rill:/app/rill/.rill
    command: ["start", "--no-open", "--port", "9009", "--env", "RILL_EXPORT_ROOT=/app/var/data_lake/export/rill/current"]
    labels:
      caddy: rill.lan.fwg.vn
      caddy.reverse_proxy: "{{upstreams 9009}}"

  evidence:
    build:
      context: .
      dockerfile: Dockerfile.evidence
    container_name: evidence
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
    ports:
      - "3006:3000"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - caddy_net
    volumes:
      - ./evidence/evidence.config.yaml:/app/evidence.config.yaml
      - ./evidence/pages:/app/pages
      - ./evidence/sources:/app/sources
      - ./evidence/scripts:/app/scripts
      - ./app_data/data_lake:/app/var/data_lake:ro
    labels:
      caddy: evidence.lan.fwg.vn
      caddy.reverse_proxy: "{{upstreams 3000}}"

  # Cloudflare Tunnel — outbound-only, no inbound ports needed.
  # Public hostname config: Cloudflare dashboard → Networks → Tunnels.
  # Token: thêm CLOUDFLARE_TUNNEL_TOKEN vào .env.docker rồi uncomment để dùng.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared
  #   restart: unless-stopped
  #   mem_limit: 128m
  #   cpus: 0.2
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   networks:
  #     - caddy_net

  fileserver:
    image: caddy:alpine
    container_name: data_fileserver
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "3004:8080"
    networks:
      - caddy_net
    env_file:
      - .env.docker
    volumes:
      # Standalone export DuckDB files (read-only)
      - ./app_data/data_lake/serving/standalone:/data:ro
      # Caddyfile with basic_auth (Option B — inline auth)
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    labels:
      caddy: files.lan.fwg.vn
      caddy.reverse_proxy: "{{upstreams 8080}}"

  detail_view:
    build:
      context: .
      dockerfile: Dockerfile.detailview
    container_name: detail_view
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
    ports:
      - "3005:8000"
    env_file:
      - .env.docker
    environment:
      - OLAP_DB_PATH=/app/var/data_lake/serving/olap.duckdb
      - APP_TZ=Asia/Ho_Chi_Minh
      - DETAIL_VIEW_PORT=8000
    networks:
      - caddy_net
    volumes:
      # Read-only: app uses duckdb read_only=True; :ro is defense-in-depth at the OS level.
      - ./app_data/data_lake:/app/var/data_lake:ro
    labels:
      caddy: detailview.lan.fwg.vn
      caddy.reverse_proxy: "{{upstreams 8000}}"

  crm:
    build:
      context: .
      dockerfile: Dockerfile.crm
    container_name: crm
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1
    ports:
      # Bound to localhost only — the Cloudflare Tunnel (cloudflared Windows service)
      # connects via http://127.0.0.1:3007 on the same host. No LAN/external exposure
      # needed; a wide bind here would let anyone on the LAN skip CF Access entirely.
      - "127.0.0.1:3007:8090"
    environment:
      - CRM_DATA_DIR=/data
      - CRM_OLAP_PATH=/app/var/data_lake/serving/olap.duckdb
      - CRM_CACHE_DB=/data/cache.db
      - CRM_PORT=8090
      # Shared secret for POST /admin/refresh (X-Refresh-Token header). Dagster
      # uses this to trigger reverse-ETL on demand. MUST be set in root .env — this is
      # compose ${VAR} substitution, NOT env_file (that's .env.docker, a different var
      # of the same name kept in sync for the Dagster side that sends the header).
      - CRM_REFRESH_TOKEN=${CRM_REFRESH_TOKEN:?CRM_REFRESH_TOKEN must be set in root .env}
      # Shared secret for /api/* mutation routes (X-CRM-Token header). Enforced when set.
      - CRM_API_TOKEN=${CRM_API_TOKEN:?CRM_API_TOKEN must be set in root .env}
      - TZ=Asia/Ho_Chi_Minh
      # Dev: enable uvicorn --reload + Jinja2 auto_reload. Set in docker-compose.override.yml only.
      # Hug edge push: claim station signs POST /hug/token/upsert to the Worker.
      # Secret via root .env substitution (gitignored) — not baked into this tracked file.
      - HUG_WORKER_URL=https://hug.fjp.vn
      - HUG_ADMIN_SECRET=${HUG_ADMIN_SECRET}
      # Sapo REST API — reserved for future order-code live validation.
      # Currently soft-fails (amber) because Sapo uses cookie-only auth.
      # Set both vars if a REST key becomes available.
      - SAPO_API_URL=${SAPO_API_URL:-}
      - SAPO_API_KEY=${SAPO_API_KEY:-}
      - CF_ACCESS_AUDIENCE=${CF_ACCESS_AUDIENCE:-}
      - CF_TEAM_DOMAIN=${CF_TEAM_DOMAIN:-}
      - CF_DEPT_CLAIM=${CF_DEPT_CLAIM:-custom.departments}
      - CF_FUNC_ROLE_CLAIM=${CF_FUNC_ROLE_CLAIM:-custom.functional_roles}
      - CF_ROLE_MAP=${CF_ROLE_MAP:-{}}
      - CF_MANAGER_PREFIXES=${CF_MANAGER_PREFIXES:-truong-phong-,head-of-}
      - CRM_ADMIN_EMAILS=${CRM_ADMIN_EMAILS:-}
      # Cross-origin state-changing request guard — false=log-only, true=block. Flip to
      # true once a log-review cycle confirms no legitimate caller is flagged.
      - CRM_CSRF_ENFORCE=${CRM_CSRF_ENFORCE:-false}
    networks:
      - caddy_net
    volumes:
      # Persistent CRM databases (crm.db + cache.db) — named volume avoids Windows filesystem lock issues.
      - crm_data:/data
      # Verified SQLite backups (crm/ops/backup_crm.py) — named volume (Defender-safe), NOT a host bind.
      - crm_backups:/backups
      # Read-only: whole data_lake mounted so olap.duckdb views can resolve their parquet paths.
      - ./app_data/data_lake:/app/var/data_lake:ro
      # Dev live-reload: mount source so template/static edits are visible without rebuild.
      - ./crm/src:/app/crm/src
      # Ops tooling (backup/restore) — mounted so it's available to `docker exec` without a rebuild.
      - ./crm/ops:/app/crm/ops
      - ./crm/src/adapters/inbound/web/static:/app/crm/src/adapters/inbound/web/static
      # Migrations: mount so new *.up.sql files are picked up on restart without image rebuild.
      - ./crm/migrations:/app/crm/migrations
    # caddy labels removed: crm.lan.fwg.vn now routed via Cloudflare Tunnel

  # Single-purpose sidecar: holds the Docker socket and runs ONLY the CRM
  # restore-verify drill on request (token-gated HTTP). Dagster's crm_restore_verify
  # asset POSTs here after each backup. NO public route, NO published port — reachable
  # only in-cluster by name. Docker-socket blast radius is intentionally confined here
  # (NOT given to data_platform, which runs dlt/dbt/Sapo code).
  crm_drill_runner:
    build:
      context: .
      dockerfile: Dockerfile.drillrunner
    container_name: crm_drill_runner
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      - DRILL_TOKEN=${DRILL_TOKEN:?DRILL_TOKEN must be set in root .env}
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - caddy_net
    volumes:
      # Docker socket = root-on-host. ONLY this single-purpose, no-route sidecar gets it.
      - /var/run/docker.sock:/var/run/docker.sock
      # Drill code (read-only): restore_verify_crm.py + drill_runner_server.py + backup_crm.py
      - ./crm:/app/crm:ro
      # Backups to restore from (read-only) + scratch volume the ephemeral CRM boots from.
      - crm_backups:/backups:ro
      - crm_verify_data:/verify_data

volumes:
  dagster_home:
    # Dagster's SQLite storage (runs.db, schedules.db, per-run event logs) — stored in
    # Docker VM for reliable locking, same reasoning as monitoring_db below. Previously a
    # host bind-mount (./app_data/dagster_home) which went through 9p and caused chronic
    # SQLite lock hangs; started fresh here (old run-history metadata was disposable).
  monitoring_db:
    # Stored in Docker VM — isolated from Windows filesystem scanning (no dllhost/Defender lock)
  crm_data:
    # CRM SQLite databases (crm.db + cache.db) — stored in Docker VM for consistent locking.
  crm_backups:
    # Verified CRM SQLite backup snapshots (crm/ops/backup_crm.py) — Docker VM, Defender-safe.
  crm_verify_data:
    # Scratch /data for the restore-verify drill's ephemeral CRM. A named volume (not a
    # host bind) so it resolves on the host daemon when the socket-mounted sidecar boots
    # the sibling container — host-bind paths would not translate. Cleared each run.
  agent_codex_config:
    # codex CLI OAuth session (~/.codex in data_platform) — NOT the host's ~/.codex
    # (that holds personal logs/memories unrelated to this container). Populated by
    # a one-time `docker compose exec data_platform codex login` after first `up`.

# H2 File Note: The database file will be metabase.db.mv.db (Multi-Version store)
